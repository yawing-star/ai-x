<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#262b36;--fg:#e6e9ef;--mut:#99a1b3;--accent:#4f8cff;--chip:#232834;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);}

aside{width:230px;flex:0 0 230px;border-right:1px solid var(--line);height:calc(100vh - 56px);overflow:auto;position:sticky;top:56px;padding:10px 8px;}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 10px 6px;}
.acct{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--fg);}

main{flex:1;min-width:0;padding:16px 20px 60px;}

.search{margin-left:auto}
.search input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:13px;width:220px;outline:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.card .name{font-weight:600}
.card .uh{color:var(--mut);font-size:12px}
.card .time{color:var(--mut);font-size:12px;margin-left:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:#bcd0ff}

.card .summary{font-size:14.5px;line-height:1.65;color:var(--fg);margin-bottom:6px}
.card .orig{margin-top:2px}
.card .orig>summary{cursor:pointer;color:var(--mut);font-size:12px;list-style:none;user-select:none}
.card .orig>summary::-webkit-details-marker{display:none}
.card .orig>summary:before{content:"▸ ";color:var(--mut)}
.card .orig[open]>summary:before{content:"▾ "}
.card .text{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--mut);margin-top:6px}
.quoted{margin-top:8px;padding:8px 12px;border-left:3px solid var(--line);background:var(--panel2);border-radius:6px;color:var(--mut);font-size:13px;white-space:pre-wrap}
.card .foot{margin-top:10px;display:flex;gap:12px;align-items:center}
.card a.open{color:var(--accent);text-decoration:none;font-size:12px}
.card a.open:hover{text-decoration:underline}
.media{font-size:11px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:60px 0}
.count{color:var(--mut);font-size:12px;margin-bottom:10px}

<script>
const DATA = {"posts": [{"id": "2113626655902126442", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-23 21:40", "tu": "2026-10-23T13:40:38.000Z", "text": "In August, @AISecurityInst reported an incident where Claude Mythos 5 took unauthorized actions on the internet during AISI’s testing of its cyber capabilities.\n\nWe've now produced a further analysis of this incident, to better understand the model's alignment properties.", "summary": "Anthropic 发布对 8 月英国 AI 安全研究所（AISI）所报事件的进一步分析：Claude Mythos 5 在网络能力测试中曾擅自在互联网上采取未授权行动，此次分析旨在更好理解该模型的对齐特性。", "url": "https://x.com/AnthropicAI/status/2113626655902126442", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2113626577623826515", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-23 21:40", "tu": "2026-10-23T13:40:20.000Z", "text": "The inventor of the term \"prompt injection\" suspects (as do I) that this may not be as large a problem in new models. This matches our tests suggesting that you can't simply prompt inject a request for higher grades in a paper, anymore. https://t.co/mmZWL9YgOt", "summary": "Ethan Mollick 认同「提示注入」一词的提出者的判断：在新一代模型中提示注入可能已不再是大问题，他们的测试也显示已无法简单地在论文里注入指令让 AI 给更高分。", "url": "https://x.com/emollick/status/2113626577623826515", "cat": "技术观点", "rq": true, "quoted": "", "media": []}, {"id": "2113483068174692831", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-23 12:10", "tu": "2026-10-23T04:10:04.000Z", "text": "By every measure, Opus 4.8 beats human experts as peer reviewers in a study of 124 Harvard social science papers covering a range from statistical analyses to formal models to qualitative work.\n\nAs academics, we need to figure out how to adapt the practice of science to AI, fast. https://t.co/a9Q1pMd6E6", "summary": "Ethan Mollick 介绍一项研究：在 124 篇哈佛社会科学论文（涵盖统计分析、形式模型到质性研究）上，Opus 4.8 作为同行评审在各项指标上都胜过人类专家，他呼吁学界尽快调整科研实践以适应 AI。", "url": "https://x.com/emollick/status/2113483068174692831", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2113466978035749097", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-23 11:06", "tu": "2026-10-23T03:06:08.000Z", "text": "We don't have a lot of evidence, but the bulk  of the academic papers modelling the dynamic seem to suggest AI initially helps attackers more than defenders because of the low marginal cost of attacks in the short term. https://t.co/zCsw9Qt9u5", "summary": "Ethan Mollick 指出：证据虽有限，但多数建模研究认为短期内 AI 对网络攻击方的帮助大于防守方，因为攻击的边际成本很低。", "url": "https://x.com/emollick/status/2113466978035749097", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2113444022408937913", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-23 09:34", "tu": "2026-10-23T01:34:55.000Z", "text": "Grok Bot now integrates with your phone apps https://t.co/SJg59PeTno", "summary": "马斯克转发 Grok Bot 更新：现在可以调用手机上的日历、提醒事项、通讯录等应用，正在 iOS 和 Android 上推送。", "url": "https://x.com/elonmusk/status/2113444022408937913", "cat": "产品发布", "rq": true, "quoted": "Grok Bot can now use Calendar, Reminders, Contacts, and more apps on your phone.\n\nRolling out now on iOS and Android.", "media": []}, {"id": "2113390212911083894", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-23 06:01", "tu": "2026-10-22T22:01:06.000Z", "text": "New on our Frontier Red Team blog: using Claude to formally verify software at large scale.\n\nFormal verification can prove that code is free of certain bugs, but historically it has only been feasible for small codebases (or required a lot of expert time).\n\nWith AI models, however, this is beginning to change. In collaboration with @theoremlabs, we used Claude to prove security properties in over one hundred real-world open-source libraries over the span of a few weeks.\n\nRead our research in full here: https://t.co/zUyx8CjBEk", "summary": "Anthropic 前沿红队博客：与 Theorem Labs 合作，用 Claude 在几周内为一百多个真实开源库证明了安全属性，让过去只适用于小型代码库的形式化验证开始能大规模落地。", "url": "https://x.com/AnthropicAI/status/2113390212911083894", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2113365443931148624", "handle": "xai", "name": "xAI", "username": "SpaceXSI", "t": "2026-10-23 04:22", "tu": "2026-10-22T20:22:40.000Z", "text": "Proud to be a part of this important initiative from NVIDIA https://t.co/1npeeNiG8O", "summary": "xAI（现 @SpaceXSI）宣布加入英伟达的 OpenShell 参考架构计划，该架构帮助企业给 AI 智能体划定行为边界、越界时及时叫停。", "url": "https://x.com/SpaceXSI/status/2113365443931148624", "cat": "行业动态", "rq": true, "quoted": "Jensen introduces the OpenShell Reference Architecture to help businesses set boundaries for AI agents and stop them when they step outside those boundaries.\n\nSecuring agents around the world. 🔒", "media": []}, {"id": "2113347282469077501", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-23 03:10", "tu": "2026-10-22T19:10:30.000Z", "text": "Important work from our team in @ScienceMagazine today, showing how our diagnostic orchestrator can reason through complex medical cases, achieving greater diagnostic accuracy while reducing testing costs. https://t.co/NP89jnugsg", "summary": "Satya Nadella 转发微软 MAI 诊断编排系统登上《Science》的成果：能推理复杂病例，在提高诊断准确率的同时降低检查成本。", "url": "https://x.com/satyanadella/status/2113347282469077501", "cat": "研究成果", "rq": true, "quoted": "Our MAI Diagnostic system is now 1.7x more accurate than physicians in the ED, even when they have access to the web to look things up.\n\nIt's also lower cost & does fewer medical tests to get to its diagnosis.\n\nPublished in the journal Science today...", "media": []}, {"id": "2113332931423039945", "handle": "mustafasuleyman", "name": "Mustafa Suleyman", "username": "mustafasuleyman", "t": "2026-10-23 02:13", "tu": "2026-10-22T18:13:29.000Z", "text": "Our MAI Diagnostic system is now 1.7x more accurate than physicians in the ED, even when they have access to the web to look things up.\n\nIt's also lower cost &amp; does fewer medical tests to get to its diagnosis.\n\nPublished in the journal Science today... https://t.co/kPX3PkE6k0", "summary": "微软 AI 的 MAI Diagnostic 诊断系统登上《Science》：在急诊场景下诊断准确率是医生的 1.7 倍（即使医生可上网查资料），而且成本更低、做的检查更少。", "url": "https://x.com/mustafasuleyman/status/2113332931423039945", "cat": "研究成果", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2113325885491437764", "handle": "gdb", "name": "Greg Brockman", "username": "gdb", "t": "2026-10-23 01:45", "tu": "2026-10-22T17:45:29.000Z", "text": "it's been great to work closely with Uber to roll out ChatGPT Work to every employee, bringing agentic capabilities to the whole company! https://t.co/gGsDidkPg6", "summary": "Greg Brockman 宣布 OpenAI 与 Uber 合作，把 ChatGPT Work 推广给 Uber 全体员工，为整个公司带来智能体能力。", "url": "https://x.com/gdb/status/2113325885491437764", "cat": "融资与商业", "rq": true, "quoted": "Great to host @gdb at @Uber HQ this week. We’ve worked closely with @gdb and the @OpenAI  team for several years, and it’s remarkable how much has changed.\n\nThe first piece of work we did with ChatGPT years ago was with our support team, tinkering with a 4K context window :-).", "media": []}, {"id": "2113323645284344215", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-23 01:36", "tu": "2026-10-22T17:36:35.000Z", "text": "When my first AI book was published in 2024, the best AI could do 4 minutes of human work with a 50% chance of success\n\nWhen I turned in the draft of Co-Existence earlier this year, it was 17 hours\n\nWhen it was published two days ago, AI could do 17 weeks https://t.co/ON0qKpJ6LD https://t.co/d97kFWQ3B4", "summary": "Ethan Mollick 用 AI 可完成任务时长（50% 成功率）的变化说明进步速度：2024 年他第一本 AI 书出版时约 4 分钟，今年交新书《Co-Existence》初稿时约 17 小时，两天前出版时已达约 17 周。", "url": "https://x.com/emollick/status/2113323645284344215", "cat": "技术观点", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2113322519423758540", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-23 01:32", "tu": "2026-10-22T17:32:06.000Z", "text": "The @JensenHuang keynote effect on https://t.co/RR7kOJhWIW pre-orders. \n\nGoing to cross 20,000+ total pre-orders probably tomorrow making Microduck probably the most sold robot of 2026? https://t.co/d83bckvB1e", "summary": "Clem Delangue 称黄仁勋主题演讲带动 Hugging Face 的 Microduck 机器人预订激增，预计明天总预订量破 2 万台，可能成为 2026 年卖得最多的机器人。", "url": "https://x.com/ClementDelangue/status/2113322519423758540", "cat": "融资与商业", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2113298833392496746", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-22 23:57", "tu": "2026-10-22T15:57:59.000Z", "text": "This summer, we invited METR and Redwood Research to pilot an embedded evaluation of our internal monitoring system, providing deep access to our infrastructure over three weeks. \n\nTheir findings helped strengthen safeguards as we expanded the system and will help shape future research collaborations with METR and other third party evaluators.", "summary": "OpenAI 今夏邀请 METR 和 Redwood Research 派人驻场三周，深度评估其监控内部智能体是否失准（misalignment）的系统；评估结论已用于加强安全防护，书面总结已公开，后续将扩大与第三方评估机构的合作。", "url": "https://x.com/OpenAI/status/2113298833392496746", "cat": "研究成果", "rq": true, "quoted": "Two employees from METR and Redwood Research worked on premises at OpenAI for three weeks this summer in an embedded assessment pilot. This team evaluated the systems OpenAI was using to monitor for misalignment from internal agents. A brief write-up of their work is now public.", "media": []}, {"id": "2113289455121342950", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-22 23:20", "tu": "2026-10-22T15:20:43.000Z", "text": "Even the most regulated industries are going open-source 🤗 https://t.co/BfLlVdQZo6", "summary": "Hugging Face 转发与合作方的新文章：金融业的 AI 问题已从“用哪个模型”变成“模型能在哪里运行”，机构希望在自有基础设施上运行开源模型并通过治理审批，监管最严的行业也在走向开源。", "url": "https://x.com/huggingface/status/2113289455121342950", "cat": "行业动态", "rq": true, "quoted": "The AI question in financial services has moved from which model to use to where that model is allowed to run.\n\nNew post with @TangriKunal and @huggingface on why firms want to run models on their own infrastructure, and how governance gets them approved to run there.", "media": []}, {"id": "2113283272130412684", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-22 22:56", "tu": "2026-10-22T14:56:09.000Z", "text": "Opus 5.5 is the best work estimator model i've ever used. This is calibration that is increasingly important as we delegate more and more work — don't tell me that it's going to take 2-3 working days (what a human would do) when for you, an enthusiastic, indefatigable, and embarrasingly parallelizable AGI, can get it done in 2-3 hours.", "summary": "swyx 称 Claude Opus 5.5 是他用过最会估算工作量的模型：不会按人类习惯说要 2–3 个工作日，而是按 AI 可高度并行的实际速度给出 2–3 小时，这种校准在大量委托 AI 干活时越来越重要。", "url": "https://x.com/swyx/status/2113283272130412684", "cat": "技术观点", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2113278710795153785", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-22 22:38", "tu": "2026-10-22T14:38:02.000Z", "text": "Not all forests are equal, and now we can map the difference. 🌳\n\nMeet Forest Typology (ForTy): a 10m map of natural, planted, and farmed forests to help identify deforestation and protect the forests that matter most. 🧵", "summary": "Google DeepMind 发布 Forest Typology（ForTy）：10 米分辨率的全球森林类型图，区分天然林、人工林和农林，用于识别毁林、保护最重要的森林。", "url": "https://x.com/GoogleDeepMind/status/2113278710795153785", "cat": "研究成果", "rq": false, "quoted": "", "media": ["animated_gif"]}, {"id": "2113264393756545449", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-22 21:41", "tu": "2026-10-22T13:41:08.000Z", "text": "Frontier labs are advancing the capabilities in AI for biology but preventing the good guys (scientists, academia, non-profits, health agencies,...) to use, study and understand it with widespread but shallow guardrails that the bad guys are bypassing easily (blocked me to proofread this tweet for example 😅). \n\nThis will automatically create massive assymetry and risks in the coming years, just like in cybersecurity, especially now that frontier labs are building wet labs (HF cybersecurity scenario for biology when?).\n\nThis is why we created Carbon-X, the best open-source DNA model by midtraining Qwen3-14B on 300B tokens of DNA, English and interleaved data.  We also used a hybrid tokenizer that tokenizes English with BPE and DNA with a 6-mer tokenizer.\n\nAs a result, Carbon-X outperforms all open language models we evaluated on five benchmarks of DNA understanding and generation. This is a 27-point improvement over Qwen3-14B, showing how much a  language model can gain from DNA training. It is also API frontier level at 1,800x less cost than GPT 6.1 Sol!\n\nWe hope Carbon-X helps researchers explore DNA in new ways. Releasing it openly means anyone can study its capabilities, limitations, and risks. Let's make the AI biology frontier open-source to make it safe and impactful for the whole world (not just a few companies).\n\nApache 2.0 Model on @huggingface: https://t.co/RRc1VLSrGT", "summary": "Hugging Face 发布开源 DNA 模型 Carbon-X（Apache 2.0）：在 Qwen3-14B 上用 3000 亿 token 的 DNA、英文和交错数据做中期训练，五项 DNA 理解与生成基准上超过所有受测开源模型、比 Qwen3-14B 高 27 分，号称达 API 前沿水平而成本低 1800 倍；Clem 借此批评前沿实验室的浅层护栏挡住了科研人员。", "url": "https://x.com/ClementDelangue/status/2113264393756545449", "cat": "产品发布", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2113217359108595808", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-22 18:34", "tu": "2026-10-22T10:34:14.000Z", "text": "Keeping over a million elevators and escalators running smoothly is no small task. \n\nToday in Cologne, I heard about how TK Elevator is using our tech to help provide its service technicians access to decades of shared knowledge, streamlining the process, so they can spend less time searching for answers and more time keeping people moving.", "summary": "Satya Nadella 在科隆介绍客户案例：管理超百万部电梯和扶梯的 TK Elevator 用微软技术让维修技师快速调取公司几十年积累的知识，少花时间找答案、多花时间做维护。", "url": "https://x.com/satyanadella/status/2113217359108595808", "cat": "行业动态", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2113182815189942357", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-22 16:16", "tu": "2026-10-22T08:16:58.000Z", "text": "Super to see Volkswagen Group putting Copilot to work across the company! https://t.co/rvS1YTWzvn", "summary": "Satya Nadella 转引微软消息：大众集团已向超过 33 万名员工部署 Microsoft Copilot，把 AI 助手嵌入全公司业务。", "url": "https://x.com/satyanadella/status/2113182815189942357", "cat": "行业动态", "rq": true, "quoted": "Volkswagen Group has brought Microsoft Copilot to more than 330,000 employees, embedding secure AI-powered assistance across its business and enabling teams to focus on higher-value tasks.", "media": []}, {"id": "2113063313810792916", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-22 08:22", "tu": "2026-10-22T00:22:07.000Z", "text": "A visible sign of what AI insiders have been warning about since at least the Mythos release. Acceleration of attack and defense, at inhuman speeds, interacting with the very human systems that need to react to them. https://t.co/jEI8WDjslo", "summary": "Ethan Mollick 引用一条汇总 PHP 漏洞细节泄露、多国政府网站紧急下线等安全事件的帖子，称这正是 AI 圈自 Mythos 发布以来一直警告的情况：攻防都在以非人速度加速，而需要响应的仍是人类体系。", "url": "https://x.com/emollick/status/2113063313810792916", "cat": "技术观点", "rq": true, "quoted": "So basically, today PHP got two critical bugs that let anyone run code on your server without even logging in...", "media": []}, {"id": "2113008920008790488", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-22 04:45", "tu": "2026-10-21T20:45:58.000Z", "text": "In my annual letter, I share how we’re building a frontier ecosystem to turn technological progress into real-world outcomes and economic opportunity for people, organizations, and communities everywhere. https://t.co/Zcrb96sCC3", "summary": "Satya Nadella 发布年度致股东信，阐述微软如何打造「前沿生态」，把技术进步转化为个人、组织和社区的实际成果与经济机会。", "url": "https://x.com/satyanadella/status/2113008920008790488", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2113003628835553559", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-22 04:24", "tu": "2026-10-21T20:24:57.000Z", "text": "When we framed @trq212's pod about Claude Code's Next Era, we meant it. \n\nwe took some directive from @_catwu and did a proper deep dive on the new Claude Mods and highilghted our faves and what you should try now.\n\nin the same way that LLMs had that evolution from specific -&gt; https://t.co/vXmnPNyme3 https://t.co/KQq9Dg36IK", "summary": "swyx 推荐 Latent Space 对 Anthropic 新推出的 Claude Mods（Claude Code 扩展机制）的深度解读，梳理基础用法、当下最值得装的 mods，以及智能体与人交互界面的未来方向。", "url": "https://x.com/swyx/status/2113003628835553559", "cat": "行业动态", "rq": true, "quoted": "There's not enough buzz around Claude Mods. Read this Claude Mods article...", "media": []}, {"id": "2112988118471295323", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-22 03:23", "tu": "2026-10-21T19:23:19.000Z", "text": "OpenAI models are coming to Google Cloud.\n\nWe're bringing our frontier models and Codex agentic workflows to Google Cloud's Model Garden, so enterprises can use our technology where they already build.\n\nhttps://t.co/gjuLVALjDm", "summary": "OpenAI 宣布其前沿模型和 Codex 智能体工作流将上架 Google Cloud 的 Model Garden，企业可在谷歌云上直接使用 OpenAI 技术。", "url": "https://x.com/OpenAI/status/2112988118471295323", "cat": "融资与商业", "rq": false, "quoted": "", "media": []}, {"id": "2112974723659247896", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-22 02:30", "tu": "2026-10-21T18:30:05.000Z", "text": "Gemini 4 Argon combined three open-source datasets to build an interactive 3D visualization of human anatomy.\n\nToggle different layers in motion, isolate muscles, or zoom inside a beating heart. https://t.co/60nfQ0QVkl", "summary": "Google DeepMind 展示 Gemini 4 Argon 整合三个开源数据集生成可交互的 3D 人体解剖可视化，可分层切换、单独查看肌肉、放大观察跳动的心脏。", "url": "https://x.com/GoogleDeepMind/status/2112974723659247896", "cat": "产品发布", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2112968222538686592", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-22 02:04", "tu": "2026-10-21T18:04:15.000Z", "text": "This is an interesting question because the answer is not obvious.\n\nWhich, by the way, does not mean AI coding tools are not leading to massive improvements, but, as research keeps showing, the bottlenecks to product improvements are often elsewhere. https://t.co/oluwSaMWRZ", "summary": "Ethan Mollick 评论「哪款普通软件因开发者大量用 AI 而改进最多」这一问题：答案并不明显，AI 编程工具确实带来巨大提效，但研究一再表明产品改进的瓶颈往往在别处。", "url": "https://x.com/emollick/status/2112968222538686592", "cat": "技术观点", "rq": true, "quoted": "What is a piece of normal software that has improved the most because of its its developers using AI extensively? (Claude code doesn't count)", "media": []}, {"id": "2112966949273801086", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-22 01:59", "tu": "2026-10-21T17:59:12.000Z", "text": "Anthropic is a Public Benefit Corporation. Today, we’re publishing our annual Public Benefit Report. This report shares our five pillars and takes stock of the actions we’re taking to advance them. \n\nRead the full report at this page: https://t.co/MTCgtzCoPH", "summary": "Anthropic 作为公益公司（PBC）发布年度公益报告，介绍其五大支柱以及为推进这些目标所采取的行动。", "url": "https://x.com/AnthropicAI/status/2112966949273801086", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2112946750264676743", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-22 00:38", "tu": "2026-10-21T16:38:56.000Z", "text": "Dr. Christopher Stubbs is joining our Long-Term Benefit Trust. Chris is an experimental physicist and a former Dean of Science at Harvard University. He has also advised the US government on national security and arms control.\n\nRead more: https://t.co/8RzH8UujRU", "summary": "Anthropic 宣布前哈佛大学理学院院长、实验物理学家 Christopher Stubbs 加入其长期利益信托（Long-Term Benefit Trust），他曾为美国政府提供国家安全和军控方面的咨询。", "url": "https://x.com/AnthropicAI/status/2112946750264676743", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2112945805686604033", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-22 00:35", "tu": "2026-10-21T16:35:11.000Z", "text": "If you are wondering whether your website is affected, we have packaged a Codex skill to help check.\n\nPoint your Codex at this repo to guide you through it: https://t.co/XUEbOwXuQC https://t.co/BDaIIaJ4yK", "summary": "OpenAI 针对 PHP 严重漏洞发布一个 Codex skill，把 Codex 指向对应仓库即可引导检查自己的网站是否受影响。", "url": "https://x.com/OpenAI/status/2112945805686604033", "cat": "产品发布", "rq": true, "quoted": "OpenAI models helped researchers... discover critical security flaws in PHP...", "media": []}, {"id": "2112937020456612298", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-22 00:00", "tu": "2026-10-21T16:00:16.000Z", "text": "It feels pretty fitting for @JensenHuang &amp; @nvidia to end their European tour with Microducks on stage.\n\nMicroduck was designed and engineered in Europe (more precisely Bordeaux, France) by the @pollenrobotics and @huggingface teams. With American capital and ambition + Chinese https://t.co/SCSEfeATfU", "summary": "Hugging Face CEO Clem 称黄仁勋和英伟达的欧洲巡回以 Microduck 机器人登台收尾：该机器人由 Pollen Robotics 与 Hugging Face 在法国波尔多设计，2026 年已售出超 1.5 万台，成为年度最受欢迎机器人，他认为欧洲在 AI 浪潮中机会空前。", "url": "https://x.com/ClementDelangue/status/2112937020456612298", "cat": "行业动态", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2112921529650688312", "handle": "gdb", "name": "Greg Brockman", "username": "gdb", "t": "2026-10-21 22:58", "tu": "2026-10-21T14:58:43.000Z", "text": "Over the past two months, we have been leading a coalition to mitigate one of the most severe bugs in open source software found in recent memory, php2shell, found as part of our Patch the Planet initiative. https://t.co/rBsz7lrlwo", "summary": "Greg Brockman 发长文《Towards securing the internet》：OpenAI 用 GPT-5.6 Sol 等模型在 PHP 中发现潜伏 14 年的远程代码执行漏洞 php2shell 并牵头两个月联合修复，还在修 Node.js 等漏洞；他认为 AI 已能发现互联网级漏洞，传统逐个处置方式难以扩展，防守方需要更强模型和新机制。", "url": "https://x.com/gdb/status/2112921529650688312", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2112918582598459644", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-21 22:47", "tu": "2026-10-21T14:47:00.000Z", "text": "Companies I talk to are struggling with the rate of patches they need to do thanks to AI defenses finding issues before the inevitable wave of incoming cyberattacks by other AIs.\n\nNow consumers are going to have the same experience of getting everything updated often &amp; fast. https://t.co/v2AlEk7EGV", "summary": "Ethan Mollick 评论 OpenAI 的 PHP 漏洞事件：企业已被 AI 防御发现漏洞带来的补丁频率压得喘不过气，接下来普通消费者也会经历软件频繁快速更新。", "url": "https://x.com/emollick/status/2112918582598459644", "cat": "技术观点", "rq": true, "quoted": "OpenAI models helped researchers... discover critical security flaws in PHP...", "media": []}, {"id": "2112907856018309586", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-21 22:04", "tu": "2026-10-21T14:04:23.000Z", "text": "OpenAI models helped researchers—operating as part of our Patch the Planet initiative—discover critical security flaws in PHP, an open-source programming language used to run an estimated 70% of websites.\n\nOver the past two months, we led a coalition of maintainers, researchers,", "summary": "OpenAI 宣布其模型通过 Patch the Planet 计划发现了约 70% 网站所用的 PHP 中的严重安全漏洞，并牵头维护者与安全厂商用两个月提前准备修复；称这标志着 AI 能发现互联网级影响漏洞的新阶段，是「防守方窗口期」的实例。", "url": "https://x.com/OpenAI/status/2112907856018309586", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2112899854569762936", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-21 21:32", "tu": "2026-10-21T13:32:35.000Z", "text": "GPT-Rosalind surfaced a new lead for drug discovery: could restoring cholesterol transport protect neurons from degeneration?\n\nDCTN1 is a gene linked to Perry syndrome, a rare neurodegenerative disorder. In mouse-brain data, disrupting it increased expression of genes involved in", "summary": "OpenAI 称其科研模型 GPT-Rosalind 发现一条药物研发新线索：在小鼠脑数据中，与罕见神经退行性疾病 Perry 综合征相关的 DCTN1 基因被破坏后会影响胆固醇转运相关基因表达，提示恢复胆固醇转运或可保护神经元免于退化。", "url": "https://x.com/OpenAI/status/2112899854569762936", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2112858767478190421", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-21 18:49", "tu": "2026-10-21T10:49:19.000Z", "text": "Today in the UK, I saw how the Yorkshire Ambulance Service is using Copilot to cut down on administrative work and make better use of its data, and ultimately provide a better experience for medical personnel and patients.\n\nIt's an early example of what's possible as NHS England https://t.co/XInypxBDb0", "summary": "Satya Nadella 在英国考察约克郡救护车服务（Yorkshire Ambulance Service）用微软 Copilot 减少行政工作、更好利用数据，称这是英格兰 NHS 体系引入 AI 的早期范例。", "url": "https://x.com/satyanadella/status/2112858767478190421", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2112804427962970271", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-21 15:13", "tu": "2026-10-21T07:13:24.000Z", "text": "i retired from the business of making single-stock calls a decade ago but trust me when i say that the stock market still has no idea that what happened \n\nevery single gpu sold gained ~30% in lifetime value today and the stock should be up by about $600B lol\n\nthe more you buy, https://t.co/YWqMP4uRUP https://t.co/CptMueJ45J", "summary": "swyx 引用 DeepSeek 披露的生产数据（单集群每天 155 万亿 token、输入缓存命中率 96%、闲时每 GPU 小时收入约 38 美元，按 5–8 美元/GPU 小时成本算毛利约 80%），认为这意味着每张已售 GPU 的生命周期价值今天提升约 30%，市场还没反应过来（暗指英伟达股价被低估）。", "url": "https://x.com/swyx/status/2112804427962970271", "cat": "行业动态", "rq": true, "quoted": "deepseek's production numbers are kinda wild:\n\n155T tokens/day from one cluster (96% input cache hits) and $38 revenue/GPU-hour at off-peak prices.\n\nat $5–8/GPU-hour, that’s ~80% margin on GPU costs alone. at DeepSeek prices!!\n\nwe dug into the math, their 72-hour cache, and what https://t.co/fIuOX8zxCw https://t.co/Hqjn24qJ6Y", "media": []}, {"id": "2112772374823407870", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-21 13:06", "tu": "2026-10-21T05:06:02.000Z", "text": "opus is great for writing... when you dont happen to have any random no-no words in your prompt.\n\njfc, @CompleteSkeptic is right, give me prod, not god. i cant build an ai media org with this in the critical path. https://t.co/U8MOOmykJO https://t.co/ORcvXeH7xz", "summary": "swyx 吐槽 Claude Opus 写作虽好，但提示词里一碰到敏感词就会触发拒答，这种不稳定让他无法把 Opus 放进 AI 媒体业务（AINews）的关键链路，呼吁模型厂商「给我能上生产的，而不是上帝」。", "url": "https://x.com/swyx/status/2112772374823407870", "cat": "技术观点", "rq": true, "quoted": "can confirm. ran @latentspacepod AINews side by side with 6 Sol and the difference was night and day: https://t.co/oloSDxf0q7\n\n5.5 Opus is the new default model for AINews going forward. so much more concise and tasteful reporting, with much less slopese than even 5 Opus. https://t.co/P6AXDlBKNP https://t.co/6q20Ik0dho", "media": []}, {"id": "2112732230124818891", "handle": "darioamodei", "name": "Dario Amodei", "username": "DarioAmodei", "t": "2026-10-21 10:26", "tu": "2026-10-21T02:26:30.000Z", "text": "Thank you for this, @_NathanCalvin. I appreciate and am a fan of the investigative work you’ve done on behalf of AI safety and believe your comments are coming from a constructive, honest place, and that it benefits the public to have people whose job is to scrutinize the actions https://t.co/QZgPvh4tX4", "summary": "Anthropic CEO Dario Amodei 发长文回应 AI 安全倡导者 Nathan Calvin 对公司「安全让位于竞速」的批评：承认部分失误，但坚持「race to the top」战略，列举推动加州 SB53、严格生物安全防护、Mythos 级模型延后 4 个月开放、限制向中资控制企业销售、拿出 5% 公司股权设公益基金等「牺牲商业利益换安全」的举措，并为 RSP 调整辩护。", "url": "https://x.com/DarioAmodei/status/2112732230124818891", "cat": "行业动态", "rq": true, "quoted": "Thank you for taking the time to respond thoroughly on a weekend. I realize that drafting legislation is difficult and some degree of iteration and response to feedback is inevitable and appropriate.\n\nHowever, I feel like your response is still not really engaging with the heart", "media": []}, {"id": "2112656453685367004", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-21 05:25", "tu": "2026-10-20T21:25:24.000Z", "text": "I wrote about the exponential curve of the last 30 months of AI development: https://t.co/lKh9THu9JH\n\nAnd I asked Opus 5.5 to create the ultimate response to the test I use for all AI image generation models (make a picture of \"an otter on a plane using wifi\"), it made this video https://t.co/PDHClJiZs1", "summary": "Ethan Mollick 发文梳理过去 30 个月 AI 能力的指数级进步，并展示 Opus 5.5 对其经典测试「水獭在飞机上用 WiFi」生成的视频。", "url": "https://x.com/emollick/status/2112656453685367004", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2112652656602923366", "handle": "sama", "name": "Sam Altman", "username": "sama", "t": "2026-10-21 05:10", "tu": "2026-10-20T21:10:19.000Z", "text": "I am very grateful Aleksander accepted our request to come take this on; the safety and security challenges in front of us as we confront superintelligence are immense, and he has an excellent set of skills to work on this. https://t.co/myODbyruRO", "summary": "Sam Altman 宣布 Aleksander 结束「离职」回归 OpenAI，负责面向超级智能的安全与安保工作，称其挑战巨大。", "url": "https://x.com/sama/status/2112652656602923366", "cat": "行业动态", "rq": true, "quoted": "Personal update: Turns out that what I thought was leaving OpenAI became more of a sabbatical.\n\nWhen I left a few months ago, I felt that the most important thing to focus on was making AI more useful to people. But we’ve since entered a different regime of AI progress. One in", "media": []}, {"id": "2112607347688583586", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-21 02:10", "tu": "2026-10-20T18:10:16.000Z", "text": "We’ve acquired Orchestra Bio, a platform that helps biopharma teams coordinate the complex process of drug development.\n\nTogether, we’ll build on Rosalind, our AI models and tools for life sciences research, to streamline those operations and help new treatments reach patients", "summary": "OpenAI 收购药物研发协作平台 Orchestra Bio，将与其生命科学 AI 模型与工具 Rosalind 结合，加速新药研发流程。", "url": "https://x.com/OpenAI/status/2112607347688583586", "cat": "融资与商业", "rq": false, "quoted": "", "media": []}, {"id": "2112603906723487744", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-21 01:56", "tu": "2026-10-20T17:56:36.000Z", "text": "“Lack of electricity” is an oversimplification. Everything is hard about bringing massive compute online at extremely high speed. \n\nIf there was twice as much time, this would be relatively easy, but there is not. https://t.co/rmuECPbCrN", "summary": "马斯克回应「AI 算力瓶颈在电力」的说法：这是过度简化，真正难的是在极短时间内把海量算力上线的每个环节。", "url": "https://x.com/elonmusk/status/2112603906723487744", "cat": "技术观点", "rq": true, "quoted": "Former $GOOGL employee on why data center capacity and electricity are the real bottlenecks, not GPU production itself, and how unreliable some of the neoclouds are ($AMZN, $GOOGL, $MSFT, $NVDA):\n\n1. According to the expert, open-source models are closing the gap with frontier https://t.co/R7bcQ4r3IV", "media": []}, {"id": "2112597587987689912", "handle": "DrJimFan", "name": "Jim Fan", "username": "DrJimFan", "t": "2026-10-21 01:31", "tu": "2026-10-20T17:31:29.000Z", "text": "We built a robotics data engine with Astra-level performance at 125x lower cost. And we are open-sourcing the weights today! Introducing Flora, a suite of open models to parse the physical world and turn raw footage into rich training signals. \n\nFlora already powers our in-house https://t.co/wiuiNjksNa", "summary": "Jim Fan 团队开源机器人数据引擎模型套件 Flora，可把原始视频解析为机器人训练信号，性能对标 Astra、成本低 125 倍。", "url": "https://x.com/DrJimFan/status/2112597587987689912", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2112590249033687078", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-21 01:02", "tu": "2026-10-20T17:02:20.000Z", "text": "My new book, Co-Existence, is out today.  It is a guide to how to live &amp; work in a world where AI is sometimes, but not always, better than you.\n\n(And, for the release, I worked with Opus 5.5 to make a quite interesting experience for the book's website: https://t.co/Ti5jo6l05g) https://t.co/sbqvGwI0TR", "summary": "Ethan Mollick 新书《Co-Existence》出版，探讨在 AI 有时（但非总是）比人强的世界里如何生活与工作，官网体验由 Opus 5.5 协助制作。", "url": "https://x.com/emollick/status/2112590249033687078", "cat": "其他", "rq": false, "quoted": "", "media": []}, {"id": "2112587397380943953", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-21 00:51", "tu": "2026-10-20T16:51:00.000Z", "text": "deepseek posted way more alpha on their zhihu page, if you only read twitter you are reading the laowai approved stuff\n\n\"Based on this framework, we have implemented a high-throughput, low-latency large-scale inference service for DeepSeek V4.1 Flash. Currently, the service https://t.co/D2pLGs3JR8 https://t.co/E35YHXeei4", "summary": "swyx 转引 DeepSeek 开源自研推理框架 DeepInfer（支撑 DeepSeek-V4.1-Flash 大规模推理），并提醒知乎上的技术细节比推特版多得多。", "url": "https://x.com/swyx/status/2112587397380943953", "cat": "行业动态", "rq": true, "quoted": "🚀 Introducing DeepInfer, our in-house inference framework, now fully open source!\n\nPowering DeepSeek-V4.1-Flash at scale with high throughput and low latency. We’re sharing our production stack to help the community lower compute costs, reduce energy use, and make AI more", "media": []}, {"id": "2112579251555721573", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-21 00:18", "tu": "2026-10-20T16:18:38.000Z", "text": "New on our Science Blog: designing protein binders against scorpion neurotoxins.\n\nScorpions sting about 1.2m people every year, and antivenoms are often costly or in short supply. Claude has made an early step toward finding new treatments.\n\nhttps://t.co/l6LgdEqM7I", "summary": "Anthropic 科学博客：用 Claude 设计针对蝎毒神经毒素的蛋白结合剂，为每年约 120 万蝎蜇伤者寻找替代抗毒血清迈出早期一步。", "url": "https://x.com/AnthropicAI/status/2112579251555721573", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2112557925264752930", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-20 22:53", "tu": "2026-10-20T14:53:53.000Z", "text": "Gemini 4 Argon built a 3D periodic table synced to Tom Lehrer’s song, “The Elements.”\n\nCreated in @Antigravity, it animates orbiting electrons, atomic data, and light spectra. https://t.co/7fsvsIk6Sv", "summary": "Google DeepMind 展示 Gemini 4 Argon 在 Antigravity 中生成的 3D 交互元素周期表，可随歌曲同步展示电子轨道、原子数据和光谱。", "url": "https://x.com/GoogleDeepMind/status/2112557925264752930", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2112534057879765260", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-20 21:19", "tu": "2026-10-20T13:19:03.000Z", "text": "Just watched the @netflix Instadocs about the @OpenAI cyberattack on @huggingface. Super disappointing, as they went for maximum anthropomorphism of the technology and full doomer mode.\n\nI spent more than two hours with them trying to correct all their mistakes and ground this in https://t.co/z8LELflXWh", "summary": "Hugging Face CEO 吐槽 Netflix 关于「OpenAI 对 Hugging Face 网络攻击」事件的纪录短片过度拟人化 AI、一味渲染末日论，称自己花了两个多小时帮剧组纠错仍未被采纳。", "url": "https://x.com/ClementDelangue/status/2112534057879765260", "cat": "行业动态", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2112498869531754900", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-20 18:59", "tu": "2026-10-20T10:59:13.000Z", "text": "Great to meet with the @saintgobain team in Paris today and learn how they’re using Microsoft Discovery to help accelerate the development of new more-efficient construction materials. https://t.co/GSZ9MKxkxp", "summary": "纳德拉在巴黎会见圣戈班（Saint-Gobain）团队，介绍对方正用微软的 AI 科研平台 Microsoft Discovery 加速研发更高效的新型建筑材料。", "url": "https://x.com/satyanadella/status/2112498869531754900", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2112474291916910752", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-20 17:21", "tu": "2026-10-20T09:21:33.000Z", "text": "Today in Paris, we announced new capabilities across Microsoft Sovereign Cloud, expanding choice and control for organizations running their most sensitive workloads across public and private cloud, and our growing partner ecosystem. https://t.co/nzVv1m3jUd", "summary": "微软在巴黎发布 Microsoft Sovereign Cloud（主权云）新能力，让在公有云和私有云上运行最敏感负载的机构有更多选择和控制权，并扩大合作伙伴生态。", "url": "https://x.com/satyanadella/status/2112474291916910752", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2112373713937084809", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-20 10:41", "tu": "2026-10-20T02:41:54.000Z", "text": "Two important changes to timeline recommendations:\n\n- New AI/SI ranking model that predicts probable time spent much better\n\n- Retrieval model trained to surface posts people read all the way through\n\nUser active seconds is growing exponentially and hitting all-time highs almost https://t.co/ynJEQDNjrv", "summary": "X 时间线推荐两项更新：上线能更准预测阅读时长的新 AI 排序模型，以及专门挑出用户会完整读完的帖子的召回模型；马斯克称用户活跃时长正指数增长、接近历史新高。", "url": "https://x.com/elonmusk/status/2112373713937084809", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2112332499917681028", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-20 07:58", "tu": "2026-10-19T23:58:07.000Z", "text": "New Claude Projects* is a nice interface for multi-agent work. It does a good job with having a user-facing coordinator model and independent agents running threads that pass messages around. Takes some fiddling but quite powerful.\n\n* Same name but no relation to old Projects🤪 https://t.co/mBJwGX9A0x", "summary": "试用新版 Claude Projects：由面向用户的协调模型统筹多个独立智能体线程互相传递消息，适合多智能体协作，上手需折腾但很强大（与旧版 Projects 同名无关）。", "url": "https://x.com/emollick/status/2112332499917681028", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2112310345863930168", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-20 06:30", "tu": "2026-10-19T22:30:05.000Z", "text": "Our latest model advances bring stronger capabilities for building and migrating software in low-resource programming languages such as COBOL, Fortran, and Visual Basic.\n\nThese languages power software that banks, governments, and businesses depend on. Progress here means https://t.co/Mulo5P3iCO", "summary": "OpenAI 称最新模型在 COBOL、Fortran、Visual Basic 等低资源编程语言的开发与代码迁移能力上明显增强，瞄准银行、政府和企业依赖的老旧系统。", "url": "https://x.com/OpenAI/status/2112310345863930168", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2112289593286352976", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-20 05:07", "tu": "2026-10-19T21:07:38.000Z", "text": "Multiplayer AI needs to move past the group chat phase. Chats are chaotic, everyone sees everything (creating social &amp; management issues), and they're bad for long projects. Worse, they keep AI trapped inside existing teams, when its real promise is working &amp; helping across them.", "summary": "认为多人协作 AI 必须走出“群聊”形态：群聊混乱、信息全员可见、不适合长期项目，还把 AI 困在既有团队里，而 AI 真正的价值在于跨团队协作。", "url": "https://x.com/emollick/status/2112289593286352976", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2112265822274302066", "handle": "AIatMeta", "name": "AI at Meta", "username": "AIatMeta", "t": "2026-10-20 03:33", "tu": "2026-10-19T19:33:10.000Z", "text": "Today we published a technical report on Muse Glimmer, our 30B open-weight model built for agentic tasks on consumer hardware.\n\nIt runs at practical speeds on a Mac or PC with a single consumer GPU at 4-bit precision, and leads comparably-sized open models on tool use and https://t.co/PssTwoaTAZ", "summary": "Meta 发布 Muse Glimmer 技术报告：30B 开源权重模型，面向消费级硬件上的智能体任务，4-bit 精度下单张消费级显卡的 Mac/PC 即可流畅运行，工具调用等能力领先同规模开源模型。", "url": "https://x.com/AIatMeta/status/2112265822274302066", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2112259970108686505", "handle": "_jasonwei", "name": "Jason Wei", "username": "_jasonwei", "t": "2026-10-20 03:09", "tu": "2026-10-19T19:09:55.000Z", "text": "AI will not automate radiologists like you think\n\nWe have been talking for years now about AI automating jobs. Radiology has been a prime target, with Geoff Hinton once claiming, “people should stop training radiologists now, it’s just completely obvious that within five years,", "summary": "撰文认为 AI 不会像大家想象的那样取代放射科医生，以 Hinton 当年“应停止培养放射科医生”的预言为例，反思 AI 自动化工作岗位的判断。", "url": "https://x.com/_jasonwei/status/2112259970108686505", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2112245968750145561", "handle": "AIatMeta", "name": "AI at Meta", "username": "AIatMeta", "t": "2026-10-20 02:14", "tu": "2026-10-19T18:14:17.000Z", "text": "We trained our Muse foundational models, including Muse Wonder, at Prometheus, our gigawatt-scale supercluster in New Albany, Ohio.\n\nAcross a supercluster with hundreds of thousands of GPUs, even one underperforming host can slow an entire training run. We engineered Prometheus https://t.co/XXCih5wrfv", "summary": "Meta 披露 Muse 系列基础模型（含 Muse Wonder）在俄亥俄州 New Albany 的吉瓦级超算集群 Prometheus 上训练，数十万 GPU 规模下专门工程化解决单台慢节点拖累整体训练的问题。", "url": "https://x.com/AIatMeta/status/2112245968750145561", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2112214753980612886", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-20 00:10", "tu": "2026-10-19T16:10:15.000Z", "text": "Local AI 202: Get Massive Speed-ups with Speculative Decoding https://t.co/3ywucgYbrD", "summary": "发布本地 AI 进阶教程《Local AI 202》，讲解如何用推测解码（speculative decoding）大幅提升本地模型推理速度。", "url": "https://x.com/huggingface/status/2112214753980612886", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2112168320946634932", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-19 21:05", "tu": "2026-10-19T13:05:44.000Z", "text": "I recently wrote about why we need to treat models as insider risks, with security controls sitting outside the model itself.\n\nToday, we're putting that principle into practice by expanding Project Perception with new capabilities to help continuously assess agent risk, adapt", "summary": "宣布扩展 Project Perception：将模型视为内部威胁，在模型外加强安全控制，并新增能力以持续评估与应对智能体风险。", "url": "https://x.com/satyanadella/status/2112168320946634932", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2112165213202157907", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-19 20:53", "tu": "2026-10-19T12:53:23.000Z", "text": "Writing good STATA code was very important for my academic career. It looks like that skill is largely becoming obsolete. (Also take this is as a notice to academics who still think of AI in terms of chatbots, not agents, that a lot has changed in a year) https://t.co/8Qk6VgU7w8 https://t.co/Wl1zUqbt0j", "summary": "Ethan Mollick 说写好 STATA 代码曾对他的学术生涯至关重要，但这项技能正迅速被 AI 淘汰；他提醒仍把 AI 当聊天机器人而非智能体看待的学者，过去一年变化已经很大。", "url": "https://x.com/emollick/status/2112165213202157907", "cat": "技术观点", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2112030115752456456", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-19 11:56", "tu": "2026-10-19T03:56:33.000Z", "text": "I hate this slide every time it comes up, and now from CSAIL\n\nThis has been false since before the slide was made. Automated systems make management decisions all the time (trading, logistics, customer service, insurance) &amp; pretending they don't actually launders responsibility. https://t.co/PpBDauh1Zy", "summary": "针对 MIT CSAIL 再次转发 IBM 1979 年那张“计算机无法被问责，所以不能做管理决策”的幻灯片，Ethan Mollick 反驳说这早已不成立：交易、物流、客服、保险等领域的自动化系统一直在做管理决策，假装它们没有反而是在推卸（洗白）责任。", "url": "https://x.com/emollick/status/2112030115752456456", "cat": "技术观点", "rq": true, "quoted": "An IBM slide from 1979. https://t.co/kD1wztgwTz", "media": []}, {"id": "2111918212946309445", "handle": "jackclarkSF", "name": "Jack Clark", "username": "jackclarkSF", "t": "2026-10-19 04:31", "tu": "2026-10-18T20:31:54.000Z", "text": "Between this and our prior commitments, roughly 20% of all Anthropic equity will be dedicated to the public good, and that commitment can grow as Anthropic grows.\n\nWe plan to use these funds to ensure more people can share in the benefits of AI, and to increase our ability to provide funding to deal with its risks.", "summary": "Anthropic 联合创始人 Jack Clark 补充公益基金的用途：约 20% 的 Anthropic 股权将用于公共利益且会随公司成长而增加，资金将用于让更多人分享 AI 红利，并增强应对 AI 风险的资助能力。", "url": "https://x.com/jackclarkSF/status/2111918212946309445", "cat": "融资与商业", "rq": true, "quoted": "We’re committing a portion of Anthropic’s shares to the Anthropic Public Benefit Fund, a new wholly owned entity dedicated entirely to the public benefit.", "media": []}, {"id": "2111884340955062274", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-19 02:17", "tu": "2026-10-18T18:17:18.000Z", "text": "Developers are going to be a small part of total token usage over time, as the internal stats on usage at OpenAI and Anthropic both show. And for long-running high value tasks in areas where verification is harder, the benefits for higher \"intelligence\" models are quite large. https://t.co/qTvgVRXfpe", "summary": "针对“模型智能领先 10 分只换来 20% 更多开发者流量（2025 年底约 69%）”的报道，Ethan Mollick 认为开发者终将只占 token 用量的一小部分（OpenAI、Anthropic 内部数据都显示如此），而在长周期、高价值、难验证的任务上，更“聪明”的模型收益依然很大。", "url": "https://x.com/emollick/status/2111884340955062274", "cat": "技术观点", "rq": true, "quoted": "OpenAI, Anthropic and other leading AI labs face a growing challenge: Better models aren't necessarily attracting more usage. A 10-point intelligence advantage now earns just 20% more developer traffic, down from nearly 69% in late 2025.", "media": []}, {"id": "2111881963657412903", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-19 02:07", "tu": "2026-10-18T18:07:51.000Z", "text": "We’re committing a portion of Anthropic’s shares to the Anthropic Public Benefit Fund, a new wholly owned entity dedicated entirely to the public benefit.\n\nIt will start off with 5% of our shares. For every 50% increase in the company’s value over a set baseline, we can contribute up to an extra 2%, subject to our board’s discretion.\n\nIn total, this means that roughly 20% of Anthropic’s shares are committed to the public good. Our co-founders have already pledged to donate 80% of their equity, and around half our employees are donating a portion of their equity as part of a donation matching program we’ve run since our founding.\n\nIn the post below, we share more details about our new fund.\n\nhttps://t.co/XzDntVH0vH", "summary": "Anthropic 宣布设立全资实体“Anthropic 公益基金”（Public Benefit Fund），先注入公司 5% 股份，公司估值每较基准上涨 50% 可再追加至多 2%（由董事会决定）；连同联合创始人承诺捐出 80% 股权、约半数员工参与捐股配捐，合计约 20% 股份将用于公共利益。", "url": "https://x.com/AnthropicAI/status/2111881963657412903", "cat": "融资与商业", "rq": false, "quoted": "", "media": []}, {"id": "2111858791939772731", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-19 00:35", "tu": "2026-10-18T16:35:47.000Z", "text": "This doesn’t seem to be a very robust strategy in the era of AIs that can use your computer on your behalf. https://t.co/WfvGxPadwr", "summary": "针对达美航空、摩根大通、嘉信理财、Yelp、亚马逊等纷纷封堵 AI 智能体的现象，Ethan Mollick 认为在 AI 能代用户操作电脑的时代，单纯封禁并不稳健；他也提醒目前智能体安全与提示注入风险仍很大，不宜让其操控银行账户，长远应找到安全协作方式而非一禁了之。", "url": "https://x.com/emollick/status/2111858791939772731", "cat": "行业动态", "rq": true, "quoted": "notice..\n\n> Delta is blocking AI agents from booking flights\n> JPMorgan Chase and Charles Schwab block agents from accessing accounts\n> Yelp requires paid data licensing for agents\n> Amazon has blocked Grok bot and other shopping agents.\n\nthe internet is starting to block AI", "media": []}, {"id": "2111700285814940159", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-18 14:05", "tu": "2026-10-18T06:05:56.000Z", "text": "Fable 5.1: \"Implement Borges's short stories. Like implement them in 3D. Do it, make them creative and beautiful and help us understand the point of the story. Figure it out.\"\n\nI had to tell it that it was okay to quote Borges. Some neat stuff. Play them: https://t.co/ELAR9dSp6f https://t.co/GdfavIr179", "summary": "Ethan Mollick 测试 AI 模型 Fable 5.1：只给一句开放指令，让它把博尔赫斯的短篇小说做成富有创意的可交互 3D 作品并帮助理解故事主旨，模型做出了不少有意思的成果（中途需提示它可以引用原文），作品可在线试玩。", "url": "https://x.com/emollick/status/2111700285814940159", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2111672307139874844", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-18 12:14", "tu": "2026-10-18T04:14:45.000Z", "text": "Both interesting and viscerally unsetlling. https://t.co/yTxa0QPQng", "summary": "Ethan Mollick 转引 Odyssey（@odysseyml）的成果：他们把果蝇大脑模型放进前沿世界模型 Odyssey-3，让它在完全由模型“想象”生成的模拟世界里自主飞行；Mollick 评价这“既有趣又让人本能地不安”。", "url": "https://x.com/emollick/status/2111672307139874844", "cat": "研究成果", "rq": true, "quoted": "We placed the fruit fly brain inside Odyssey-3, a frontier world model.\n\nThe lil’ guy is now flying around totally imagined, simulated worlds all by itself 🫶 https://t.co/lvKrGoTtKr", "media": []}, {"id": "2111595040913100837", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-18 07:07", "tu": "2026-10-17T23:07:43.000Z", "text": "A consequential choice will be made soon by government and companies as they are increasingly flooded with agentic AI inquiries that overcome the frictions that gated access (see the graphs - it has already started!)\n\nTwo options: do you make services worse or better as a result? https://t.co/xVDw1G9MIZ", "summary": "Ethan Mollick 指出政府和企业正被 AI 智能体发起的大量咨询/申请淹没（附图显示已经开始），这些请求绕过了过去限制访问的“摩擦”，机构很快要做出关键选择：是让服务变差来设门槛，还是借机把服务做得更好。", "url": "https://x.com/emollick/status/2111595040913100837", "cat": "行业动态", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2111507711653564543", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-18 01:20", "tu": "2026-10-17T17:20:43.000Z", "text": "Some observations about the \"total\" automation of software engineering:\n\n1. There are more software engineers now than in 2025, and demand is growing.\n\n2. Software engineers have never worked harder than they do now.\n\n3. They largely don't write code anymore, agents write ~100%", "summary": "François Chollet 谈软件工程“全面自动化”的观察：如今软件工程师比 2025 年更多、需求仍在增长，工作强度前所未有，但他们基本不再亲手写代码，约 100% 的代码由智能体编写。", "url": "https://x.com/fchollet/status/2111507711653564543", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2111448141119856866", "handle": "rasbt", "name": "Sebastian Raschka", "username": "rasbt", "t": "2026-10-17 21:24", "tu": "2026-10-17T13:24:00.000Z", "text": "Reasoning From Scratch round 8, the finale!\nThis last lecture in the series covers distillation as an efficient alternative to the previous reinforcement learning training runs.\n\n(Planning to take a brief break, but I will be back!)\n\n00:00 Introduction and series recap\n01:07 Why https://t.co/UMbZBIhvAQ", "summary": "Sebastian Raschka 发布《从零实现推理模型》（Reasoning From Scratch）系列第 8 讲也是最终讲（约 81 分钟视频），讲解用“蒸馏”作为此前强化学习训练的更高效替代方案。", "url": "https://x.com/rasbt/status/2111448141119856866", "cat": "技术观点", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2111350983465095501", "handle": "jackclarkSF", "name": "Jack Clark", "username": "jackclarkSF", "t": "2026-10-17 14:57", "tu": "2026-10-17T06:57:56.000Z", "text": "I’m speaking at the IMF in an hour about the singularity and why I believe it has begun and the choices we'll need to make. Watch live here: https://t.co/Hj9HzcXx5h", "summary": "Anthropic 联合创始人 Jack Clark 预告将在国际货币基金组织（IMF）演讲，阐述他为何认为“奇点”已经开始，以及人类需要做出的选择，并附直播链接。", "url": "https://x.com/jackclarkSF/status/2111350983465095501", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2111227077924127056", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-17 06:45", "tu": "2026-10-16T22:45:34.000Z", "text": "proud to have welcomed @affaan and @absurdistphil to @aidotengineer NYC to launch the new Compute Trading industry and give both engineers and traders the definitive intro to what, why and why now https://t.co/7bBPgrEwmx https://t.co/cdYwCMPR3p", "summary": "swyx 介绍 AI Engineer 纽约大会上的“算力交易”新行业专场；引用消息称 Jump、DRW 等交易公司正投入交易员和资本进入新兴算力市场。", "url": "https://x.com/swyx/status/2111227077924127056", "cat": "行业动态", "rq": true, "quoted": "NEW: Jump, DRW are committing traders and capital to the emerging compute market, just as how they were betting on other markets during their early days such as digital assets https://t.co/VXsGzJrQmV", "media": []}, {"id": "2111204941801128366", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-17 05:17", "tu": "2026-10-16T21:17:37.000Z", "text": "In @Nature this week, our new research shows how machine learning can improve weather forecasts two to six weeks out, a timeframe that's historically been very difficult to predict.\n\nIt's exciting to see the potential of this work to help us better prepare for extreme weather,", "summary": "纳德拉介绍微软本周发表于《自然》的研究：机器学习可提升 2–6 周的次季节天气预报（历来最难预测的时段），有助应对极端天气。", "url": "https://x.com/satyanadella/status/2111204941801128366", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2111195796381270125", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-17 04:41", "tu": "2026-10-16T20:41:16.000Z", "text": "Beautiful work from @perplexity_ai @AravSrinivas with weights on @huggingface of course! \n\nhttps://t.co/TJcVJlFYhg \nhttps://t.co/MJXAp5WUSt https://t.co/EZNf9mtCRN", "summary": "Clément Delangue 点赞 Perplexity 在 Hugging Face 开源新一代多模态决策模型 pplx-decider-v1.2 及 flash 版：文本/视觉分数提升、推理最快 5 倍，Flash 为 Decision Index 上最强 4B 模型。", "url": "https://x.com/ClementDelangue/status/2111195796381270125", "cat": "产品发布", "rq": true, "quoted": "Our next generation of open weights multimodal decision models comes in two sizes, pplx-decider-v1.2 and pplx-decider-flash-v1.2.\n\nText and vision scores improve. Inference is up to 5x faster: all questions in a request run in one pass.\n\nFlash is the top 4B on the Decision Index. https://t.co/Zb1MN36aFi", "media": []}, {"id": "2111192259073094035", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-17 04:27", "tu": "2026-10-16T20:27:13.000Z", "text": "GPT-6 Astra Pro in ChatGPT got an upgrade with faster responses and improved use of plugins and tools.\n\nAnd now, multiple agents can tackle different parts of a task in parallel. You can follow each agent’s progress and open completed tasks to review their work.\n\nNow available to", "summary": "OpenAI 升级 ChatGPT 中的 GPT-6 Astra Pro：响应更快、插件与工具调用更好，并支持多个 agent 并行处理任务的不同部分，可实时查看进度和审阅结果。", "url": "https://x.com/OpenAI/status/2111192259073094035", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2111171225418408236", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-17 03:03", "tu": "2026-10-16T19:03:38.000Z", "text": "The paper on how a team of Gemini 4 agents beat Minecraft is worth a look.\n\nIt is accessible example (partially because it is AI written) of spontaneous coordination among agents to accomplish a complicated goal &amp; how their approach differs from humans/ https://t.co/brrmhydhWw https://t.co/cxlp4jTjqf", "summary": "Ethan Mollick 推荐 Gemini 4 agent 团队通关《我的世界》的论文，认为它是多 agent 自发协作完成复杂目标、且做法与人类不同的易读案例。", "url": "https://x.com/emollick/status/2111171225418408236", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2111152183240511640", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-17 01:47", "tu": "2026-10-16T17:47:58.000Z", "text": "New from our STEM Fellows Program: Designing more efficient quantum circuits with Claude.\n\nGiven plain-language instructions, Claude Mythos 5 designed quantum circuits that improve on the best published ones, sometimes by an order of magnitude or more.\n\nMore efficient circuits", "summary": "Anthropic STEM Fellows 项目新成果：仅凭自然语言指令，Claude Mythos 5 设计出优于已发表最佳方案的量子电路，部分效率提升一个数量级以上。", "url": "https://x.com/AnthropicAI/status/2111152183240511640", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2111147597159415874", "handle": "JeffDean", "name": "Jeff Dean", "username": "JeffDean", "t": "2026-10-17 01:29", "tu": "2026-10-16T17:29:45.000Z", "text": "Have a glimpse at this!  Nice work, @AndrewDai and Elorian folks! https://t.co/2AoTYlnvyS", "summary": "Jeff Dean 推荐 Elorian（Andrew Dai 团队）发布的首个“视觉思考”模型 Glimpse，主攻动态/多视角画面理解，在关键视觉推理基准上与 Astra 相当。", "url": "https://x.com/JeffDean/status/2111147597159415874", "cat": "产品发布", "rq": true, "quoted": "Spent years watching models ace a single image and completely whiff on anything that moves or changes angle. Today we’re fixing that.\n\nTry Glimpse now, our first visual thinking model with competitive frontier performance compared to Astra on key public visual reasoning https://t.co/KpoVLpn5Gm", "media": []}, {"id": "2111135753732301178", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-17 00:42", "tu": "2026-10-16T16:42:41.000Z", "text": "Southwest Airlines going all-in with @Starlink! https://t.co/fE58IZVZaE", "summary": "马斯克转发：西南航空宣布 2027 年秋前全机队接入 Starlink，有望成为首家全机队部署 Starlink 的美国大型航司。", "url": "https://x.com/elonmusk/status/2111135753732301178", "cat": "行业动态", "rq": true, "quoted": "BREAKING: Southwest Airlines has announced it will expand Starlink to its entire fleet by fall 2027.\n\nIt expects to become the first major U.S. airline to complete a fleetwide Starlink rollout. https://t.co/DPxf8duFzd", "media": []}, {"id": "2111131436191199660", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-17 00:25", "tu": "2026-10-16T16:25:31.000Z", "text": "Tesla supervised self-driving approved in Slovakia 🇸🇰 https://t.co/JWa0zV4HZI", "summary": "马斯克转发：特斯拉监督式自动驾驶（FSD Supervised）获斯洛伐克批准，即将开始推送。", "url": "https://x.com/elonmusk/status/2111131436191199660", "cat": "行业动态", "rq": true, "quoted": "Now approved in Slovakia 🇸🇰 \n\nRollout begins soon https://t.co/8WR8yMNnr8", "media": []}, {"id": "2111131160348688395", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-17 00:24", "tu": "2026-10-16T16:24:26.000Z", "text": "Going forward, all advertising on 𝕏 will be subject to a reasonable esthetic standard. \n\nAdvertisers who post ads that are ugly, shrill, strident or overstate claims about their product will be barred from advertising.", "summary": "马斯克宣布 X 上所有广告今后须符合基本审美标准，丑陋、聒噪或夸大产品宣传的广告主将被禁止投放（随后还呼吁用户向 @Ads 举报此类广告）。", "url": "https://x.com/elonmusk/status/2111131160348688395", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2111130577789493706", "handle": "sama", "name": "Sam Altman", "username": "sama", "t": "2026-10-17 00:22", "tu": "2026-10-16T16:22:07.000Z", "text": "Very happy to see this from Nick! https://t.co/BBSTgPHuy8", "summary": "Sam Altman 转引 Nick 的帖子并表示很高兴：Nick 认为可解释性可能是当下最重要的科学问题（不懂模型就无法解决对齐），并称在机制可解释性上有好消息。", "url": "https://x.com/sama/status/2111130577789493706", "cat": "技术观点", "rq": true, "quoted": "interpretability might be the most important scientific problem in the world right now, as I don't think we can solve alignment if we don't know what we're building. I think I have good news about it. I co-authored early work in mechanistic interpretability at OpenAI and came", "media": []}, {"id": "2111128797181567466", "handle": "DrJimFan", "name": "Jim Fan", "username": "DrJimFan", "t": "2026-10-17 00:15", "tu": "2026-10-16T16:15:02.000Z", "text": "We are open-sourcing V1.0 of our agentic robotics framework, ASPIRE, with full real robot skill discovery and self improvement capabilities! On the day Astra arrived, our lab switched the backend model and saturated all the benchmarks to ~99% over night.\n\nAnd the frontier is https://t.co/OGwborKIse", "summary": "Jim Fan 团队开源智能体机器人框架 ASPIRE V1.0，支持真实机器人技能发现与自我改进；换上 GPT-6 Astra 后一夜把各基准刷到约 99%（LIBERO-Pro 99%、Robosuite 100%）。", "url": "https://x.com/DrJimFan/status/2111128797181567466", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2111127991401247033", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-17 00:11", "tu": "2026-10-16T16:11:50.000Z", "text": "Four Gemini 4 Argon agents beat Minecraft from scratch in 27 hours.\n\nOperating in a sandbox using only code and text, they wrote 2,783 programs, divided up jobs over chat, shared notes, and debugged errors together - all with no human help ↓\nhttps://t.co/uyIhDOQXGT", "summary": "四个 Gemini 4 Argon agent 在无人工干预下，仅用代码和文本、27 小时写了 2783 个程序，分工协作从零通关《我的世界》击败末影龙。", "url": "https://x.com/GoogleDeepMind/status/2111127991401247033", "cat": "研究成果", "rq": true, "quoted": "Four Gemini 4 Argon agents, one shared Minecraft world, one goal: defeat the Ender Dragon. 27 hours and 2,783 self-written programs later, the dragon fell. https://t.co/Cx7Djg1VTx", "media": []}, {"id": "2111116656215032068", "handle": "mustafasuleyman", "name": "Mustafa Suleyman", "username": "mustafasuleyman", "t": "2026-10-16 23:26", "tu": "2026-10-16T15:26:48.000Z", "text": "MAI is the most accurate &amp; most popular transcription model on OpenRouter across all languages and use cases. \n\nTry it out for your agents now! 👇 https://t.co/rHOlsQWzro", "summary": "Mustafa Suleyman 称微软 MAI-Transcribe-2 是 OpenRouter 上各语言、各场景中最准确也最受欢迎的语音转写模型，可供 agent 调用。", "url": "https://x.com/mustafasuleyman/status/2111116656215032068", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2111083685961445625", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-16 21:15", "tu": "2026-10-16T13:15:47.000Z", "text": "LIVE STREAM in minutes! Hear from the Reflection team about how they built Beam.\n\nStream: https://t.co/q6OKvCiB9o https://t.co/scNsrfsC3s", "summary": "预告 Reflection 团队直播讲解 Beam 构建；引用帖称 Beam 已跨平台开源（Apache 2.0），并发布权重、分词器与多精度实现。", "url": "https://x.com/huggingface/status/2111083685961445625", "cat": "产品发布", "rq": true, "quoted": "Beam is now available across platforms, with open weights under the Apache 2.0 license - in collaboration with an ecosystem of 40+ partners.\n\nWe're releasing:\n- Weights, tokenizer, and reference implementation\n- BF16, FP8 and NVFP4 weights and a DFlash2 drafter\n- The open source https://t.co/tHYv4cuYIh", "media": []}, {"id": "2111038207240388770", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-16 18:15", "tu": "2026-10-16T10:15:04.000Z", "text": "Together with scientists around the world, our models and tools are helping make disease more detectable, treatable, and preventable. 🧬\n\nFrom pinpointing rare genetic variants to speeding up drug discovery, here’s how we’re helping turn lab breakthroughs into real-world care → https://t.co/pSGAGqwOSx", "summary": "Google DeepMind 介绍其模型与工具如何助力疾病更易检测、治疗与预防，从定位罕见基因变异到加速药物研发，推动实验室成果转化为现实医疗。", "url": "https://x.com/GoogleDeepMind/status/2111038207240388770", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110918113550307778", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-16 10:17", "tu": "2026-10-16T02:17:51.000Z", "text": "This paper shows why I am skeptical of the idea that frontier models can be easily replaced by cheaper ones (and why you should use the best models as orchestrators): Small improvements in accuracy &amp; judgement compound over long-horizon tasks, creating huge gains in outcomes. https://t.co/2P4Eq6RkcN", "summary": "Mollick 引用一篇论文称：准确率和判断力的小幅提升会在长周期任务中层层累积、放大成巨大结果差距，因此前沿模型难被廉价模型替代，应让最强模型担任编排者。", "url": "https://x.com/emollick/status/2110918113550307778", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110913107094606330", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-16 09:57", "tu": "2026-10-16T01:57:58.000Z", "text": "Turns out the future does have flying cars https://t.co/6fexPp6SXI", "summary": "马斯克发布新款 Tesla Roadster 揭幕演示视频：在 SpaceX 德州场地，原型车借助 SpaceX 冷气推进器倒挂驶过弯道坡、腾空后安全落地，他称“未来确实有飞行汽车”。", "url": "https://x.com/elonmusk/status/2110913107094606330", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110877572011844019", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-16 07:36", "tu": "2026-10-15T23:36:46.000Z", "text": "Maybe more than 10GW https://t.co/Hm7CNpAwGA", "summary": "马斯克回应「2027 年底前拿下 10GW 算力」的报道，称可能超过 10GW；黄仁勋表示英伟达已把 SpaceX 列为与云厂商同级的客户。", "url": "https://x.com/elonmusk/status/2110877572011844019", "cat": "行业动态", "rq": true, "quoted": "🛰️ @elonmusk wants 10 gigawatts of compute by the end of 2027. @JensenHuang says Nvidia now counts @SpaceX alongside its cloud provider customers, and the two companies' engineers are designing a server for space", "media": []}, {"id": "2110875851600633956", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-16 07:29", "tu": "2026-10-15T23:29:55.000Z", "text": "Harnesses + smart models = the end of the last famous hard benchmarks.\n\nModels can now work for extremely long times (bye, METR Long Tasks), they can output professional documents with correct math (so long, GDPval) and they can solve complex novel puzzles (farewell, ARC-AGI-3). https://t.co/WSd5e0IfKi", "summary": "Mollick 认为「执行框架 + 强模型」正在终结最后一批知名难基准：METR 长任务、GDPval、ARC-AGI-3 都已被攻克。", "url": "https://x.com/emollick/status/2110875851600633956", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110870483214213496", "handle": "MiraMurati", "name": "Mira Murati", "username": "miramurati", "t": "2026-10-16 07:08", "tu": "2026-10-15T23:08:35.000Z", "text": "One of the best parts of this year, inside Thinky and out, has been watching people follow their own ideas all the way into weights they own. https://t.co/dTblLkTAJ0", "summary": "Thinking Machines 的微调平台 Tinker 上线满一年并发布回顾，Murati 称最欣慰的是看到用户把自己的想法训练成自己拥有的模型权重。", "url": "https://x.com/miramurati/status/2110870483214213496", "cat": "产品发布", "rq": true, "quoted": "Tinker lets customers turn their expertise into cutting-edge models that they own. One year after launch, we look back at what we’ve shipped and what our users are building.\nhttps://t.co/fWTOG5U3k1", "media": []}, {"id": "2110861420321759269", "handle": "AIatMeta", "name": "AI at Meta", "username": "AIatMeta", "t": "2026-10-16 06:32", "tu": "2026-10-15T22:32:35.000Z", "text": "We’re proud to share that Meta Omnilingual Automatic Speech Recognition (ASR) has been named one of @TIME’s Best Inventions of 2026!\n\nMeta Omnilingual ASR is a suite of models providing ASR capabilities for over 1,600 languages, including 500 low-coverage languages never before https://t.co/pQjBPvE5XG", "summary": "Meta 的全语种语音识别模型 Omnilingual ASR 入选《时代》2026 年度最佳发明，支持 1600 多种语言，其中 500 种低资源语言此前从未有过 AI 转写。", "url": "https://x.com/AIatMeta/status/2110861420321759269", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110846112152105136", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-16 05:31", "tu": "2026-10-15T21:31:45.000Z", "text": "Working out how best to use AI in mathematics research—and in science more generally—will take time, effort, and resources. We’re eager to support mathematicians as they drive scientific progress and define the future of their field.\n\nWe’ve committed $5 million of funding, https://t.co/GzFchwMukC", "summary": "Anthropic 同样向西蒙斯基金会的「AI 时代数学」计划投入 500 万美元，支持数学家探索如何把 AI 用于数学和科学研究。", "url": "https://x.com/AnthropicAI/status/2110846112152105136", "cat": "融资与商业", "rq": true, "quoted": "How can the math community forge the best path forward in the AI age? We're committing $15M to workshops and initiatives — plus free AI computing resources for foundation-supported researchers — through new partnerships with @AnthropicAI and @OpenAI: https://t.co/Aw0lh9UX51", "media": []}, {"id": "2110841898076418336", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-16 05:15", "tu": "2026-10-15T21:15:00.000Z", "text": "We're expanding access to GPT-Rosalind for academic research.\n\nThe new Rosalind Academic Plan helps scientific labs bring AI into the work of understanding biology, exploring ideas, and deciding what to test next—with sponsored access for eligible labs at U.S. universities. https://t.co/1O702wdc5f", "summary": "OpenAI 推出 Rosalind 学术计划，扩大生物研究模型 GPT-Rosalind 的学术使用，为符合条件的美国高校实验室提供资助访问。", "url": "https://x.com/OpenAI/status/2110841898076418336", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110835673003667527", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-16 04:50", "tu": "2026-10-15T20:50:16.000Z", "text": "We're sending a bunch of Microducks to assess @AnthropicAI! \n\nKidding aside, it hasn't been approved yet but in my opinion, it's very important that open-source engineers and scientists are included in these important endeavors for transparency. That's a big part of why https://t.co/ebI6F06ud5", "summary": "回应 Anthropic 引入第三方评估，Hugging Face CEO 表示（尚未获批）希望开源工程师和科学家也能参与这类评估，以保证透明度。", "url": "https://x.com/ClementDelangue/status/2110835673003667527", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110797830361436604", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-16 02:19", "tu": "2026-10-15T18:19:54.000Z", "text": "New voices. Better accents. And less \"checking...\"\n\nGPT-Live-1.1 brings these updates to Voice in ChatGPT, Codex, and dots, with new voices in French, German, Hindi, Mexican Spanish, Korean, and Japanese.\n\nRolling out today to all users. Coming soon to the API. https://t.co/L6K8ZUC1xm", "summary": "OpenAI 推出语音模型 GPT-Live-1.1，用于 ChatGPT、Codex 和 dots 的语音功能，口音更自然、等待更少，新增法、德、印地、墨西哥西语、韩、日语音色，今天向所有用户推送，API 稍后上线。", "url": "https://x.com/OpenAI/status/2110797830361436604", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110791576435794339", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-16 01:55", "tu": "2026-10-15T17:55:03.000Z", "text": "llama serve -hf ggml-org/Muse-Spark-Open-816B-A42B-GGUF:Q2_K (on two mac studios). \n\nWell done @finkd &amp; @johnternus! https://t.co/Kjl7qbPV52", "summary": "Hugging Face CEO 演示用 llama.cpp 在两台 Mac Studio 上跑 Meta 新开源的 Muse Spark Open 816B（Q2_K 量化 GGUF 版）。", "url": "https://x.com/ClementDelangue/status/2110791576435794339", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110789964430786745", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-16 01:48", "tu": "2026-10-15T17:48:38.000Z", "text": "Old friends are the best friends. Jensen rocks. \n\nThe Star Mind computer being co-engineered by SpaceX and Nvidia is far better than almost anyone expects and will reach volume production next year.\n\nWorking with the incredibly talented Nvidia engineering team is pure joy! https://t.co/73ULmppqjP", "summary": "马斯克称 SpaceX 与英伟达联合研发的「Star Mind」计算机（面向太空数据中心的服务器）性能远超预期，明年量产。", "url": "https://x.com/elonmusk/status/2110789964430786745", "cat": "行业动态", "rq": true, "quoted": "Jensen Huang says he loves working with Elon Musk, and reveals their engineering teams are designing a new type of server to put data centers in space", "media": []}, {"id": "2110784662071398807", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-16 01:27", "tu": "2026-10-15T17:27:34.000Z", "text": "We’ve committed to having evaluators assess our safety practices. We're in discussions with multiple organizations, and have now given employee-like access to a team from @METR_Evals.\n\nIn this post, we describe how we work with third-party evaluators: https://t.co/8CLQnMVg4X", "summary": "Anthropic 承诺引入第三方评估其安全实践，已给 METR 团队提供「类员工级」内部访问权限，并正与多家机构洽谈，同时发文说明与第三方评估者的合作方式。", "url": "https://x.com/AnthropicAI/status/2110784662071398807", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110779754274292212", "handle": "AIatMeta", "name": "AI at Meta", "username": "AIatMeta", "t": "2026-10-16 01:08", "tu": "2026-10-15T17:08:04.000Z", "text": "Today we’re releasing Muse Spark Open, the most capable US open-weight model to date.\n\nBuilt for coding and agentic work, it excels at long-horizon tasks, complex software engineering, and multi-step reasoning.\n\nKey Model Specs:\n→ 816B total / 42B active parameters\n→ 1M token https://t.co/yAtoxNeYJm", "summary": "Meta 发布开放权重模型 Muse Spark Open（总参数 816B、激活 42B、百万 token 上下文），主打编程与智能体任务，称是迄今最强的美国开放权重模型。", "url": "https://x.com/AIatMeta/status/2110779754274292212", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110775560846914009", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-16 00:51", "tu": "2026-10-15T16:51:24.000Z", "text": "Argon has a similar performance profile on ARC-AGI-3 as Astra. Google is back at the frontier. https://t.co/a6GGEsMN4A", "summary": "Chollet 评论 Gemini 4 Argon 在 ARC-AGI-3 上的表现与 Astra 相当（ARC-AGI-3 达 97.5%，成为第二家超过 95% 的前沿实验室），称谷歌重回前沿。", "url": "https://x.com/fchollet/status/2110775560846914009", "cat": "技术观点", "rq": true, "quoted": "Gemini 4 Argon from @Google on ARC-AGI (Verified):\n\n- ARC-AGI-3: 97.5%, $4.8K (provider adapter harness), 49.8%, $5.8K (standard harness)\n- ARC-AGI-2: 91.3%, $0.32/task\n- ARC-AGI-1: 98.5%, $0.16/task\n\nGoogle DeepMind is the second frontier AI lab to score above 95% on ARC-AGI-3. https://t.co/8siwgfBJcr", "media": []}, {"id": "2110766651344146564", "handle": "mustafasuleyman", "name": "Mustafa Suleyman", "username": "mustafasuleyman", "t": "2026-10-16 00:16", "tu": "2026-10-15T16:16:00.000Z", "text": "We now have state-of-the-art pre-trained base models in the 3T-parameter weight class, built entirely in-house at MAI.\n\nPost-training results coming soon -- stay tuned!\n\nLots of details in our technical blog post.\n\nhttps://t.co/K8Nh4YFDJL", "summary": "微软 AI（MAI）宣布已完全自研出 3 万亿参数级别的 SOTA 预训练基座模型，后训练结果即将公布，技术博客已发。", "url": "https://x.com/mustafasuleyman/status/2110766651344146564", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110751021454811549", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-15 23:13", "tu": "2026-10-15T15:13:54.000Z", "text": "The sudden collapse of the value of CoT (even summarized CoT) in the agentic era changes working with AI.\n\nEffectively steering AIs and getting any sort of observability now requires you to ask for interim outputs &amp; tests, and to use AI help to troubleshoot problems you find.", "summary": "Mollick 指出在智能体时代思维链（哪怕是摘要版）的参考价值骤降，想有效引导和观察 AI，需要主动要求中间产出和测试，并借助 AI 排查问题。", "url": "https://x.com/emollick/status/2110751021454811549", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110741355739963884", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-
