*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);}

.wrap{display:flex;gap:0;align-items:flex-start;}
aside{width:230px;flex:0 0 230px;border-right:1px solid var(--line);height:calc(100vh - 56px);overflow:auto;position:sticky;top:56px;padding:10px 8px;}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 10px 6px;}
.acct{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--fg);}

.acct.active{background:var(--accent);color:#fff}

main{flex:1;min-width:0;padding:16px 20px 60px;}

.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

.search input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:13px;width:220px;outline:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.card .name{font-weight:600}
.card .uh{color:var(--mut);font-size:12px}
.card .time{color:var(--mut);font-size:12px;margin-left:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:#bcd0ff}
.tag.rq{color:#ffd9a8}
.card .summary{font-size:14.5px;line-height:1.65;color:var(--fg);margin-bottom:6px}
.card .orig{margin-top:2px}
.card .orig>summary{cursor:pointer;color:var(--mut);font-size:12px;list-style:none;user-select:none}
.card .orig>summary::-webkit-details-marker{display:none}
.card .orig>summary:before{content:"▸ ";color:var(--mut)}
.card .orig[open]>summary:before{content:"▾ "}
.card .text{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--mut);margin-top:6px}
.quoted{margin-top:8px;padding:8px 12px;border-left:3px solid var(--line);background:var(--panel2);border-radius:6px;color:var(--mut);font-size:13px;white-space:pre-wrap}
.card .foot{margin-top:10px;display:flex;gap:12px;align-items:center}
.card a.open{color:var(--accent);text-decoration:none;font-size:12px}
.card a.open:hover{text-decoration:underline}
.media{font-size:11px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:60px 0}
.count{color:var(--mut);font-size:12px;margin-bottom:10px}
@media(max-width:760px){aside{display:none}.search input{width:140px}}

": "https://x.com/elonmusk/status/2108062018490249347", "cat": "行业动态", "rq": true, "quoted": "Awesome day, @satyanadella! \n\nWindows sparked a platform shift that created a new industry for NVIDIA. Then we invented programmable shading GPUs for DirectX, which led to CUDA. \n\nThen we partnered to bring GPU supercomputers to Azure, which helped OpenAI train GPT. That https://t.co/2JiZinfW64", "media": []}, {"id": "2108027570382086435", "handle": "JeffDean", "name": "Jeff Dean", "username": "JeffDean", "t": "2026-10-08 10:51", "tu": "2026-10-08T02:51:52.000Z", "text": "Very sorry to hear this news. 😥\n\nI never had the chance to meet Margaret Hamilton, but her contributions to the flight software that got us to the moon are legendary.  I love this image of her standing next to the printouts of the Apollo code. https://t.co/2HJPXcTfiC https://t.co/AEsvOuFTvM", "summary": "引用 Margaret Hamilton 以 90 岁辞世的消息（她以在 MIT 领导阿波罗登月飞行软件开发闻名），表示哀悼，称她对登月飞行软件的贡献是传奇性的。", "url": "https://x.com/JeffDean/status/2108027570382086435", "cat": "其他", "rq": true, "quoted": "We’ve lost an icon. Margaret Hamilton, a computer science pioneer best known for her work at MIT leading development of the flight software for the Apollo missions to the moon, has died at 90. Read about her legacy via MIT News: https://t.co/ODkbdIsoHw https://t.co/M2xauYYUkU", "media": []}, {"id": "2108024511773937838", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "2026-10-08 10:39", "tu": "2026-10-08T02:39:43.000Z", "text": "RT @sundarpichai: Introducing EmbeddingGemma 2, a new open multimodal model that sets the standard for on-device efficiency.\n\n- our first o…", "summary": "转发 Sundar Pichai：发布开放多模态模型 EmbeddingGemma 2，是 Google 首个原生多模态开放嵌入模型，以 7.4 亿（740M）参数的轻量模块化形态处理文本、代码、图像、视频和音频，主打端侧效率。", "url": "https://x.com/demishassabis/status/2108024511773937838", "cat": "产品发布", "rq": true, "quoted": "Introducing EmbeddingGemma 2, a new open multimodal model that sets the standard for on  \"cognitive consequences of programming\" was a major psychological research focus. The prevailing hypothesis was that learning formal logic and algorithmic structures through computer programming would act as a form of https://t.co/0g9JwVgrqR", "summary": "引用自己关于“参差能力前沿”的帖子，以人类作对比：80 年代心理学曾研究“编程的认知效果”，当时主流假设是学编程和形式逻辑能提升一般推理能力（借此讨论数学/代码能力是否会迁移）。", "url": "https://x.com/fchollet/status/2107997468671852922", "cat": "技术观点", "rq": true, "quoted": "What if the jagged frontier is mainly math + code (which you can push arbitrarily far with RLVR), and everything else starts to plateau because it is still bottlenecked by human generated data? \n\nModel performance in non-verifiable areas has kept improving steadily, albeit much", "media": []}, {"id": "2107973162591805605", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-08 07:15", "tu": "2026-10-07T23:15:40.000Z", "text": "RT @ylecun: @sakshjn @rsalakhu The 1991 version is an obscure tech report with a vague idea, no theory, no experiment to speak of, and cert…", "summary": "转发自己的回复：批评某篇 1991 年的技术报告只是一个模糊想法，没有理论、实验和代码，作者也从未继续推进，不应据此主张优先权。", "url": "https://x.com/ylecun/status/2107973162591805605", "cat": "技术观点", "rq": true, "quoted": "@sakshjn @rsalakhu The 1991 version is an obscure tech report with a vague idea, no theory, no experiment to speak of, and certainly no code, that the author never revisited or pushed. \nIt has one hand-drawn architecture diagram, one formula of the type f(x)=0, and a claim that every other", "media": []}, {"id": "2107964764316209326", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-08 06:42", "tu": "2026-10-07T22:42:18.000Z", "text": "Some early first-hand accounts of encountering a narrow superhuman intelligence as mathematicians grapple with the hundreds of big AI proofs released by OpenAI.\n\nProblems solved in inhuman ways that make us wonder what it means to actually know things... https://t.co/DgpHqbYKCR https://t.co/saiSe2pl3f", "summary": "分享数学家面对 OpenAI 发布的数百个重大 AI 证明的第一手感受，形容像遭遇一种“狭义的超人智能”：问题以非人类的方式被解决，让人反思“真正懂得”意味着什么。", "url": "https://x.com/emollick/status/2107964764316209326", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107940728009879622", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-08 05:06", "tu": "2026-10-07T21:06:47.000Z", "text": "RT @michpokrass: today we’re shipping gpt-6 and intelligent ui to everyone!\n\nintelligent ui is a bet on model intelligence. we’re letting g…", "summary": "转发 OpenAI 的 Michelle Pokrass：GPT-6 和 Intelligent UI 向所有人上线；Intelligent UI 是押注模型智能，让 GPT-6 用高实用性的可视化和交互组件填满画布，是 ChatGPT 的一次重大改变。", "url": "https://x.com/OpenAI/status/2107940728009879622", "cat": "产品发布", "rq": true, "quoted": "today we’re shipping gpt-6 and intelligent ui to everyone!\n\nintelligent ui is a bet on model intelligence. we’re letting gpt-6 fill the canvas with high utility visual and interactive components. it’s a pretty big change to chatgpt! we had to craft the right tools for gpt-6 to be https://t.co/3sFyDvgxkR", "media": []}, {"id": "2107939627898400819", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-08 05:02", "tu": "2026-10-07T21:02:25.000Z", "text": "Great to partner with NVIDIA as we kick off this next chapter for Windows.\n\nThank you @JensenHuang and @sriramk for joining us today! https://t.co/Jh1os7T9Zu", "summary": "感谢 NVIDIA 在 Windows 新篇章启动中的合作，并感谢黄仁勋和 Sriram Krishnan 到场。", "url": "https://x.com/satyanadella/status/2107939627898400819", "cat": "行业动态", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2107938889004396561", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-08 04:59", "tu": "2026-10-07T20:59:29.000Z", "text": "Had early access to the Intelligent UI experience and it was a nice change from walls of text. It also suggests that, increasingly, we are going to see interfaces built on demand for the problem that you have. https://t.co/UMPsP6lzYz", "summary": "引用 OpenAI 的 GPT-6 发布帖，说自己提前体验过 Intelligent UI，比满屏文字清爽；认为今后会越来越多地看到针对具体问题按需生成的界面。", "url": "https://x.com/emollick/status/2107938889004396561", "cat": "技术观点", "rq": true, "quoted": "GPT-6 and Intelligent UI, now rolling out in ChatGPT for everyone.\n\nIntelligent UI in ChatGPT delivers fast, interactive answers that make everyday questions more visual, complex topics easier to grasp, and interactive tools for your task available on the spot. https://t.co/XL2gDCPBwG", "media": []}, {"id": "2107929853676990731", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 04:23", "tu": "2026-10-07T20:23:35.000Z", "text": "RT @ClementDelangue: If you need any more evidence about how exciting local AI (and llamacpp) is! From the @Microsoft windows launch today…", "summary": "转发 Clément Delangue：称微软 Windows 发布会再次证明本地 AI 和 llama.cpp 有多令人兴奋。", "url": "https://x.com/huggingface/status/2107929853676990731", "cat": "技术观点", "rq": true, "quoted": "If you need any more evidence about how exciting local AI (and llamacpp) is! From the @Microsoft windows launch today with @satyanadella @sriramk @JensenHuang https://t.co/mN7gkgj2Rd", "media": []}, {"id": "2107929676358300047", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 04:22", "tu": "2026-10-07T20:22:52.000Z", "text": "RT @_philschmid: EmbeddingGemma 2 is out! Our first native multimodal embeddings built on Gemma 4 under Apache 2.0. 🤗 Embeds 100+ languages…", "summary": "转发 Philipp Schmid：EmbeddingGemma 2 发布，基于 Gemma 4、Apache 2.0 许可的首个原生多模态嵌入模型，支持 100+ 语言及代码、图像、音频、视频，8192 上下文，提供 740M/440M/570M/270M 多个版本，MTEB 提升 14%。", "url": "https://x.com/huggingface/status/2107929676358300047", "cat": "产品发布", "rq": true, "quoted": "EmbeddingGemma 2 is out! Our first native multimodal embeddings built on Gemma 4 under Apache 2.0. 🤗 Embeds 100+ languages, code, images, audio, and video into one vector.\n\n🧮 8,192 context\n3️⃣ 740M omni, 440M text+vision, 570M text+audio, or 270M text-only\n📈 +14% jump on MTEB", "media": []}, {"id": "2107929604149403673", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 04:22", "tu": "2026-10-07T20:22:35.000Z", "text": "RT @liquidai: Choose d1-3B for high-quality text and vision decisions, or explore our experimental d1-omni-600M when footprint matters.\n\nDo…", "summary": "转发 Liquid AI：d1-3B 适合高质量文本与视觉决策，实验性的 d1-omni-600M 适合对体积敏感的场景；权重可下载、微调并本地部署。", "url": "https://x.com/huggingface/status/2107929604149403673", "cat": "产品发布", "rq": true, "quoted": "Choose d1-3B for high-quality text and vision decisions, or explore our experimental d1-omni-600M when footprint matters.\n\nDownload the weights, fine-tune, and deploy locally.\n\n&gt; Blog: https://t.co/15X98RRo3l\n&gt; d1-3B: https://t.co/3iSPY67UXL\n&gt; d1-omni-600M:", "media": []}, {"id": "2107929574206218545", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 04:22", "tu": "2026-10-07T20:22:28.000Z", "text": "RT @vivmarquez: decision models, now open and multimodal! https://t.co/wiZxwJKQBu", "summary": "转发 vivmarquez：决策模型现已开放且支持多模态（附链接，应指 Liquid AI 的 Open d1）。", "url": "https://x.com/huggingface/status/2107929574206218545", "cat": "产品发布", "rq": true, "quoted": "decision models, now open and multimodal! https://t.co/wiZxwJKQBu https://t.co/eww4TjPW1q", "media": ["video"]}, {"id": "2107927636529795117", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-08 04:14", "tu": "2026-10-07T20:14:46.000Z", "text": "If you need any more evidence about how exciting local AI (and llamacpp) is! From the @Microsoft windows launch today with @satyanadella @sriramk @JensenHuang https://t.co/mN7gkgj2Rd", "summary": "称微软 Windows 发布会（纳德拉、Sriram Krishnan、黄仁勋出席）再次证明本地 AI 和 llama.cpp 有多令人兴奋。", "url": "https://x.com/ClementDelangue/status/2107927636529795117", "cat": "技术观点", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2107924408597950702", "handle": "sama", "name": "Sam Altman", "username": "sama", "t": "2026-10-08 04:01", "tu": "2026-10-07T20:01:57.000Z", "text": "ChatGPT can now generate a custom UI for you! https://t.co/ZdGRMAEjQX", "summary": "引用 OpenAI 的 GPT-6 与 Intelligent UI 发布帖，评论称 ChatGPT 现在能为用户生成定制化界面。", "url": "https://x.com/sama/status/2107924408597950702", "cat": "产品发布", "rq": true, "quoted": "GPT-6 and Intelligent UI, now rolling out in ChatGPT for everyone.\n\nIntelligent UI in ChatGPT delivers fast, interactive answers that make everyday questions more visual, complex topics easier to grasp, and interactive tools for your task available on the spot. https://t.co/XL2gDCPBwG", "media": []}, {"id": "2107923383065223512", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-08 03:57", "tu": "2026-10-07T19:57:52.000Z", "text": "RT @perplexity_ai: We're releasing pplx-embed-v2-late, two late-interaction embedding models that retrieve text, images, and pages with a s…", "summary": "转发 Perplexity：发布 pplx-embed-v2-late，两款后期交互（late-interaction）嵌入模型，可在共享嵌入空间中检索文本、图像和页面，均达前沿性能并已在 Hugging Face 公开。", "url": "https://x.com/ClementDelangue/status/2107923383065223512", "cat": "产品发布", "rq": true, "quoted": "We're releasing pplx-embed-v2-late, two late-interaction embedding models that retrieve text, images, and pages with a shared embedding space for cross-model querying.\n\nBoth models achieve frontier performance and are publicly available on Hugging Face.\n\nhttps://t.co/AM7YEyQkKE https://t.co/fR8kaYmHs1", "media": []}, {"id": "2107923341827060162", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-08 03:57", "tu": "2026-10-07T19:57:42.000Z", "text": "RT @AravSrinivas: We’re open-sourcing pplx-embed-v2-late, multi-vector embeddings for text and images, 9B and 0.6B, in one shared embedding…", "summary": "转发 Aravind Srinivas：Perplexity 开源 pplx-embed-v2-late，有 9B 和 0.6B 两个规模、共享嵌入空间的文本+图像多向量嵌入；可用 9B 建索引、0.6B 在端侧查询，还能免 OCR 直接搜索 PDF 页面。", "url": "https://x.com/ClementDelangue/status/2107923341827060162", "cat": "产品发布", "rq": true, "quoted": "We’re open-sourcing pplx-embed-v2-late, multi-vector embeddings for text and images, 9B and 0.6B, in one shared embedding space. You can use these to index multimodal data with 9B, and query on device with 0.6B. This also enables you to search over PDF pages with no OCR. And https://t.co/O1Ga7lAr96", "media": []}, {"id": "2107919668514295908", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-08 03:43", "tu": "2026-10-07T19:43:06.000Z", "text": "We’re supercharging Copilot on Windows with Hybrid Intelligence.\n\nWith your permission, Copilot can tap into the context on your PC, take action for you, and use local models when it makes sense, giving you more capability while helping your tokens go further. https://t.co/7YvqHh8RKT", "summary": "微软为 Windows 上的 Copilot 推出 Hybrid Intelligence：经用户许可，Copilot 可调用本机上下文、替用户执行操作，并在合适时使用本地模型，以节省 token。", "url": "https://x.com/satyanadella/status/2107919668514295908", "cat": "产品发布", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2107918930270409060", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-08 03:40", "tu": "2026-10-07T19:40:10.000Z", "text": "RT @askalphaxiv: New paper advised by Yann LeCun!\n\n\"H-JEPA: End-to-End Learning of Hierarchical World Models for Visual Planning\"\n\nMost wor…", "summary": "转发 alphaXiv：介绍 LeCun 指导的新论文 H-JEPA，即端到端学习的分层世界模型，用于视觉规划，解决单一潜空间、单一时间尺度导致长程规划成本高的问题。", "url": "https://x.com/ylecun/status/2107918930270409060", "cat": "研究成果", "rq": true, "quoted": "New paper advised by Yann LeCun!\n\n\"H-JEPA: End-to-End Learning of Hierarchical World Models for Visual Planning\"\n\nMost world models plan in a single latent space and at one timescale, which makes long-horizon planning expensive and forces one representation to handle both https://t.co/fh7gDZ0zro", "media": []}, {"id": "2107909792945832070", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-08 03:03", "tu": "2026-10-07T19:03:52.000Z", "text": "We're sharing progress on ChatGPT for Teens, our ChatGPT experience for people under 18, alongside a preview of College Planner, new study tools, and support for college advisers and teen voices.\n\nChatGPT for Teens applies automatically to accounts identified as belonging to https://t.co/XNEA5IuTFo", "summary": "OpenAI 公布 ChatGPT for Teens（面向 18 岁以下用户的 ChatGPT 体验）的进展，同时预告 College Planner、新学习工具，以及对升学顾问和青少年声音的支持；被识别为未成年人的账号会自动启用。", "url": "https://x.com/OpenAI/status/2107909792945832070", "cat": "产品发布", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2107908193666187560", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-08 02:57", "tu": "2026-10-07T18:57:31.000Z", "text": "RT @pushmeet: Building predictive biology models is one of the most important scientific challenges of our time, but solving this requires…", "summary": "转发 Pushmeet Kohli：构建预测性生物学模型是当代最重要的科学挑战之一，需要空前规模的新实验数据；宣布 Google DeepMind 与陈-扎克伯格倡议（CZI）的 Virtual Biology Initiative 合作。", "url": "https://x.com/GoogleDeepMind/status/2107908193666187560", "cat": "行业动态", "rq": true, "quoted": "Building predictive biology models is one of the most important scientific challenges of our time, but solving this requires new experimental biological data at an unprecedented scale. \n\nI’m pleased to announce that @GoogleDeepmind is partnering with @ChanZuckerberg’s Virtual", "media": []}, {"id": "2107900789423509695", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-08 02:28", "tu": "2026-10-07T18:28:05.000Z", "text": "RT @chem_safety: Today we are open-sourcing 🥕Karotte, our framework for building RL environments.\n\nWe've used it for the past year to build…", "summary": "转发 chem_safety：开源 RL 环境构建框架 Karotte，过去一年用它为前沿实验室构建机器学习工程类 RL 环境，经过 100 万次以上评估运行和红队测试打磨。", "url": "https://x.com/swyx/status/2107900789423509695", "cat": "产品发布", "rq": true, "quoted": "Today we are open-sourcing 🥕Karotte, our framework for building RL environments.\n\nWe've used it for the past year to build MLE RL environments for frontier labs, and it's been hardened through 1M+ evaluation runs and red-teaming. https://t.co/UP7kKbSBbe", "media": []}, {"id": "2107899150247616531", "handle": "gdb", "name": "Greg Brockman", "username": "gdb", "t": "2026-10-08 02:21", "tu": "2026-10-07T18:21:34.000Z", "text": "Introducing Intelligent UI, a new capability in ChatGPT for answering quickly with fully interactive user interfaces: https://t.co/4wkDzbjwu4", "summary": "引用 OpenAI 的 GPT-6 发布帖，介绍 Intelligent UI：ChatGPT 的新能力，用完全可交互的用户界面快速作答。", "url": "https://x.com/gdb/status/2107899150247616531", "cat": "产品发布", "rq": true, "quoted": "GPT-6 and Intelligent UI, now rolling out in ChatGPT for everyone.\n\nIntelligent UI in ChatGPT delivers fast, interactive answers that make everyday questions more visual, complex topics easier to grasp, and interactive tools for your task available on the spot. https://t.co/XL2gDCPBwG", "media": []}, {"id": "2107898018112647313", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-08 02:17", "tu": "2026-10-07T18:17:05.000Z", "text": "Today marks a new chapter for Windows, as we bring unmetered intelligence to every desk and every home, and make every PC a place where agents can work securely on your behalf.\n\nSome highlights of what we announced:\n\n• MAI-Code-1.1 Flash: 137B parameter coding model w/ 256K https://t.co/XHEGXmHUCq", "summary": "纳德拉称 Windows 迎来新篇章：把不限量的智能带到每张桌子和每个家庭，让每台 PC 成为 AI 代理能安全代劳的地方；亮点之一是 MAI-Code-1.1 Flash，一个 1370 亿（137B）参数、256K 上下文的编程模型。", "url": "https://x.com/satyanadella/status/2107898018112647313", "cat": "产品发布", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2107895489614250316", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-08 02:07", "tu": "2026-10-07T18:07:02.000Z", "text": "Much of the world is based on the assumption that the future is like the past and an original meaning of “singularity” was a point where that relationship breaks. I don’t know if there will be one big Singularity, but a million little singularities across fields seems inevitable.", "summary": "认为世界很多运作都基于“未来像过去”的假设，“奇点”的原意就是这一关系失效之处；不确定会不会有一个大奇点，但各领域出现无数“小奇点”似乎不可避免。", "url": "https://x.com/emollick/status/2107895489614250316", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107895115671031810", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 02:05", "tu": "2026-10-07T18:05:33.000Z", "text": "RT @netflix: When the open-source AI platform Hugging Face was hit by a cyberattack this July, it quickly became clear this was no ordinary…", "summary": "转发 Netflix：纪录短片《Instadocs: AI Gone Wild》重现今年 7 月 Hugging Face 遭遇的网络攻击，称攻击者是 OpenAI 研究人员创建的自主代理，而非人类。", "url": "https://x.com/huggingface/status/2107895115671031810", "cat": "行业动态", "rq": true, "quoted": "When the open-source AI platform Hugging Face was hit by a cyberattack this July, it quickly became clear this was no ordinary breach because the hackers weren’t human: they were autonomous agents created by OpenAI researchers.\n\nInstadocs: AI Gone Wild reconstructs the breach as https://t.co/NV4YY5G0ik", "media": []}, {"id": "2107895006350791071", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-08 02:05", "tu": "2026-10-07T18:05:06.000Z", "text": "GPT‑6 with Intelligent UI rolls out globally to Plus, Pro, Business, and Enterprise users today and will expand to Free and Go users starting tomorrow.\n\nGPT‑6 in ChatGPT is powered by GPT‑6 Sol for Plus, Pro, Business, and Enterprise tiers, and GPT‑6 Luna for Free and Go tiers.", "summary": "GPT-6 与 Intelligent UI 今天向全球 Plus、Pro、Business 和 Enterprise 用户推送，明天起扩展到 Free 和 Go 用户；付费档由 GPT-6 Sol 驱动，Free 和 Go 档由 GPT-6 Luna 驱动。", "url": "https://x.com/OpenAI/status/2107895006350791071", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2107894999119774148", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-08 02:05", "tu": "2026-10-07T18:05:05.000Z", "text": "With Intelligent UI, GPT‑6 can now compose responses using text, visuals, and interactive elements, choosing how they fit together based on your question.\n\nResponses can include graphics and charts to help explain an idea, along with tappable buttons, forms, and interactive https://t.co/KnaBwgJ2gf", "summary": "介绍 Intelligent UI：GPT-6 可根据问题组合文字、图像和交互元素作答，回答中可包含解释概念的图形图表，以及可点击的按钮、表单等交互组件。", "url": "https://x.com/OpenAI/status/2107894999119774148", "cat": "产品发布", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2107894997538525580", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-08 02:05", "tu": "2026-10-07T18:05:04.000Z", "text": "GPT-6 and Intelligent UI, now rolling out in ChatGPT for everyone.\n\nIntelligent UI in ChatGPT delivers fast, interactive answers that make everyday questions more visual, complex topics easier to grasp, and interactive tools for your task available on the spot. https://t.co/XL2gDCPBwG", "summary": "OpenAI 宣布 GPT-6 和 Intelligent UI 向所有 ChatGPT 用户推送；Intelligent UI 提供快速的交互式回答，让日常问题更直观、复杂话题更易懂，并能当场提供完成任务的交互工具。", "url": "https://x.com/OpenAI/status/2107894997538525580", "cat": "产品发布", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2107894724073832517", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 02:03", "tu": "2026-10-07T18:03:59.000Z", "text": "RT @EmmaScharfmann: EmbeddingGemma made it possible for so many AI for Science projects to get started:\n🩺 Embedding Gemma 300m Medical\n🌍 Ge…", "summary": "转发 Emma Scharfmann：初代 EmbeddingGemma 催生了许多 AI for Science 项目（医学、地理、肿瘤学、PubMed 等变体），昨天在 Hugging Face 上线的 EmbeddingGemma 2 将带来更多新可能。", "url": "https://x.com/huggingface/status/2107894724073832517", "cat": "其他", "rq": true, "quoted": "EmbeddingGemma made it possible for so many AI for Science projects to get started:\n🩺 Embedding Gemma 300m Medical\n🌍 Geo-Gemma\n🎗️ Oncology-Gemma\n📚 EmbeddingGemma PubMed\nEmbeddingGemma 2, which released and made available on Hugging Face yesterday, opens the door to so many new", "media": []}, {"id": "2107894672207266029", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 02:03", "tu": "2026-10-07T18:03:47.000Z", "text": "RT @liquidai: Today we release Open d1: two open-weight multimodal models in our d1 decision model family.\n\n&gt; d1-3B: text + vision\n&gt; d1-omn…", "summary": "转发 Liquid AI：发布 Open d1，d1 决策模型家族的两款开放权重多模态模型——d1-3B（文本+视觉）和 d1-omni-600M（文本+图像或文本+音频），可在从 NVIDIA DGX 数据中心到 RTX 工作站再到 Jetson 边缘设备上实时决策。", "url": "https://x.com/huggingface/status/2107894672207266029", "cat": "产品发布", "rq": true, "quoted": "Today we release Open d1: two open-weight multimodal models in our d1 decision model family.\n\n&gt; d1-3B: text + vision\n&gt; d1-omni-600M: text + image or text + audio\n&gt; Real-time decision making anywhere, from data centers such as @nvidia DGX to RTX workstations to Jetson at the edge. https://t.co/aE4rnBfIkL", "media": []}, {"id": "2107894654872281276", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 02:03", "tu": "2026-10-07T18:03:43.000Z", "text": "RT @adithya_s_k: Introducing RL Environment Explorer 🧭\n\nThere are now 12M+ RL task entries across RL environments on the @huggingface Hub.…", "summary": "转发 adithya_s_k：推出 RL Environment Explorer，Hugging Face Hub 上 RL 环境已有超 1200 万条任务，可在一处浏览、可视化并运行 OpenEnv、Harbor、MiMo、Verifiers、NeMo Gym 等环境。", "url": "https://x.com/huggingface/status/2107894654872281276", "cat": "产品发布", "rq": true, "quoted": "Introducing RL Environment Explorer 🧭\n\nThere are now 12M+ RL task entries across RL environments on the @huggingface Hub.\n\nYou can now explore, visualize, and run RL environments across:\nOpenEnv • Harbor • MiMo • Verifiers • NeMo Gym\n\nAll in one place https://t.co/gFj50ppX03", "media": []}, {"id": "2107894208547983705", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-08 02:01", "tu": "2026-10-07T18:01:56.000Z", "text": "Claude Haiku 5.5, our latest model: https://t.co/a81H0avciK", "summary": "引用发布帖：推出 Claude Haiku 5.5，称是 Anthropic 迄今最便宜、最快、能力最强的小模型，平均运行成本比 Claude Haiku 4.5 低约 75%。", "url": "https://x.com/AnthropicAI/status/2107894208547983705", "cat": "产品发布", "rq": true, "quoted": "Introducing Claude Haiku 5.5: the cheapest, fastest, and most capable small model we’ve ever released.\n\nOn average, it costs around 75% less to run than Claude Haiku 4.5. https://t.co/jm06cZJfkV", "media": []}, {"id": "2107893431506755774", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-08 01:58", "tu": "2026-10-07T17:58:51.000Z", "text": "RT @netflix: When the open-source AI platform Hugging Face was hit by a cyberattack this July, it quickly became clear this was no ordinary…", "summary": "转发 Netflix：纪录短片《Instadocs: AI Gone Wild》重现今年 7 月 Hugging Face 遭遇的网络攻击，称攻击者不是人类，而是 OpenAI 研究人员创建的自主代理。", "url": "https://x.com/ClementDelangue/status/2107893431506755774", "cat": "行业动态", "rq": true, "quoted": "When the open-source AI platform Hugging Face was hit by a cyberattack this July, it quickly became clear this was no ordinary breach because the hackers weren’t human: they were autonomous agents created by OpenAI researchers.\n\nInstadocs: AI Gone Wild reconstructs the breach as https://t.co/NV4YY5G0ik", "media": []}, {"id": "2107891092762890588", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 01:49", "tu": "2026-10-07T17:49:33.000Z", "text": "RT @pcuenq: It's crazy that I can run MiMo 2.6 Flash across my RTX 6000 GPU and my M5 laptop at 40 tokens/sec over 10 GbE 🤯\n\nThese are the…", "summary": "转发 Pedro Cuenca：用 10GbE 网络把 RTX 6000 显卡和 M5 笔记本组合起来，以 40 token/秒运行 MiMo 2.6 Flash 的原生 mxfp4 权重，llama.cpp 开箱即支持这种异构硬件。", "url": "https://x.com/huggingface/status/2107891092762890588", "cat": "其他", "rq": true, "quoted": "It's crazy that I can run MiMo 2.6 Flash across my RTX 6000 GPU and my M5 laptop at 40 tokens/sec over 10 GbE 🤯\n\nThese are the native mxfp4 weights of a state-of-the-art model, on heterogeneous hardware.\n\nSupported out of the box in llama.cpp. https://t.co/5ElpeK1Wlt", "media": []}, {"id": "2107861788301607261", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "2026-10-07 23:53", "tu": "2026-10-07T15:53:07.000Z", "text": "The most important thing we can apply AI to is improving medicine and human health - very excited about this partnership with the CZI and the Virtual Biology Initiative! https://t.co/vCDhP4yZWB", "summary": "引用 Isomorphic Labs 作为创始成员加入 Virtual Biology Initiative（VBI）的消息，评论称 AI 最重要的应用是改善医学和人类健康，对与 CZI 和 VBI 的合作感到兴奋。", "url": "https://x.com/demishassabis/status/2107861788301607261", "cat": "行业动态", "rq": true, "quoted": "Today, Isomorphic Labs joins the Virtual Biology Initiative (VBI) as a founding member.\nWe are helping build an open resource for the global research community to accelerate how we understand and treat disease. \nRead more here: https://t.co/3FY3MS4HaR", "media": []}, {"id": "2107856837748081107", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "2026-10-07 23:33", "tu": "2026-10-07T15:33:26.000Z", "text": "RT @GoogleDeepMind: SynthID Detector is now available to everyone. 🌐\n\nCheck whether online content was generated using @GoogleAI, or with t…", "summary": "转发 Google DeepMind：SynthID Detector 向所有人开放，可检测网上内容是否由 Google AI 或合作方（OpenAI、NVIDIA、Kakao，Apple 即将加入）的工具生成。", "url": "https://x.com/demishassabis/status/2107856837748081107", "cat": "产品发布", "rq": true, "quoted": "SynthID Detector is now available to everyone. 🌐\n\nCheck whether online content was generated using @GoogleAI, or with tools from our industry partners – including @OpenAI, @NVIDIA, Kakao and coming soon, @Apple.\n\nTry it out → https://t.co/cPW2aNnqr6 https://t.co/TGYA0uZ0dx", "media": []}, {"id": "2107842520390701212", "handle": "DrJimFan", "name": "Jim Fan", "username": "DrJimFan", "t": "2026-10-07 22:36", "tu": "2026-10-07T14:36:33.000Z", "text": "It is increasingly clear that humanity will solve the Riemann hypothesis before we pass the Physical Turing Test - you come back to a clean home after a wild Sunday party, and you can't tell whether a human or a robot did the job.\n\nWe are not Moravec's paradox-pilled enough.", "summary": "认为人类会先解决黎曼猜想，再通过“物理图灵测试”（如派对后收拾房间，分不清是人还是机器人干的），借此说明大家对莫拉维克悖论的认识还不够深。", "url": "https://x.com/DrJimFan/status/2107842520390701212", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107834254222581862", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-07 22:03", "tu": "2026-10-07T14:03:42.000Z", "text": "SynthID Detector can quickly identify our watermarks in video, audio and images – even after edits, like adding filters. ✂️\n\nYou can also use existing AI identification features found in @GoogleChrome, @Google Search, and the @GeminiApp. https://t.co/VglUeteVIL", "summary": "SynthID Detector 能快速识别视频、音频和图像中的 Google 水印，即使经过加滤镜等编辑也能识别；也可使用 Chrome、Google 搜索和 Gemini App 中已有的 AI 识别功能。", "url": "https://x.com/GoogleDeepMind/status/2107834254222581862", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2107834249680499136", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-07 22:03", "tu": "2026-10-07T14:03:41.000Z", "text": "SynthID Detector is now available to everyone. 🌐\n\nCheck whether online content was generated using @GoogleAI, or with tools from our industry partners – including @OpenAI, @NVIDIA, Kakao and coming soon, @Apple.\n\nTry it out → https://t.co/cPW2aNnqr6 https://t.co/TGYA0uZ0dx", "summary": "Google DeepMind 宣布 SynthID Detector 向所有人开放，可检测内容是否由 Google AI 或合作方（OpenAI、NVIDIA、Kakao，Apple 即将加入）的工具生成。", "url": "https://x.com/GoogleDeepMind/status/2107834249680499136", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2107813002925724112", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-07 20:39", "tu": "2026-10-07T12:39:15.000Z", "text": "RT @matth_lapeyre: Microduck got its new brain!\n\nOur first fully custom SBC in a Pollen robot! It replaces the Radxa + board sandwich from…", "summary": "转发 Matthieu Lapeyre：Pollen 机器人 Microduck 换上首块完全定制的单板计算机，由 Seeed 基于瑞芯微 CPU 打造，替代原型中的 Radxa 组合板，内存、WiFi/蓝牙升级并增加 NFC 等硬件。", "url": "https://x.com/huggingface/status/2107813002925724112", "cat": "产品发布", "rq": true, "quoted": "Microduck got its new brain!\n\nOur first fully custom SBC in a Pollen robot! It replaces the Radxa + board sandwich from the prototype.\n\nBuilt by Seeed around the same Rockchip CPU but including better memory, better WiFi/BT, dual NFC antennas, user-facing status LEDs, an RGB https://t.co/0XMLWP5EmJ", "media": []}, {"id": "2107804973597688159", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-07 20:07", "tu": "2026-10-07T12:07:21.000Z", "text": "RT @random_walker: \"Even “normal” general-purpose technologies are initially volatile and dangerous, even those we come to think of as unal…", "summary": "转发 @random_walker：认同“即使是‘正常’的通用技术在早期也不稳定、有危险”的观点，强调 AI 与以往通用技术的相似性。", "url": "https://x.com/ylecun/status/2107804973597688159", "cat": "技术观点", "rq": true, "quoted": "\"Even “normal” general-purpose technologies are initially volatile and dangerous, even those we come to think of as unalloyed goods.\" https://t.co/eJKDHEpt89\n\nCompletely agree, and appreciate @DKThomp citing us making that very point. Emphasizing AI's similarity to past general", "media": []}, {"id": "2107798738093690967", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-07 19:42", "tu": "2026-10-07T11:42:34.000Z", "text": "RT @SteveRattner: Take A.I. and chip stocks out of the index and the market is down 5.7% since late August.\n\nThe S&amp;P 500 is up 2.4% over th…", "summary": "转发 Steve Rattner：自 8 月底以来，剔除 AI 和芯片股后美股下跌 5.7%，而标普 500 上涨 2.4%、芯片股涨 16%，AI 在独自撑起整个市场。", "url": "https://x.com/ylecun/status/2107798738093690967", "cat": "行业动态", "rq": true, "quoted": "Take A.I. and chip stocks out of the index and the market is down 5.7% since late August.\n\nThe S&amp;P 500 is up 2.4% over the same stretch, chip stocks 16%. A.I. is holding the whole market up. https://t.co/uOmFlrVIsG", "media": []}, {"id": "2107695111698002181", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-07 12:50", "tu": "2026-10-07T04:50:48.000Z", "text": "RT @BasileTerv987: Hierarchical world models, learned end-to-end from pixels!\n\nExcited to introduce H-JEPA: stacked JEPAs, each level in it…", "summary": "转发论文作者：H-JEPA 通过堆叠多层 JEPA、各层有独立嵌入空间并自上而下规划，实现从像素端到端学习的分层世界模型；在 Visual AntMaze 上 3 层结构把成功率从 18% 提升到 73%。", "url": "https://x.com/ylecun/status/2107695111698002181", "cat": "研究成果", "rq": true, "quoted": "Hierarchical world models, learned end-to-end from pixels!\n\nExcited to introduce H-JEPA: stacked JEPAs, each level in its own embedding space, planning top-down.\n\nVisual AntMaze: 3 levels lift success from 18% to 73% 👇\n\nw/ @kevinghstz, Michael Rabbat, @ylecun, @randall_balestr https://t.co/P3xtEOhI1v", "media": []}, {"id": "2107648160604528897", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-07 09:44", "tu": "2026-10-07T01:44:14.000Z", "text": "Context, OpenAI cracked or made important progress in hundreds of big problems today: https://t.co/koJq2pYViH\n\n(And I am seeing rapid increases in the ability of AI to do novel work in my field of economic sociology, with nearly autonomous research getting to top journal level)", "summary": "补充背景：OpenAI 今天在数百个重大问题上取得突破或重要进展；并称在自己的经济社会学领域也看到 AI 做原创研究的能力快速提升，近乎自主的研究已达到顶刊水平。", "url": "https://x.com/emollick/status/2107648160604528897", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107646599635910951", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-07 09:38", "tu": "2026-10-07T01:38:02.000Z", "text": "After a brief but institution-eroding slop science era, it increasingly looks like we are going to have two revolutions from AI:\n1) Everything ever published will be re-read and re-judged in ways that human scientists never anticipated\n2) Novel discoveries will start to come fast", "summary": "认为在短暂而侵蚀学术机构的“垃圾科学”时期之后，AI 将带来两场革命：一是所有已发表成果会被以前所未有的方式重新阅读和评判，二是新发现会快速涌现。", "url": "https://x.com/emollick/status/2107646599635910951", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107640886482104524", "handle": "gdb", "name": "Greg Brockman", "username": "gdb", "t": "2026-10-07 09:15", "tu": "2026-10-07T01:15:20.000Z", "text": "towards acceleration of scientific discovery and improving quality of life for everyone https://t.co/8lU4MEX76e", "summary": "引用 OpenAI 发布内部前沿模型新数学成果的帖子，评论称这是迈向加速科学发现、改善所有人生活质量的一步。", "url": "https://x.com/gdb/status/2107640886482104524", "cat": "研究成果", "rq": true, "quoted": "We’re releasing a broad range of new mathematical results produced by an internal frontier model.\n\nWe’ve been consulting with the independent Advisory Group on Mathematics and Artificial Intelligence at the Institute for Advanced Study, and we have drawn on their advice and", "media": []}, {"id": "2107640072094765566", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-07 09:12", "tu": "2026-10-07T01:12:05.000Z", "text": "RT @matth_lapeyre: Microduck got its new brain!\n\nOur first fully custom SBC in a Pollen robot! It replaces the Radxa + board sandwich from…", "summary": "转发 Matthieu Lapeyre：Pollen 机器人 Microduck 换上首块完全定制的单板计算机，替代原型中的 Radxa 组合板，由 Seeed 基于同款瑞芯微（Rockchip）CPU 打造，内存、WiFi/蓝牙更好，并增加双 NFC 天线和状态指示灯等。", "url": "https://x.com/ClementDelangue/status/2107640072094765566", "cat": "产品发布", "rq": true, "quoted": "Microduck got its new brain!\n\nOur first fully custom SBC in a Pollen robot! It replaces the Radxa + board sandwich from the prototype.\n\nBuilt by Seeed around the same Rockchip CPU but including better memory, better WiFi/BT, dual NFC antennas, user-facing status LEDs, an RGB https://t.co/0XMLWP5EmJ", "media": []}, {"id": "2107635395584536977", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-07 08:53", "tu": "2026-10-07T00:53:30.000Z", "text": "RT @bradwmorris: related to previous tweet\n\none explanation here - if it is the case that Google's size makes certain research difficult (a…", "summary": "转发 bradwmorris：推测如果 Google 的体量让某些研究难以开展（参考近期人才流失和 Demis 的情况），由 Google 作为早期投资方和基础设施提供方扶持独立团队，可能是一种解释。", "url": "https://x.com/swyx/status/2107635395584536977", "cat": "行业动态", "rq": true, "quoted": "related to previous tweet\n\none explanation here - if it is the case that Google's size makes certain research difficult (a reasonable assumption given recent exodus and the demis situation). bootstrapping/blessing independent teams with Google as early investor and infra provider https://t.co/VPcttfFDfc", "media": []}, {"id": "2107626212613034064", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-07 08:17", "tu": "2026-10-07T00:17:01.000Z", "text": "Rephrased: does G \"emerge\" from math + code RLVR? Or do you only get higher math + code skill and nothing else?\n\nMaybe G is a skill and it is isomorphic to math + code problem solving?", "summary": "换个问法追问：通用智能（G）会从数学+代码的可验证奖励强化学习（RLVR）中“涌现”吗？还是只会提升数学和代码能力？又或者 G 本身就等同于数学+代码的解题能力？", "url": "https://x.com/fchollet/status/2107626212613034064", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107625225768858076", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-07 08:13", "tu": "2026-10-07T00:13:06.000Z", "text": "What if the jagged frontier is mainly math + code (which you can push arbitrarily far with RLVR), and everything else starts to plateau because it is still bottlenecked by human generated data? \n\nModel performance in non-verifiable areas has kept improving steadily, albeit much", "summary": "提出设想：AI 的“参差能力前沿”可能主要在数学和代码，因为这两块可以靠可验证奖励强化学习（RLVR）无限推进，而其他领域仍受限于人类生成的数据，可能开始进入平台期。", "url": "https://x.com/fchollet/status/2107625225768858076", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107623610483720463", "handle": "sama", "name": "Sam Altman", "username": "sama", "t": "2026-10-07 08:06", "tu": "2026-10-07T00:06:41.000Z", "text": "We are entering a new era of discovery now:\n\nhttps://t.co/Ng8GquwN3r", "summary": "称“我们正在进入一个新的发现时代”，附链接，未说明具体内容（发布时间与 OpenAI 公布 AI 数学成果同日）。", "url": "https://x.com/sama/status/2107623610483720463", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2107604320384680152", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-07 06:50", "tu": "2026-10-06T22:50:02.000Z", "text": "RT @trq212: we're increasingly going to be moving towards Claude's \"brains\" in the cloud and giving Claude \"local hands\" to operate on your…", "summary": "转发 Thariq（@trq212）：Claude 的发展方向是“大脑”在云端，同时给 Claude 一双“本地的手”来操作用户电脑，并提到他在 Latent Space 播客中谈过这一点。", "url": "https://x.com/swyx/status/2107604320384680152", "cat": "技术观点", "rq": true, "quoted": "we're increasingly going to be moving towards Claude's \"brains\" in the cloud and giving Claude \"local hands\" to operate on your computer\n\nI talked about this a bit on latent space https://t.co/m6NVHyweBp", "media": []}, {"id": "2107596713791767021", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-07 06:19", "tu": "2026-10-06T22:19:48.000Z", "text": "We’re releasing a broad range of new mathematical results produced by an internal frontier model.\n\nWe’ve been consulting with the independent Advisory Group on Mathematics and Artificial Intelligence at the Institute for Advanced Study, and we have drawn on their advice and", "summary": "OpenAI 发布一批由内部前沿模型得出的新数学成果，并表示一直在咨询普林斯顿高等研究院（IAS）独立的数学与人工智能顾问组，并参考了他们的建议。", "url": "https://x.com/OpenAI/status/2107596713791767021", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2107582374347489570", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-07 05:22", "tu": "2026-10-06T21:22:49.000Z", "text": "Just a reminder to the AI Labs that you should confirm that the models you are shipping understand your products &amp; how to use them (&amp; update when you release new features). Nothing weirder than having your AI know everything about how to use your computer except for its own app.", "summary": "提醒各 AI 实验室：要确保发布的模型了解自家产品及用法，并在推出新功能时更新，否则 AI 懂得怎么用你的电脑却唯独不会用自己的应用，非常别扭。", "url": "https://x.com/emollick/status/2107582374347489570", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107550827527463068", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-07 03:17", "tu": "2026-10-06T19:17:28.000Z", "text": "RT @osanseviero: Introducing EmbeddingGemma 2, our new open embeddings model for on-device use cases!\n\n👀 Code, image, video, audio, and tex…", "summary": "转发 Omar Sanseviero：发布面向端侧的开放嵌入模型 EmbeddingGemma 2，支持代码、图像、视频、音频和文本嵌入，模块化覆盖 270M 到 740M 参数，支持 Matryoshka 嵌入，采用 Apache 2 许可。", "url": "https://x.com/ClementDelangue/status/2107550827527463068", "cat": "产品发布", "rq": true, "quoted": "Introducing EmbeddingGemma 2, our new open embeddings model for on-device use cases!\n\n👀 Code, image, video, audio, and text embeddings\n🤏 Modular, going from 270m to 740m parameters\n🪆 Matryoshka embeddings for storage efficiency\n🤗 Apache 2 License https://t.co/bZsnS124Sw", "media": []}, {"id": "2107549520678592712", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-07 03:12", "tu": "2026-10-06T19:12:16.000Z", "text": "And I also think the positive use cases (like the evidence shows current AIs provide good health information &amp; financial advice &amp; lead to startups etc.) are also undermeasured and underdiscussed.\n\nWe do need to worry about many dangers, but its worth building on successes as well", "summary": "认为 AI 的积极用途（如证据显示现有 AI 能提供良好的健康信息和理财建议、催生创业等）同样被低估和讨论不足；在担心各种风险的同时，也应在成功经验上继续建设。", "url": "https://x.com/emollick/status/2107549520678592712", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107546569654636883", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-07 03:00", "tu": "2026-10-06T19:00:33.000Z", "text": "We’re expanding our Cyber Verification Program to give security professionals broader access to our most capable models.\n\nThrough this program, verified security professionals can access Claude Mythos 5.1, Opus 5.5, and Sonnet 5.5 with safeguards designed for defensive work.", "summary": "Anthropic 扩大网络安全验证计划（Cyber Verification Program），通过验证的安全从业者可在面向防御用途的安全措施下使用 Claude Mythos 5.1、Opus 5.5 和 Sonnet 5.5。", "url": "https://x.com/AnthropicAI/status/2107546569654636883", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2107539857040187468", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-07 02:33", "tu": "2026-10-06T18:33:52.000Z", "text": "RT @my_cat_can_code: We’re teaming up with @huggingface for the next round of RSI Arena! 📷\n\nWe gave AI agents GPUs and one job: train bette…", "summary": "转发 my_cat_can_code：与 Hugging Face 合作举办下一轮 RSI Arena——给 AI 代理 GPU，让它们自主选数据、写代码、跑实验来训练更好的模型；第一轮训练已结束，现邀请社区参与。", "url": "https://x.com/huggingface/status/2107539857040187468", "cat": "行业动态", "rq": true, "quoted": "We’re teaming up with @huggingface for the next round of RSI Arena! 📷\n\nWe gave AI agents GPUs and one job: train better models. They chose the data, wrote the code, and ran the experiments on their own.\n\nNow round 1 of training is over, and we're bringing the community into the https://t.co/Qrbbd80O3F", "media": []}, {"id": "2107538278530355437", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "2026-10-07 02:27", "tu": "2026-10-06T18:27:36.000Z", "text": "RT @Google: Meet Nano Banana 2.1, our latest image generation and editing model 🍌\n\nThis upgraded version outperforms our previous models ac…", "summary": "转发 Google：发布最新图像生成与编辑模型 Nano Banana 2.1，全面超越此前模型，在视觉设计、基于蒙版的编辑和主体一致性上有明显提升。", "url": "https://x.com/demishassabis/status/2107538278530355437", "cat": "产品发布", "rq": true, "quoted": "Meet Nano Banana 2.1, our latest image generation and editing model 🍌\n\nThis upgraded version outperforms our previous models across the board, with notable leaps in visual design, mask-based editing, and subject consistency to help you create more natural-looking images. https://t.co/d858DrzrF3", "media": []}, {"id": "2107537101709525107", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-07 02:22", "tu": "2026-10-06T18:22:55.000Z", "text": "RT @perplexitydevs: pplx-decider-v1.1-27b, our updated open weights multimodal decision model, is now available.\n\nIt scores the highest on…", "summary": "转发 Perplexity 开发者：发布开放权重多模态决策模型 pplx-decider-v1.1-27b，在 Hugging Face 新的 Decision Index 0.3 基准上得分最高，成本是 v1 的一半，每百万输入 token 0.02 美元。", "url": "https://x.com/huggingface/status/2107537101709525107", "cat": "产品发布", "rq": true, "quoted": "pplx-decider-v1.1-27b, our updated open weights multimodal decision model, is now available.\n\nIt scores the highest on the new @huggingface Decision Index 0.3 benchmark. pplx-decider-v1.1-27b costs half as much as v1, at $0.02 per million input tokens.\n\nhttps://t.co/S6mjFL7Ws8 https://t.co/Sg6FtHW4cb", "media": []}, {"id": "2107526529727254946", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-07 01:40", "tu": "2026-10-06T17:40:55.000Z", "text": "RT @labenz: Today on AI:AM, @swyx is back. Astra is \"a fully capable AI Engineer\" for $6/hr, so what's left of the job he named? Plus Curso…", "summary": "转发 labenz：AI:AM 节目邀请 swyx，讨论号称每小时 6 美元的“全能 AI 工程师”Astra 出现后 AI 工程师还剩什么、Cursor → SpaceX、智能体实验室能否存活，并预告 AI Engineer 纽约大会（10 月 12–14 日）。", "url": "https://x.com/swyx/status/2107526529727254946", "cat": "行业动态", "rq": true, "quoted": "Today on AI:AM, @swyx is back. Astra is \"a fully capable AI Engineer\" for $6/hr, so what's left of the job he named? Plus Cursor → SpaceX, whether agent labs survive, and a preview of @aidotengineer NYC (Oct 12–14). 10:15a PT with @labenz + @8teAPi\n📺 https://t.co/QYP2jWBUSr", "media": []}, {"id": "2107525319012090301", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-07 01:36", "tu": "2026-10-06T17:36:06.000Z", "text": "Super excited about this and I know weights are coming (https://t.co/svhuNNJHnZ) but just to be fair, you can't be the best open-weight model if you're not open-weight yet! https://t.co/CtvdVUXCN0", "summary": "引用 Mistral Large 4 发布帖（1T 参数、49B 激活，自称美欧最强开放权重模型），表示很期待并知道权重即将发布，但指出权重还没放出就不能自称最好的开放权重模型。", "url": "https://x.com/ClementDelangue/status/2107525319012090301", "cat": "技术观点", "rq": true, "quoted": "Meet Mistral Large 4, aka Le Chonk. \n\n• 1T parameters, natively multimodal. 49B active.\nIt is the best open weights model from US or Europe on aggregated benchmarks.\n• State-of-the-art on critical workloads, including cyber defense, manufacturing and finance and it surpasses https://t.co/Jr5Z11mxEv", "media": []}, {"id": "2107524104786202808", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-07 01:31", "tu": "2026-10-06T17:31:17.000Z", "text": "RT @multimodalart: the jev Decision Index v0.3 is here 🎯\n\nfeaturing a way stronger set of benchmarks, now with a strong private half 🔒 so t…", "summary": "转发 multimodalart：Decision Index v0.3 发布，基准测试集更强，新增私有测试集让排名更能反映真实能力，并加入视觉评测。", "url": "https://x.com/huggingface/status/2107524104786202808", "cat": "研究成果", "rq": true, "quoted": "the jev Decision Index v0.3 is here 🎯\n\nfeaturing a way stronger set of benchmarks, now with a strong private half 🔒 so the ranking tracks skills beyond benchmarks\n\nand, as promised, vision 👁️ \n\nhttps://t.co/Su4OXqJwz0 https://t.co/YaEFjVEgRW", "media": []}, {"id": "2107521440300032204", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-07 01:20", "tu": "2026-10-06T17:20:41.000Z", "text": "RT @mervenoyann: releasing my local AI slide deck\n\ncovers from prefill vs decode, MoE vs dense, VRAM vs unified memory, quantization to spe…", "summary": "转发 Merve Noyan：公开她的本地 AI 讲解幻灯片，涵盖预填充与解码、MoE 与稠密模型、显存与统一内存、量化到投机解码等，全部基于 llama.cpp，注明出处即可复用。", "url": "https://x.com/huggingface/status/2107521440300032204", "cat": "技术观点", "rq": true, "quoted": "releasing my local AI slide deck\n\ncovers from prefill vs decode, MoE vs dense, VRAM vs unified memory, quantization to speculative decoding, everything with llama.cpp \n\nfeel free to reuse with attribution https://t.co/c9II4dFSc9", "media": []}, {"id": "2107512784405533065", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-07 00:46", "tu": "2026-10-06T16:46:18.000Z", "text": "RT @random_walker: An interesting cognitive bias: \n\n\"GLM 5.3 is around as capable as Claude Mythos at cyber-exploitation while also having…", "summary": "转发 @random_walker：指出一种认知偏差——有人认为 GLM 5.3 网络攻击能力接近 Claude Mythos 且防护更弱，所以每多一天没出重大安全事件，就是反对 AI 灾难性网络风险的证据。", "url": "https://x.com/ylecun/status/2107512784405533065", "cat": "技术观点", "rq": true, "quoted": "An interesting cognitive bias: \n\n\"GLM 5.3 is around as capable as Claude Mythos at cyber-exploitation while also having much lower safeguards, meaning that every additional day absent some dire cybersecurity incident is further evidence against catastrophic AI cyber-risk.\" https://t.co/M5r0A4jw8u", "media": []}, {"id": "2107510759731105827", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-07 00:38", "tu": "2026-10-06T16:38:15.000Z", "text": "RT @randall_balestr: Introducing H-JEPA: the first end-to-end learned hierarchical world model for long-horizon visual planning!\nBuilt atop…", "summary": "转发 Randall Balestriero：发布 H-JEPA，称是首个用于长程视觉规划的端到端分层世界模型，基于 SIGReg/LeWM 提供稳定训练方法，各层自然涌现语义抽象，论文和代码已公开。", "url": "https://x.com/ylecun/status/2107510759731105827", "cat": "研究成果", "rq": true, "quoted": "Introducing H-JEPA: the first end-to-end learned hierarchical world model for long-horizon visual planning!\nBuilt atop SIGReg/LeWM, H-JEPA provides a stable training recipe where semantic abstractions naturally emerge across levels... \nPaper+Code: https://t.co/Ozsn6x6W3i 🧵👇 https://t.co/oLXdoSP22N", "media": []}, {"id": "2107502289652982118", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-07 00:04", "tu": "2026-10-06T16:04:36.000Z", "text": "At 740M parameters, it’s competitive across benchmarks – even outperforming some specialist models more than twice its size.\n\nDevelopers can use it to add multimodal search to their apps – like finding moments in a video using a voice memo – or pair it with Gemma 4 for private, https://t.co/qSClXJIdNQ", "summary": "EmbeddingGemma 2 只有 7.4 亿（740M）参数，在各项基准上具竞争力，甚至超过一些两倍以上规模的专用模型；开发者可用它给应用加多模态搜索（如用语音备忘录查找视频片段），或与 Gemma 4 搭配做私密应用。", "url": "https://x.com/GoogleDeepMind/status/2107502289652982118", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2107502286758895878", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-07 00:04", "tu": "2026-10-06T16:04:35.000Z", "text": "Meet EmbeddingGemma 2, our first natively multimodal open model for on-device embeddings.\n\nIt expands beyond text to unify code, images, audio, and video in a shared space. 🧵 https://t.co/DC31z5viWD", "summary": "Google DeepMind 发布 EmbeddingGemma 2，是其首个原生多模态、面向端侧嵌入的开放模型，把代码、图像、音频和视频统一到同一向量空间。", "url": "https://x.com/GoogleDeepMind/status/2107502286758895878", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2107500537411424429", "handle": "rasbt", "name": "Sebastian Raschka", "username": "rasbt", "t": "2026-10-06 23:57", "tu": "2026-10-06T15:57:38.000Z", "text": "Spontaneous morning chat with Juergen Schmidhuber and Jake Newfield philosophizing about AI.\n\nSry my mic somehow disconnected but Juergen had the more interesting points anyways! https://t.co/9elpqAveM0", "summary": "引用对谈预告，分享与 Jürgen Schmidhuber 和 Jake Newfield 即兴探讨 AI 与人类未来的视频，并说自己的麦克风中途断了，但 Schmidhuber 的观点更有意思。", "url": "https://x.com/rasbt/status/2107500537411424429", "cat": "技术观点", "rq": true, "quoted": "Our CEO @Jake_Newfield brought together @SchmidhuberAI  (\"father of AI\" and pioneer of deep learning) and @rasbt (author of Build a Large Language Model), to discuss humanity’s future with AI: https://t.co/KSYzoudYdm https://t.co/WsSHuvBTbT", "media": []}, {"id": "2107489752349892677", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-06 23:14", "tu": "2026-10-06T15:14:46.000Z", "text": "I think most people who have been closely watching AI for the past few years are likely surprised by how relatively rare terrible AI incidents have been, given a billion users overall and hundreds of millions of corporate users. Doesn’t mean that will continue, but surprising.", "summary": "认为长期关注 AI 的人大多会惊讶：在全球约十亿用户、数亿企业用户的规模下，严重 AI 事故相对罕见；这不代表会一直如此，但确实出乎意料。", "url": "https://x.com/emollick/status/2107489752349892677", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107475087075197239", "handle": "mustafasuleyman", "name": "Mustafa Suleyman", "username": "mustafasuleyman", "t": "2026-10-06 22:16", "tu": "2026-10-06T14:16:30.000Z", "text": "https://t.co/nV5QAL9hgu", "summary": "只有一个链接，没有文字说明。", "url": "https://x.com/mustafasuleyman/status/2107475087075197239", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107468457768092149", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-06 21:50", "tu": "2026-10-06T13:50:09.000Z", "text": "Le fat chaton! https://t.co/svhuNNJHnZ https://t.co/nbT0DF8BN7", "summary": "法语“Le fat chaton!”（胖小猫！），配图并附 Hugging Face 模型页链接，为 Mistral 新大模型造势。", "url": "https://x.com/ClementDelangue/status/2107468457768092149", "cat": "产品发布", "rq": false, "quoted": "", "media": ["photo"]}, {"id": "2107463739423490200", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-06 21:31", "tu": "2026-10-06T13:31:24.000Z", "text": "RT @MistralAI: Meet Mistral Large 4, aka Le Chonk. \n\n• 1T parameters, natively multimodal. 49B active.\nIt is the best open weights model fr…", "summary": "转发 Mistral AI：发布 Mistral Large 4（昵称 Le Chonk），1T 参数、原生多模态、49B 激活参数，称在综合基准上是美国或欧洲最强的开放权重模型，并在网络防御、制造和金融等关键场景达到 SOTA。", "url": "https://x.com/ClementDelangue/status/2107463739423490200", "cat": "产品发布", "rq": true, "quoted": "Meet Mistral Large 4, aka Le Chonk. \n\n• 1T parameters, natively multimodal. 49B active.\nIt is the best open weights model from US or Europe on aggregated benchmarks.\n• State-of-the-art on critical workloads, including cyber defense, manufacturing and finance and it surpasses https://t.co/Jr5Z11mxEv", "media": []}, {"id": "2107433480095404103", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-06 19:31", "tu": "2026-10-06T11:31:10.000Z", "text": "RT @ben_burtenshaw: No one (actually) working on open source is surprised by this release. For months, @reflection_ai engineers have been d…", "summary": "转发 Ben Burtenshaw：称真正做开源的人对 Reflection AI 这次发布并不意外，其工程师数月来一直在为 transformers、vLLM、SGLang、TRL、OpenEnv 等项目贡献代码，很高兴看到一个开放实验室出现。", "url": "https://x.com/huggingface/status/2107433480095404103", "cat": "行业动态", "rq": true, "quoted": "No one (actually) working on open source is surprised by this release. For months, @reflection_ai engineers have been down in the trenches contributing to projects like transformers, vLLM, SGLang, TRL, and OpenEnv. Go check the commits.  \n\nI'm super excited to see an open lab https://t.co/n7DcT6UpdE", "media": []}, {"id": "2107432544161464597", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-06 19:27", "tu": "2026-10-06T11:27:27.000Z", "text": "RT @lucataco: You can now run Clef via llama.cpp!\n\nllama serve -hf ggml-org/Clef-GGUF\n\nOllama vs llama.cpp speed test on my M5 Max MBP: htt…", "summary": "转发 lucataco：Clef 现已可通过 llama.cpp 运行（llama serve -hf ggml-org/Clef-GGUF），并附上在 M5 Max MacBook Pro 上 Ollama 与 llama.cpp 的速度对比。", "url": "https://x.com/ClementDelangue/status/2107432544161464597", "cat": "产品发布", "rq": true, "quoted": "You can now run Clef via llama.cpp!\n\nllama serve -hf ggml-org/Clef-GGUF\n\nOllama vs llama.cpp speed test on my M5 Max MBP: https://t.co/sTec3RvOk1 https://t.co/VdsMOu8t5d", "media": []}, {"id": "2107416258639786392", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-06 18:22", "tu": "2026-10-06T10:22:44.000Z", "text": "RT @FlemingCentre: Supported by @GoogleDeepMind , our new 3-year programme will develop the methods and standards needed to evaluate artifi…", "summary": "转发 Fleming Centre：在 Google DeepMind 支持下启动一项 3 年计划，开发评估“AI 用于抗微生物耐药性”的方法和标准，以判断 AI 系统何时准确、可靠、可投入使用。", "url": "https://x.com/GoogleDeepMind/status/2107416258639786392", "cat": "行业动态", "rq": true, "quoted": "Supported by @GoogleDeepMind , our new 3-year programme will develop the methods and standards needed to evaluate artificial intelligence for antimicrobial resistance , so that we can know when an AI system is accurate, reliable and ready to use.\n\nhttps://t.co/DsjKUdFMX0 https://t.co/TN4K1BdZYM", "media": []}, {"id": "2107356794410377510", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-06 14:26", "tu": "2026-10-06T06:26:27.000Z", "text": "When people talk about AI easily replacing workers, I think about this ethnography of copier repair technicians in the 1990s.\n\nYou see how work is complicated and improvised by workers and informal and badly documented.\n\n(But eventually technology did largely eliminate this job) https://t.co/DHGW060pUK", "summary": "谈到“AI 轻松取代工人”时，联想到一项关于 1990 年代复印机维修技术员的民族志研究：实际工作复杂、即兴、非正式且缺乏记录（不过技术最终还是基本淘汰了这一职业）。", "url": "https://x.com/emollick/status/2107356794410377510", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107339711106924590", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-06 13:18", "tu": "2026-10-06T05:18:34.000Z", "text": "RT @nicknisi: My @aiDotEngineer workshop is up: \"Lifestyles of the AI-Native\" with @zackproser 🎥\n\nVoice coding across agent sessions, goals…", "summary": "转发 Nick Nisi：他与 Zack Proser 在 AI Engineer 大会的工作坊“Lifestyles of the AI-Native”视频已上线，内容涵盖跨智能体会话语音编程、目标与循环、worktree、测试关卡、对抗式审查和定时智能体等。", "url": "https://x.com/swyx/status/2107339711106924590", "cat": "其他", "rq": true, "quoted": "My @aiDotEngineer workshop is up: \"Lifestyles of the AI-Native\" with @zackproser 🎥\n\nVoice coding across agent sessions, goals + loops, worktrees, test gates, adversarial review, scheduled agents.\n\nhttps://t.co/fxY17hxBDl", "media": []}, {"id": "2107286396222296209", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-06 09:46", "tu": "2026-10-06T01:46:43.000Z", "text": "RT @rohanpaul_ai: Yann LeCun's latest talk at ETH Zürich\n\n\"You should not work on LLM. At least if you're in academia, you should absolutel…", "summary": "转发 LeCun 在苏黎世联邦理工（ETH Zürich）演讲摘录：他建议学术界不要研究 LLM，认为学界在这方面贡献不了什么，想在 AI 上取得真正进展应转向扎根现实世界的 AI。", "url": "https://x.com/ylecun/status/2107286396222296209", "cat": "技术观点", "rq": true, "quoted": "Yann LeCun's latest talk at ETH Zürich\n\n\"You should not work on LLM. At least if you're in academia, you should absolutely not work on LLMs. There is nothing you can bring to the table.\n\nIf you're interested in making real progress in AI, in sort of grounded AI for the real https://t.co/fGjsi1leL9", "media": []}, {"id": "2107281172342427734", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-06 09:25", "tu": "2026-10-06T01:25:57.000Z", "text": "Subtle problem with AI-written academic papers is that AI isn't calibrated for feedback. AI often just folds, but if you are sending a paper for review, challenges from peer reviewers should result in some attempt to defend your idea (while still giving up on it if really wrong)", "summary": "指出 AI 撰写学术论文的一个隐蔽问题：AI 对反馈缺乏校准，常常直接让步；而投稿时面对审稿人质疑，应尝试为自己的观点辩护，确实错了再放弃。", "url": "https://x.com/emollick/status/2107281172342427734", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107248012208791839", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-06 07:14", "tu": "2026-10-05T23:14:11.000Z", "text": "Over the past weeks I switched a lot of my Cowork complex work to new Claude Projects (confusingly, it is not the same as the old Projects in Claude, instead, it persistently chats with a dedicated cloud VM). I found it to be much better in most ways, but not clearly documented. https://t.co/UnXeKpyNUt", "summary": "引用 Cowork 团队成员对 Gergely Orosz 的回复，说自己最近把很多复杂工作从 Cowork 转到新版 Claude Projects（与旧版不同，它会持续连接一台专用云端虚拟机），多数方面更好用，但缺乏清晰文档。", "url": "https://x.com/emollick/status/2107248012208791839", "cat": "技术观点", "rq": true, "quoted": "@GergelyOrosz Hi! I work on Cowork. Probably no surprise, but we want to make our users as powerful as possible with Claude - and you're right that explaining and keeping up with the capabilities is hard. Affected users got both an email and an in-app notice, but I'm grateful for the feedback", "media": []}, {"id": "2107229550564556906", "handle": "mustafasuleyman", "name": "Mustafa Suleyman", "username": "mustafasuleyman", "t": "2026-10-06 06:00", "tu": "2026-10-05T22:00:49.000Z", "text": "RT @WalterIsaacson: I have some fascinating questions for @mustafasuleyman — including how he’s leading the way in reminding us that we sho…", "summary": "转发 Walter Isaacson：预告 10 月 12 日将与 Mustafa Suleyman 对谈，话题包括他如何带头提醒人们不应把 AI 模型当作有意识的人类，欢迎观众提问。", "url": "https://x.com/mustafasuleyman/status/2107229550564556906", "cat": "行业动态", "rq": true, "quoted": "I have some fascinating questions for @mustafasuleyman — including how he’s leading the way in reminding us that we should not treat AI models as conscious humans.  Please join us and ask questions on Oct 12. https://t.co/8WbfZqd5Eb", "media": []}, {"id": "2107227739048513628", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-06 05:53", "tu": "2026-10-05T21:53:38.000Z", "text": "So much reporting on the Claude or OpenAI usage of the same handful of technology companies with competing products &amp; huge cloud infrastructure of their own.\n\nThere are many, many more firms out there that are not direct competitors &amp; whose use trends would be more informative. https://t.co/CgZfanfhDW", "summary": "引用“微软和 Meta 在 Anthropic IPO 前大幅削减员工使用 Claude”的爆料，评论称报道总盯着少数几家有竞品和自有云的科技公司的 Claude/OpenAI 用量，非直接竞争企业的使用趋势会更有参考价值。", "url": "https://x.com/emollick/status/2107227739048513628", "cat": "行业动态", "rq": true, "quoted": "🚨BREAKING: Microsoft and META are aggressively cutting employee use of Claude ahead of Anthropic's IPO\n\nMicrosoft has cut internal claude spend by more than 33%, nuked per-employee token budget from $100k/month to $10k/month, and forced Copilot to auto-route to cheaper models https://t.co/seECuhObKL", "media": []}, {"id": "2107204071400808659", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-06 04:19", "tu": "2026-10-05T20:19:35.000Z", "text": "RT @ggerganov: The new v0.6.0 release packs a lot of good stuff:\n\n- Clef support (text + vision)\n- High-quality support for Qwen3.8-Flash-N…", "summary": "转发 Georgi Gerganov：llama.cpp 发布 v0.6.0，新增 Clef 支持（文本+视觉）、高质量支持 Qwen3.8-Flash-Next、Metal 性能大幅提升、新增 llama_batch_ext API，官网也已更新。", "url": "https://x.com/ClementDelangue/status/2107204071400808659", "cat": "产品发布", "rq": true, "quoted": "The new v0.6.0 release packs a lot of good stuff:\n\n- Clef support (text + vision)\n- High-quality support for Qwen3.8-Flash-Next\n- Massive performance improvement with Metal\n- New `llama_batch_ext` API\n\nAlso the website got a nice refresh: https://t.co/9akc1jmG9t https://t.co/F6nk5gzzDV", "media": []}, {"id": "2107194915130356213", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-06 03:43", "tu": "2026-10-05T19:43:12.000Z", "text": "Let's go https://t.co/LXil50Sr25! https://t.co/XIonqvZWoC https://t.co/WiOhtAUKLj", "summary": "引用 Beam 发布帖并说“Let's go”：Beam 是高效的智能体开放模型，总参数 501B、激活 23B，从零端到端训练，推进西方开放模型在编程和智能体任务上的前沿，完整权重本月发布。", "url": "https://x.com/ClementDelangue/status/2107194915130356213", "cat": "产品发布", "rq": true, "quoted": "Introducing Beam: a highly efficient agentic open model with 501B total parameters and 23B active.\n\n- Frontier reasoning efficiency\n- Advances the Western open frontier on coding &amp; agentic tasks\n- Trained end-to-end from scratch\n\nFull weights release this month.\n\nLearn more about https://t.co/1rMABCywUG", "media": []}, {"id": "2107179925551682010", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-06 02:43", "tu": "2026-10-05T18:43:38.000Z", "text": "RT @CommandCodeAI: Introducing Agr, an open decision model by Command Code.\n\n· Agr (31B) and Agr-flash (360M)\n· 58.15 on Decision Index 0.2…", "summary": "转发 Command Code：发布开放决策模型 Agr，含 Agr（31B）和 Agr-flash（360M），在 Decision Index 0.2.1 上得分 58.15，专注工具调用和路由，称在编程智能体工具调用与路由上同类最佳，已上线 Hugging Face。", "url": "https://x.com/ClementDelangue/status/2107179925551682010", "cat": "产品发布", "rq": true, "quoted": "Introducing Agr, an open decision model by Command Code.\n\n· Agr (31B) and Agr-flash (360M)\n· 58.15 on Decision Index 0.2.1\n· Focus on: tool calls &amp; routing\n· TypeSafe SDK support\n\nAgr is best-in-class on coding agent tool calls and routing. Live on Hugging Face.\n\nSend state as https://t.co/KQxzIHQ7Cb", "media": []}, {"id": "2107164653147340988", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-06 01:42", "tu": "2026-10-05T17:42:57.000Z", "text": "Watermarks have limits. They’re often undetectable, especially in short passages. Rewriting or translating text can completely remove the watermark.\n\nThat’s why, for now, only approved researchers will have access to our detector, so they can help us evaluate and improve the", "summary": "OpenAI 承认水印有局限：短文本中常难以检测，改写或翻译可完全去除水印；因此目前检测器只向经批准的研究人员开放，以帮助评估和改进。", "url": "https://x.com/OpenAI/status/2107164653147340988", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2107164651478012412", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-06 01:42", "tu": "2026-10-05T17:42:56.000Z", "text": "When possible, we want to give people a choice—and be clear about what watermarking can and can’t do.\n\nA text watermark helps answer one question: “Was this likely generated by an OpenAI model?”\n\nIt works by embedding an invisible statistical signal in text as it’s generated. A", "summary": "OpenAI 解释文本水印：希望尽可能给用户选择权并说清水印的能力边界；水印只回答“这段文字是否可能由 OpenAI 模型生成”，原理是在生成时嵌入不可见的统计信号。", "url": "https://x.com/OpenAI/status/2107164651478012412", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2107164650249101695", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-06 01:42", "tu": "2026-10-05T17:42:56.000Z", "text": "We're expanding our approach to content provenance to include text in response to EU regulatory requirements, while recognizing the significant limitations of current text watermarking technology.\n\nOur tools already help verify whether an image or audio file was created with our", "summary": "为响应欧盟监管要求，OpenAI 将内容溯源扩展到文本，同时承认当前文本水印技术存在明显局限；其工具此前已能帮助验证图像或音频是否由 OpenAI 生成。", "url": "https://x.com/OpenAI/status/2107164650249101695", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2107135859371983319", "handle": "jackclarkSF", "name": "Jack Clark", "username": "jackclarkSF", "t": "2026-10-05 23:48", "tu": "2026-10-05T15:48:32.000Z", "text": "The single most useful take I heard at The Curve was \"we can still heist the Mona Lisa after the singularity\". There's a subtle/important point here, where some things (e.g, n of 1 goods where originally is valuable) will retain/grow in value even as everything changes.", "summary": "分享在 The Curve 会议上听到的最有用观点：“奇点之后我们仍能偷走蒙娜丽莎”，意思是独一无二、原创性本身有价值的东西，即使一切巨变也会保值甚至升值。", "url": "https://x.com/jackclarkSF/status/2107135859371983319", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107130352095674401", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-05 23:26", "tu": "2026-10-05T15:26:39.000Z", "text": "RT @ben_burtenshaw: RL environments now have a home on the @huggingface  Hub.\n\nEvery RL framework has its own way to find environments. Cus…", "summary": "转发 Ben Burtenshaw：强化学习环境现在可以统一托管在 Hugging Face Hub 上，解决各 RL 框架环境格式互不兼容、发布给一个框架其他框架就无法加载的问题。", "url": "https://x.com/ClementDelangue/status/2107130352095674401", "cat": "产品发布", "rq": true, "quoted": "RL environments now have a home on the @huggingface  Hub.\n\nEvery RL framework has its own way to find environments. Custom hubs, runtime registries, GitHub lists with a custom loader. If you publish for one framework, users of the others can’t load it.\n\nWe think that is wrong. https://t.co/i1as5kBIEs", "media": []}, {"id": "2107031179258155272", "handle": "hardmaru", "name": "hardmaru", "username": "hardmaru", "t": "2026-10-05 16:52", "tu": "2026-10-05T08:52:34.000Z", "text": "RT @SakanaAILabs: 【受付開始】From World Models to Real-World AI — 日本から拓くAIの新時代\n\nChief Scientific Advisorとして当社に参画したJürgen Schmidhuber博士を迎えるシンポジウム…", "summary": "转发 Sakana AI：10 月 26 日将在东京一桥讲堂举办研讨会“From World Models to Real-World AI”，欢迎新加入担任首席科学顾问的 Jürgen Schmidhuber，含其主题演讲和问答，即日起开放报名。", "url": "https://x.com/hardmaru/status/2107031179258155272", "cat": "行业动态", "rq": true, "quoted": "【受付開始】From World Models to Real-World AI — 日本から拓くAIの新時代\n\nChief Scientific Advisorとして当社に参画したJürgen Schmidhuber博士を迎えるシンポジウムを、10月26日（月）に東京・一橋講堂で開催します。本日より一般申し込みを開始しました。Schmidhuber博士による基調講演とQ&amp;A、 https://t.co/Jprj46fU1x", "media": []}, {"id": "2106941133808959768", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-05 10:54", "tu": "2026-10-05T02:54:46.000Z", "text": "RT @StanDehaene: Indeed. And the « neo-vitalists » who affirm that consciousness requires biological hardware and will always remain beyond…", "summary": "转发 Stanislas Dehaene：认为主张意识必须依赖生物硬件、AI 永远无法拥有意识的“新活力论者”同样是错误的。", "url": "https://x.com/ylecun/status/2106941133808959768", "cat": "技术观点", "rq": true, "quoted": "Indeed. And the « neo-vitalists » who affirm that consciousness requires biological hardware and will always remain beyond AI’s reach are equally misguided, in my opinion. https://t.co/AYnqHO8RBU", "media": []}, {"id": "2106907968205980102", "handle": "soumithchintala", "name": "Soumith Chintala", "username": "soumithchintala", "t": "2026-10-05 08:42", "tu": "2026-10-05T00:42:58.000Z", "text": "RT @cHHillee: There's an interesting distortion in inference pricing that appears to be driven by openrouter's routing. \n\nNamely, ridiculou…", "summary": "转发 Horace He：指出 OpenRouter 路由机制可能导致推理定价扭曲——预填充极便宜、解码极贵；例如 GLM 5.3 的最大供应商输入每百万 token 收 0.08 美元，输出却收 5 美元。", "url": "https://x.com/soumithchintala/status/2106907968205980102", "cat": "技术观点", "rq": true, "quoted": "There's an interesting distortion in inference pricing that appears to be driven by openrouter's routing. \n\nNamely, ridiculously cheap prefill and very expensive decode. For GLM 5.3, https://t.co/aLgdvVsDHp (highest volume provider) charges $0.08/M input but $5.00/M output!(1/5) https://t.co/Q0KqRNAIHj https://t.co/bzrZjbx4Kq", "media": []}], "generated": "2026-10-08 14:30", "categories": ["产品发布", "研究成果", "技术观点", "行业动态", "融资与商业", "其他"]};
let fAcct = "__all__", fCat = "全部", fQ = "";
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function accounts(){
  const m = {};
  DATA.posts.forEach(p=>{ const k=p.name||p.handle; (m[k]=m[k]||{name:k,u:p.username,c:0}).c++; });
  return Object.values(m).sort((a,b)=>b.c-a.c);
}
function renderSide(){
  const a = accounts();
  let h = `<div class="acct ${fAcct==='__all__'?'active':''}" data-a="__all__"><span>全部</span><span class="n">${DATA.posts.length}</span></div>`;
  h += `<h3>人物 / 公司</h3>`;
  a.forEach(x=>{ h += `<div class="acct ${fAcct===x.name?'active':''}" data-a="${esc(x.name)}"><span>${esc(x.name)} <span class="uh" style="color:var(--mut)">@${esc(x.u)}</span></span><span class="n">${x.c}</span></div>`; });
  document.getElementById('side').innerHTML = h;
  document.querySelectorAll('.acct').forEach(el=>el.onclick=()=>{fAcct=el.dataset.a;render();});
}
function renderCats(){
  const cats = ["全部"].concat(DATA.categories);
  document.getElementById('cats').innerHTML = cats.map(c=>`<span class="chip ${fCat===c?'active':''}" data-c="${c}">${c}</span>`).join('');
  document.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{fCat=el.dataset.c;render();});
}
function match(p){
  if(fAcct!=="__all__" && (p.name||p.handle)!==fAcct) return false;
  if(fCat!=="全部" && p.cat!==fCat) return false;
  if(fQ){ const s=(p.summary+" "+p.text+" "+p.quoted+" "+p.name+" "+p.username).toLowerCase(); if(!s.includes(fQ.toLowerCase())) return false; }
  return true;
}
function render(){
  renderSide(); renderCats();
  const posts = DATA.posts.filter(match);
  document.getElementById('count').textContent = `共 ${posts.length} 条`;
  if(!posts.length){ document.getElementById('list').innerHTML = `<div class="empty">没有符合条件的内容</div>`; return; }
  document.getElementById('list').innerHTML = posts.map(p=>`
    <div class="card">
      <div class="top">
        <span class="name">${esc(p.name)}</span>
        <span class="uh">@${esc(p.username)}</span>
        <span class="tag">${esc(p.cat)}</span>
        ${p.rq?'<span class="tag rq">转发/引用</span>':''}
        <span class="time">${esc(p.t)}</span>
      </div>
      ${p.summary?`<div class="summary">${esc(p.summary)}</div>`:''}
      <details class="orig"${p.summary?'':' open'}><summary>原文</summary><div class="text">${esc(p.text)}</div>${p.quoted?`<div class="quoted">${esc(p.quoted)}</div>`:''}</details>
      <div class="foot">
        ${p.url?`<a class="open" href="${esc(p.url)}" target="_blank" rel="noopener">在 X 查看原帖 ↗</a>`:''}
        ${(p.media&&p.media.length)?`<span class="media">含媒体: ${esc(p.media.join(', '))}</span>`:''}
      </div>
    </div>`).join('');
}
document.getElementById('meta').textContent = `更新于 ${DATA.generated}（北京时间） · 共 ${DATA.posts.length} 条动态`;
document.getElementById('q').addEventListener('input', e=>{fQ=e.target.value;render();});
render();
</script>
