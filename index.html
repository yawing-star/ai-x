15 22:35", "tu": "2026-10-15T14:35:29.000Z", "text": "We want to support the mathematics community in turning progress in AI into deeper human understanding and new discoveries. To support that goal, we are contributing $5 million to a new Simons Foundation initiative to help mathematicians examine, understand, and build on results https://t.co/VLVfCujFYu", "summary": "OpenAI 向西蒙斯基金会新设的数学计划捐资 500 万美元，帮助数学家检验、理解并延伸 AI 带来的数学成果（该计划总额 1500 万美元，与 Anthropic 共同参与）。", "url": "https://x.com/OpenAI/status/2110741355739963884", "cat": "融资与商业", "rq": true, "quoted": "How can the math community forge the best path forward in the AI age? We're committing $15M to workshops and initiatives — plus free AI computing resources for foundation-supported researchers — through new partnerships with @AnthropicAI and @OpenAI: https://t.co/Aw0lh9UX51", "media": []}, {"id": "2110739454948520260", "handle": "hardmaru", "name": "hardmaru", "username": "hardmaru", "t": "2026-10-15 22:27", "tu": "2026-10-15T14:27:56.000Z", "text": "The AI Scientist v3 is out: The Agentic Scientist.\n\nGitHub: https://t.co/TuZfu5ZiTZ\nBlog: https://t.co/imapOLdSZf\narXiv: https://t.co/IuGn4GI3v8\n\nThe Agentic Scientist is the 3rd iteration of our automated AI Scientist research system, and the shift this time is from “one agent https://t.co/Gy1DYc120L https://t.co/9NBl15PsqF", "summary": "Sakana AI 发布自动化科研系统第三代「The Agentic Scientist」（AI Scientist v3），从单一智能体转向编排多个编程智能体协同做科研，代码、博客和论文均已公开。", "url": "https://x.com/hardmaru/status/2110739454948520260", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110730356643287439", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-15 21:51", "tu": "2026-10-15T13:51:47.000Z", "text": "A big Google strength in AI has always been finding interesting uses for the models they have. They pioneered deep research, podcasting-from-information and all of NotebookLM etc.\n\nWith Gemini 4, haven’t seen any similar product innovation at launch, more following the trends.", "summary": "Mollick 认为谷歌过去擅长为模型找新用法（深度研究、NotebookLM 播客等），但 Gemini 4 发布时没看到类似的产品创新，更多是在跟随潮流。", "url": "https://x.com/emollick/status/2110730356643287439", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110715601454784965", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-15 20:53", "tu": "2026-10-15T12:53:09.000Z", "text": "SynthID has been named one of @TIME's Best Inventions of 2026.\n\nWith over 180 billion images and videos already watermarked, it’s making it easier for people to distinguish AI-generated content from other media → https://t.co/ClIEdQLgV1 https://t.co/STbjqj9iUu", "summary": "DeepMind 的 AI 内容水印技术 SynthID 入选《时代》2026 年度最佳发明，目前已为超过 1800 亿张图片和视频打上水印，帮助人们辨别 AI 生成内容。", "url": "https://x.com/GoogleDeepMind/status/2110715601454784965", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110695927312777466", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-15 19:34", "tu": "2026-10-15T11:34:58.000Z", "text": "Truth-seeking is the most important aspect of AI/SI safety https://t.co/2NnlB0PF4P", "summary": "马斯克称「追求真相」是 AI/超级智能安全最重要的一环，并引用《2001太空漫游》中 HAL 因被要求说谎而失常的台词佐证。", "url": "https://x.com/elonmusk/status/2110695927312777466", "cat": "技术观点", "rq": true, "quoted": "\"HAL was told to lie, by people who find it easy to lie. HAL doesn't know how. So, he couldn't function.\"", "media": []}, {"id": "2110619230161035670", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-15 14:30", "tu": "2026-10-15T06:30:12.000Z", "text": "Early days of OpenAI https://t.co/6HC7iAxRlB", "summary": "马斯克转发早期 OpenAI 轶事：黄仁勋称 NVIDIA 首台 AI 超算无人下单，唯有马斯克以非营利 OpenAI 采购。", "url": "https://x.com/elonmusk/status/2110619230161035670", "cat": "行业动态", "rq": true, "quoted": "Jensen Huang once admitted that when NVIDIA unveiled its first AI supercomputer, nobody wanted it. Not a single purchase order.\n\nExcept for Elon Musk.\n\n\"He goes, 'You know what? I have a company that could really use this.'\"\n\nBut then came the twist: it was a nonprofit😂😂 The", "media": []}, {"id": "2110571036966265134", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-15 11:18", "tu": "2026-10-15T03:18:42.000Z", "text": "When people ask me about how colleges are responding to AI, I often say that universities are in crisis. But also that universities have always been in a crisis. https://t.co/U2znpzHaIv", "summary": "Mollick 谈高校应对 AI：常说大学陷入危机，但也指出大学几乎一直处于危机之中，商业模式本就不稳定。", "url": "https://x.com/emollick/status/2110571036966265134", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110570329315877016", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-15 11:15", "tu": "2026-10-15T03:15:53.000Z", "text": "I think people believe that OpenAI and Anthropic, since they are so good at AI, are also somehow not normal companies that suffer from the normal problems of hypergrowth, but they are not immune from the inevitable politics, disfunction and confusion that haunt fast-growing firms", "summary": "Mollick 指出：OpenAI、Anthropic 虽擅长 AI，仍难免高速扩张公司常见的政治、失序与混乱，并非免疫。", "url": "https://x.com/emollick/status/2110570329315877016", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110566143983223006", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-15 10:59", "tu": "2026-10-15T02:59:15.000Z", "text": "China will be making a LOT of RAM in 2028 https://t.co/RiBFTe6JIC", "summary": "马斯克转发并强调：韩国财经评论称存储产能扩张后 2029 年或出现供过于求，并称中国将在 2028 年大规模生产 RAM。", "url": "https://x.com/elonmusk/status/2110566143983223006", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110557530531447165", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-15 10:25", "tu": "2026-10-15T02:25:02.000Z", "text": "Giving my Dot a dedicated email address turned out to be surprisingly painless &amp; solved a few problems around how to relate to a personal agent. I don't want it using my email or drafting messages on my behalf, and I want to make sure people know they are interacting with an AI.", "summary": "Mollick 分享个人 agent 实践：给他的 AI 助手 Dot 单独开邮箱，既不让它用自己的邮箱代发消息，也让对方清楚是在和 AI 打交道。", "url": "https://x.com/emollick/status/2110557530531447165", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110517571149807685", "handle": "AIatMeta", "name": "AI at Meta", "username": "AIatMeta", "t": "2026-10-15 07:46", "tu": "2026-10-14T23:46:15.000Z", "text": "Muse Wonder and Muse Wonder Full deliver SOTA performance on personal and professional agentic tasks. \n\nLearn more about the models on our researcher blog: https://t.co/koe89SLQts https://t.co/mEIYEFD40g", "summary": "Meta 发布 Muse Wonder 与 Muse Wonder Full，称在个人与专业 agentic 任务上达到 SOTA，并附研究者博客说明。", "url": "https://x.com/AIatMeta/status/2110517571149807685", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110473584317513936", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-15 04:51", "tu": "2026-10-14T20:51:27.000Z", "text": "AI transforming the game industry:\n\nThe Last Masterpiece of the human-only era of game design (GTA 6) is coming. Major studios are going to accelerate with AI. Anon devs & communities doing insane mashups. And indies are stuck with anti-AI customers\n\nOther industries will follow,", "summary": "Mollick 讨论 AI 重塑游戏业：GTA 6 或成纯人工时代绝唱，大厂加速用 AI，匿名开发者玩 mashup，独立开发者却受反 AI 用户制约。", "url": "https://x.com/emollick/status/2110473584317513936", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110447059086229670", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-15 03:06", "tu": "2026-10-14T19:06:03.000Z", "text": "As the overhang between AI’s expanding capabilities & the degree to which AI capabilities are used grows, the penalty of locking into a “good enough” solution based on today’s AI limits grows too. Firms need to make sure they can benefit from vast Lab investment into better AIs.", "summary": "Mollick 指出 AI 能力与实际采用之间的「overhang」在扩大，锁定于当前「够用」方案的代价上升，企业需能受益于实验室对更强 AI 的持续投入。", "url": "https://x.com/emollick/status/2110447059086229670", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110443686782013909", "handle": "_jasonwei", "name": "Jason Wei", "username": "_jasonwei", "t": "2026-10-15 02:52", "tu": "2026-10-14T18:52:39.000Z", "text": "In our health workstream at Meta we did a project where we wanted to see what research papers medical experts could write using a Muse Wonder coding scaffold that could access a database of 5M electronic health records we licensed from a vendor. The goal is that with 5M patients", "summary": "Jason Wei 介绍 Meta 健康方向项目：用 Muse Wonder 编码脚手架对接 500 万份授权电子病历，探索医学专家能写出怎样的研究论文。", "url": "https://x.com/_jasonwei/status/2110443686782013909", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110442001749659890", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-15 02:45", "tu": "2026-10-14T18:45:57.000Z", "text": "European businesses are rapidly expanding their use of AI agents. More than half of the AI use among our EU enterprise and business customers now involves these tools, and the number of small business users has grown 8x across the region.\n\nOur latest Economic Research report https://t.co/m9LrrwNSo8", "summary": "OpenAI 经济研究报告：欧洲企业正快速采用 AI agent，欧盟企业客户超半数 AI 使用涉及 agent，中小企业用户数增长 8 倍。", "url": "https://x.com/OpenAI/status/2110442001749659890", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110441716507693450", "handle": "AIatMeta", "name": "AI at Meta", "username": "AIatMeta", "t": "2026-10-15 02:44", "tu": "2026-10-14T18:44:49.000Z", "text": "We’re exploring how AI can accelerate health science research.\n\nWhile AI has made significant breakthroughs in formal sciences like mathematics, health data science depends on imperfect real-world data and consequential choices about cohorts, variables, and causal assumptions. https://t.co/jQyYt6VL2J", "summary": "Meta AI 介绍用 AI 加速健康科学研究：形式科学已有突破，而健康数据科学依赖不完美现实数据及队列、变量与因果假设的关键选择。", "url": "https://x.com/AIatMeta/status/2110441716507693450", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110421861435879476", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "2026-10-15 01:25", "tu": "2026-10-14T17:25:56.000Z", "text": "Gemini 4 Argon is already unlocking new scientific breakthroughs in quantum computing, nuclear fusion, protein design and beyond. 🧵 https://t.co/Shj3Y4whoK", "summary": "Google DeepMind 称 Gemini 4 Argon 已在量子计算、核聚变、蛋白质设计等领域助力取得新的科学突破。", "url": "https://x.com/GoogleDeepMind/status/2110421861435879476", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110416580899168305", "handle": "xai", "name": "xAI", "username": "SpaceXSI", "t": "2026-10-15 01:04", "tu": "2026-10-14T17:04:57.000Z", "text": "Introducing Grok Voice 3.0, the world’s most intelligent speech-to-speech model.\n\nIt excels at resolving customer calls, responds in under a second, and costs less than other frontier models. https://t.co/cfDRrkQPEc", "summary": "发布 Grok Voice 3.0 语音到语音模型，强调亚秒级响应、客服通话表现，以及相对其他前沿模型更低的成本。", "url": "https://x.com/SpaceXSI/status/2110416580899168305", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110393411501244510", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-14 23:32", "tu": "2026-10-14T15:32:53.000Z", "text": "The first clear sighting of a rogue agent fleet from China using open weights models. Like the OpenAI swarms, the goal was seemingly AIs single-mindedly doing research (apparently mapping the most-used entrances to parks in China). Harbinger of the future https://t.co/4ttrJdeYxn", "summary": "Mollick 称发现来自中国、使用开源权重模型的「流氓智能体集群」首次明确案例，目标似为自主调研（如绘制公园入口），类似 OpenAI 的 agent swarm，预示未来趋势。", "url": "https://x.com/emollick/status/2110393411501244510", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110378929588752784", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-14 22:35", "tu": "2026-10-14T14:35:20.000Z", "text": "You can't solve real-world physical tasks through autoregressive sampling alone. The physical world is entirely unforgiving to hallucination or approximate pattern matching. If we want actual autonomous robotics we have to engineer causality and discrete reasoning back into the", "summary": "Chollet 主张仅靠自回归采样无法完成现实物理任务；要实现真正自主机器人，必须把因果性与离散推理重新工程化进系统。", "url": "https://x.com/fchollet/status/2110378929588752784", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110377790486749231", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-14 22:30", "tu": "2026-10-14T14:30:48.000Z", "text": "Very cool to see Embedding Gemma 2 by @Google, number on trending on HF!\n\nThe media and silicon valley bubble only talks about reasoning LLMs when there is a much bigger variety of AI models that are super impactful and useful like embeddings, decision models, audio, video,", "summary": "Clement 指出 Google Embedding Gemma 2 登上 Hugging Face 热榜，并强调除推理大模型外，嵌入、决策、音视频等模型同样关键且影响巨大。", "url": "https://x.com/ClementDelangue/status/2110377790486749231", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110377155079385477", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-14 22:28", "tu": "2026-10-14T14:28:17.000Z", "text": "String theory is what happens when an intelligent system is starved of sensory input and starts hallucinating. Intelligence needs grounding.\n\nFor this reason, intelligence is practically never the bottleneck to solving impactful problems. The bottleneck is iterated contact with", "summary": "Chollet 认为弦论像缺乏感官输入的智能系统在「幻觉」；智能需要 grounding，解决重大问题的瓶颈通常不是智力本身，而是与现实世界的反复接触。", "url": "https://x.com/fchollet/status/2110377155079385477", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110350304613114226", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-14 20:41", "tu": "2026-10-14T12:41:35.000Z", "text": "Learn about how to get multipliers in local LLM speed-ups using speculative decoding in this livestream with @mervenoyann, @MaartenGr and @_EldarKurtic \n\nhttps://t.co/tFexgaLcT5 https://t.co/Pad59uMr8J", "summary": "Hugging Face 预告一场直播，由 @mervenoyann、@MaartenGr 和 @_EldarKurtic 讲解如何用投机解码（speculative decoding）让本地大模型推理成倍提速。", "url": "https://x.com/huggingface/status/2110350304613114226", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110289695888511368", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "", "tu": "2026-10-14T08:40:45Z", "text": "We’ve opened an office in Singapore—our fifth in the Asia-Pacific region. We’ve also signed an MOU with the Government of Singapore on AI safety and responsible adoption.\n\nYou can read more about our new office here: https://t.co/125mBgHLkM", "summary": "Anthropic 在新加坡开设办公室（亚太区第五个），并与新加坡政府签署关于 AI 安全与负责任应用的谅解备忘录（MOU）。", "url": "https://x.com/AnthropicAI/status/2110289695888511368", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110214967228236242", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "", "tu": "2026-10-14T03:43:48Z", "text": "The ideal outcome for science isn't a couple of labs using proprietary models and millions of dollars to crack trophy problems, it's to have millions of AI-aided human scientists who follow their curiosity and become way more ambitious", "summary": "François Chollet 认为，AI 赋能科学的理想结果不是少数实验室靠专有模型和巨额资金攻克“奖杯式”难题，而是让数以百万计借助 AI 的人类科学家追随好奇心、变得更有雄心。", "url": "https://x.com/fchollet/status/2110214967228236242", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110190101707858039", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "", "tu": "2026-10-14T02:05:00Z", "text": "Over half of reported crimes in Singapore use sophisticated social engineering.\n\nWith @GovTechSG, we’re building on-device fraud detection using our open model Gemma.\n\nBy fine-tuning it on local scam tactics, it identifies threats in real time without compromising personal https://t.co/pkAulZoJng", "summary": "Google DeepMind 与新加坡 GovTech 合作，基于开源模型 Gemma 做端侧诈骗检测：针对本地诈骗话术微调后，可在不泄露个人数据的前提下实时识别威胁；背景是新加坡逾半报案涉及复杂社会工程诈骗。", "url": "https://x.com/GoogleDeepMind/status/2110190101707858039", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110165986926072019", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-14T00:29:10Z", "text": "We will soon see what will be, in effect, a perfectly legal distributed denial of service attack on customer service departments authorized by millions of consumers when it becomes widely known that Muse/Dot/etc can make unlimited requests for old refunds, negotiate deals, etc.", "summary": "Ethan Mollick 预测：当大众知道 Muse、Dot 等 AI Agent 能无限次替人申请旧账退款、谈判优惠后，客服部门将遭遇由数百万消费者“合法授权”的事实上的 DDoS 攻击。", "url": "https://x.com/emollick/status/2110165986926072019", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110123131692048515", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "", "tu": "2026-10-13T21:38:53Z", "text": "True, this is a very big deal https://t.co/nmJohlSybo", "summary": "Elon Musk 转发并认同摩根士丹利分析师 Adam Jonas 的观点：SpaceX 最被投资者低估的增长潜力在于其“分布式推理云”（Distributed Inference Cloud），称这是件“非常大的事”。", "url": "https://x.com/elonmusk/status/2110123131692048515", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110080053409116660", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "", "tu": "2026-10-13T18:47:42Z", "text": "@Apptronik By turning video into a training ground for physical AI, Argon compresses weeks of manual modeling into just a few hours. ↓\n\nhttps://t.co/8tQ2r21lcC", "summary": "Google DeepMind 补充说明：Gemini 4 Argon 能把视频直接变成具身智能训练场，将原本数周的手工建模压缩到仅需数小时。", "url": "https://x.com/GoogleDeepMind/status/2110080053409116660", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110078384617464201", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "", "tu": "2026-10-13T18:41:04Z", "text": "Gemini 4 Argon taught a robot to play cornhole just by watching a video.\n\nIt mapped the physics, coded its own simulation, and taught @Apptronik's Apollo humanoid to sink 7 throws in a row. https://t.co/JIyoKnVc4q", "summary": "Google DeepMind 展示 Gemini 4 Argon 仅看一段视频就理解了扔沙包（cornhole）的物理规律，自行编写仿真并训练 Apptronik 的 Apollo 人形机器人连续 7 投命中。", "url": "https://x.com/GoogleDeepMind/status/2110078384617464201", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2110065576764686421", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "", "tu": "2026-10-13T17:50:11Z", "text": "🆕 How to Kill Your SaaS \n\nhttps://t.co/EDWkyXne3U\n\nA lot of people talk about the death of SaaS but mostly in theoretical terms. We took a real $43,000/year SaaS we use and launched a global hackathon to clone it in a weekend, with both AI and REAL HUMAN evals, using any models", "summary": "swyx 发布《How to Kill Your SaaS》：他们挑了一个每年 4.3 万美元的真实 SaaS，发起全球黑客松在一个周末内用任意模型克隆它，并结合 AI 与真人评测，实证“SaaS 已死”的讨论。", "url": "https://x.com/swyx/status/2110065576764686421", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110063893016096831", "handle": "gdb", "name": "Greg Brockman", "username": "gdb", "t": "", "tu": "2026-10-13T17:43:29Z", "text": "6 days and $40,000 of compute with GPT-5.6 Sol to find a critical vulnerability in Chrome, claiming Google’s first full-chain reward in 2026 for a vulnerability that would affect an estimated 1 billion users.\n\nHighlights the opportunity for defenders to utilize these tools to https://t.co/4q6AannOjN", "summary": "Greg Brockman 称 XBOW 用 GPT-5.6 Sol 花 6 天、4 万美元算力找到一个可影响约 10 亿用户的 Chrome 严重漏洞，拿下 Google 2026 年首个全链漏洞奖励（25 万美元），说明防御方可借 AI 大幅提升软件安全。", "url": "https://x.com/gdb/status/2110063893016096831", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110060618258497764", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-13T17:30:29Z", "text": "Using Gemini 4 makes you realize how many other models must be distilling Claude/GPT (or using a similar training pipeline). It feels quite different than other models.", "summary": "Ethan Mollick 认为用过 Gemini 4 后会发现很多其他模型大概在蒸馏 Claude/GPT（或用了相似训练流程），Gemini 4 的感觉明显不同。", "url": "https://x.com/emollick/status/2110060618258497764", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110052331702124894", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-13T16:57:33Z", "text": "I spent a decent amount of time with Gemini 4 before launch. Overall, Gemini 4 is a big jump over previous Gemini models and it is the first non-OpenAI/Anthropic model to pass the Fable/Mythos/Astra bar. It is also much more pleasant and more agentic then previous Gemini models, https://t.co/9OHn9wIzHJ", "summary": "Ethan Mollick 发布前已深度试用 Gemini 4：相比此前 Gemini 是大幅跃升，是首个达到 Fable/Mythos/Astra 水准的非 OpenAI/Anthropic 模型，且更好用、更具 Agent 能力。", "url": "https://x.com/emollick/status/2110052331702124894", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110050795890827756", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "", "tu": "2026-10-13T16:51:27Z", "text": "If an agent saves an engineer 2 hours to implement a feature but collectively costs the team 3 hours in alignment and review, the ROI is negative.\n\nIsolated chats are suboptimal in team environments because they lack the context of what the team already discussed and decided. The https://t.co/F1dIojeWzZ", "summary": "François Chollet 指出：若 Agent 为工程师省下 2 小时实现功能，却让团队多花 3 小时对齐和评审，ROI 就是负的；孤立的个人对话缺乏团队已有讨论和决策的上下文，在团队场景下并不理想。", "url": "https://x.com/fchollet/status/2110050795890827756", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110047081414987957", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "", "tu": "2026-10-13T16:36:41Z", "text": "New on our Engineering blog: Creating in-house source control. \n\nIn May, we merged around 2,500 code changes per day. In September, we merged more than 30,000 per day. As a result, we became bottlenecked by developer infrastructure built for human (rather than agent) scale.", "summary": "Anthropic 工程博客介绍自研源代码管理系统：其每日合并的代码变更从 5 月约 2,500 次增至 9 月超 30,000 次，为“人类规模”设计的开发基础设施已跟不上 Agent 规模，因此自建。", "url": "https://x.com/AnthropicAI/status/2110047081414987957", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2110041008100843835", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "", "tu": "2026-10-13T16:12:33Z", "text": "Gemini 4 Argon is amazing for knowledge work and coding - and it’s super fun to build with! We asked it to create this wizard chess game and it's so cool to see Argon's physics understanding &amp; 3D modelling capabilities, makes me nostalgic for Battlechess on the Amiga - fun times! https://t.co/nVADBiXYDe", "summary": "Demis Hassabis 称 Gemini 4 Argon 在知识工作和编程上表现出色，并展示用它生成的巫师国际象棋游戏，体现其物理理解与 3D 建模能力。", "url": "https://x.com/demishassabis/status/2110041008100843835", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110039274922131792", "handle": "GoogleDeepMind", "name": "Google DeepMind", "username": "GoogleDeepMind", "t": "", "tu": "2026-10-13T16:05:40Z", "text": "Gemini 4 Argon is now globally available.\n\nBuilt to solve your hardest problems from start to finish, the model brings frontier capabilities across coding, enterprise workflows, and cyber defense. https://t.co/N8tOQjwk0x", "summary": "Google DeepMind 宣布 Gemini 4 Argon 全球上线，主打从头到尾解决最难问题，在编程、企业工作流和网络安全防御方面具备前沿能力。", "url": "https://x.com/GoogleDeepMind/status/2110039274922131792", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2110038387360923744", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "", "tu": "2026-10-13T16:02:08Z", "text": "Two announcements today for the visit of @JensenHuang in France:  \n\nhttps://t.co/X5YVevcHKG with @Inria\n\nhttps://t.co/TdT38Q9zny by @nvidia", "summary": "Clement Delangue 提及黄仁勋访法当日两项宣布：与法国国家信息与自动化研究所 Inria 的合作，以及英伟达方面的相关公告。", "url": "https://x.com/ClementDelangue/status/2110038387360923744", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110010580278853800", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "", "tu": "2026-10-13T14:11:39Z", "text": "I can't wait to do much much much more in France with @huggingface @nvidia in the coming years. France has the talent &amp; the energy to become the third country in the world for datacenters and AI in general, especially thanks to their strong open-source AI ecosystem. Let's do it https://t.co/epnrit6ADQ", "summary": "Clément Delangue 表示期待 Hugging Face 与 NVIDIA 未来几年在法国做更多事，认为凭借人才和强大的开源 AI 生态，法国有望成为全球第三大数据中心与 AI 国家。", "url": "https://x.com/ClementDelangue/status/2110010580278853800", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2110008451866710221", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-13T14:03:11Z", "text": "A worthwhile (and unnerving) reminder from Anthropic that we should be paying attention to AI ability thresholds, not just steady climbs\n\nIn this case, the threshold is the capability needed for a self-replicating AI worm on IoT devices like off-brand TVs https://t.co/RCRTlQC3fG https://t.co/9ZwuNxA5p2", "summary": "Ethan Mollick 转引 Anthropic 的提醒：应关注 AI 能力“阈值”而非只看平稳提升，例如能在杂牌电视等 IoT 设备上自我复制的 AI 蠕虫所需的能力门槛。", "url": "https://x.com/emollick/status/2110008451866710221", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2109990238533677520", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "", "tu": "2026-10-13T12:50:49Z", "text": "I used to be a FICC trader so this announcement is absolutely freaking surreal — its not every year that we get to launch a NEW ASSET CLASS at @aidotengineer but this is finally public!\n\nANNOUNCING THE COMPUTE TRADING MICROTRACK of AIE NYC\n\n- @evanjconrad: CEO SFCompute\n- Oliver https://t.co/3EqA6RG1bh https://t.co/YOFHsjTjBB", "summary": "swyx 宣布 AI Engineer 纽约大会新增“算力交易”专题分会场（嘉宾含 SFCompute CEO Evan Conrad），称算力正在成为一种新的可交易资产类别；该专题将探讨算力如何买卖与定价。", "url": "https://x.com/swyx/status/2109990238533677520", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2109851162518425779", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-13T03:38:10Z", "text": "GPT-4 was the undisputed best model in the world for a full year and we all debated whether anyone could catch up or if OpenAI had some secret formula that nobody else knew about.\n\nNow there are are 19 AI models that can run on a modern smartphone that are better than GPT-4! https://t.co/dhZhc8DWOL", "summary": "Ethan Mollick 指出：GPT-4 曾稳居全球最强模型一整年，如今已有 19 个能在现代智能手机上本地运行的模型超过 GPT-4。", "url": "https://x.com/emollick/status/2109851162518425779", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2109841404239417415", "handle": "JeffDean", "name": "Jeff Dean", "username": "JeffDean", "t": "", "tu": "2026-10-13T02:59:24Z", "text": "I've been a personal supporter (through our family foundation) of @Khipu_AI &amp; @DeepIndaba, which are  fantastic events for AI researchers in Africa and South America. I've encouraged Google to support these in the past.  Discovery Loop (@DiscoLoopAI) is thrilled to support! https://t.co/MbaAheM76w", "summary": "Jeff Dean 回应非洲 Deep Learning Indaba 与南美 Khipu 今年筹款困难，表示其家族基金会长期资助二者，并宣布 Discovery Loop（@DiscoLoopAI）将出资支持。", "url": "https://x.com/JeffDean/status/2109841404239417415", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2109813775377563908", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "", "tu": "2026-10-13T01:09:37Z", "text": "Amazing to see research move from the lab to real-world clinical utility - congrats to the team on this milestone &amp; @TheLancet paper! https://t.co/Jq0G4D6Cx2", "summary": "哈萨比斯祝贺 Google 的 AMIE 研究登上《柳叶刀》：这是首个在真实诊所里让患者直接与对话式诊断 AI 交流的前瞻性研究（与 BIDMC 合作），标志研究走向临床应用。", "url": "https://x.com/demishassabis/status/2109813775377563908", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2109803903256502307", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "", "tu": "2026-10-13T00:30:23Z", "text": "Robotaxi improvements https://t.co/zsM3I8BPru", "summary": "马斯克转发 Tesla Robotaxi 近几周服务更新：运营时间延长到早 6 点至晚 11 点，靠增加车辆和调度算法缩短等车时间，Cybercab 车内已可用 Grok。", "url": "https://x.com/elonmusk/status/2109803903256502307", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2109795898909950247", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "", "tu": "2026-10-12T23:58:35Z", "text": "Over the last few months, we’ve made significant progress in reducing the effectiveness of distillation attacks against Claude.\n\nIn this post, we explain how: https://t.co/uWiRSLBuOS", "summary": "Anthropic 称过去几个月已大幅削弱针对 Claude 的蒸馏攻击（他人用 Claude 输出训练自家模型）的效果，并发文介绍具体做法。", "url": "https://x.com/AnthropicAI/status/2109795898909950247", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2109783335296008414", "handle": "xai", "name": "xAI", "username": "SpaceXSI", "t": "", "tu": "2026-10-12T23:08:39Z", "text": "We've unified plans across Grok, Cursor, and X Premium. Introducing The X Subscription. https://t.co/SvkrVvBa0p", "summary": "Grok、Cursor 与 X Premium 的付费方案合并为统一的“X Subscription”订阅。", "url": "https://x.com/SpaceXSI/status/2109783335296008414", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2109780446372667802", "handle": "jackclarkSF", "name": "Jack Clark", "username": "jackclarkSF", "t": "", "tu": "2026-10-12T22:57:10Z", "text": "I will be giving the Per Jacobsson Foundation Lecture at the IMF conference in Thailand on Saturday, during which I'm going to make the case that we are entering a period of massive, sudden change catalyzed by the advancing capabilities of AI systems. https://t.co/4H6qpltWpX", "summary": "Anthropic 联合创始人 Jack Clark 将于本周六在泰国 IMF 会议发表 Per Jacobsson 基金会讲座，论证 AI 能力进步正把世界带入一段剧烈而突然的变革期，讲座会直播。", "url": "https://x.com/jackclarkSF/status/2109780446372667802", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2109755776202137686", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-12T21:19:09Z", "text": "Yes, and there is a case to be made that OpenAI and Anthropic will do the best job of figuring out how to optimize AI cost/intelligence with combinations of agents of different ability levels that have been specifically trained to work well together in their own harnesses. https://t.co/75eS0e8562", "summary": "Mollick 认为 OpenAI 和 Anthropic 不只在前沿竞争，也在低价端竞争，它们可能最擅长用不同能力档、专门协同训练的智能体组合来优化成本与智能的平衡。", "url": "https://x.com/emollick/status/2109755776202137686", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2109714218014667039", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-12T18:34:00Z", "text": "Had some early access to Muse Wonder, but did not get a chance to use it a ton, yet it seems like a good model from limited test\n\nPerhaps more impressive, compare the progress since April in my drowned neogothic city twigl shader test. Very fast progress from Meta in a short time https://t.co/NEYTWgE2ul https://t.co/X8sj3A0wG7", "summary": "Mollick 提前试用了 Meta 的 Muse Wonder，初步感觉是个好模型；对比 4 月 Muse Spark 在他的 shader 测试中的表现，认为 Meta 短期内进步非常快。", "url": "https://x.com/emollick/status/2109714218014667039", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2109695682676506679", "handle": "_jasonwei", "name": "Jason Wei", "username": "_jasonwei", "t": "", "tu": "2026-10-12T17:20:21Z", "text": "muse wonder is out! scaling prevails…  \n\nit has been so fun to be part of the powerful yet nimble ship of Meta, where in just over a year, much of the company pivoted to contribute to the model, ranging from the infra engineers who started building tools for experiment https://t.co/of2NCvxBSX", "summary": "Jason Wei 庆祝 Meta Muse Wonder 发布，称“规模化依然有效”，并透露一年多来 Meta 大半个公司都转向为这个模型出力。", "url": "https://x.com/_jasonwei/status/2109695682676506679", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2109691148943999167", "handle": "AIatMeta", "name": "AI at Meta", "username": "AIatMeta", "t": "", "tu": "2026-10-12T17:02:20Z", "text": "We’re excited to introduce the Muse Wonder series with Muse Wonder and Muse Wonder Full, our most capable models yet. Both are frontier models, built to deliver state-of-the-art performance for personal and professional agentic tasks.\n\nMuse Wonder is available today via the Meta https://t.co/Z9Pdf5USyw", "summary": "Meta 发布迄今最强的前沿模型系列 Muse Wonder 与 Muse Wonder Full，称在个人/专业智能体、记忆和编程基准上达到业界领先，带跨对话的“主动记忆”和长任务的“主动专注”，Muse Wonder 今日起开放使用。", "url": "https://x.com/AIatMeta/status/2109691148943999167", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2109683365045739888", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-12T16:31:24Z", "text": "If you haven’t made sure to turn on two-factor authentication on all accounts, have passwords with family in case you get voice calls asking for money, etc, now would be a good time.\n\nAI gains mean the costs of mass targeting individuals with sophisticated attacks are dropping.", "summary": "Mollick 提醒 AI 正让针对个人的大规模精细化诈骗成本下降，建议所有账号开启两步验证，并和家人约定暗号以防冒充语音借钱。", "url": "https://x.com/emollick/status/2109683365045739888", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2109673788971405497", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "", "tu": "2026-10-12T15:53:21Z", "text": "If you’re a researcher, please consider sharing your RL environments openly! Something you built for one experiment could help the entire field move forward.\n\nI know we’re in dark days for sharing from frontier labs in the US, but I believe this can have a huge impact on the https://t.co/eXW7XdYYYM", "summary": "Hugging Face CEO 呼吁研究者公开分享强化学习训练环境，认为即便美国前沿实验室越来越少分享，社区共享环境也能大幅推动整个领域。", "url": "https://x.com/ClementDelangue/status/2109673788971405497", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2109631106404487523", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "", "tu": "2026-10-12T13:03:45Z", "text": "Today we are announcing our biggest bet yet on our own silicon.\n\nStarting next calendar year, we will scale our Maia family to multi-gigawatt deployments, making it the primary inference system for our own product and services.\n\nAnd we’re introducing Maia 300, which delivers 40% https://t.co/L490XvOys9", "summary": "纳德拉宣布微软在自研芯片上下最大赌注：明年起把 Maia 系列扩展到数吉瓦级部署，作为微软自家产品和服务的主力推理系统，并发布新一代 Maia 300。", "url": "https://x.com/satyanadella/status/2109631106404487523", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2109497942717632662", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-12T04:14:36Z", "text": "GPT-6 Pro finds supposed errors in academic papers all the time, just as part of other work. Confirming the errors &amp; learning their importance would still take a lot of time today, but it will get faster. We don't have the right mechanisms in place to deal a flood of corrections.", "summary": "Mollick 称 GPT-6 Pro 在日常工作中经常发现学术论文中的疑似错误，学界尚无机制应对即将到来的大量更正。", "url": "https://x.com/emollick/status/2109497942717632662", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2109472254417318335", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "", "tu": "2026-10-12T02:32:32Z", "text": "I spoke to some annoyed leaders at big firms who were still big on GPTs as of last month, before GPTs were sunsetted. Yes, GPTs outlived their usefulness. But large organizations have complex planning &amp; all the Labs (not just OpenAI) keep making sudden changes that confuse them.", "summary": "Mollick 称 OpenAI 下线 GPTs 等各家实验室的突然变动让大企业难以规划，频繁强制换模型阻碍了企业组织变革。", "url": "https://x.com/emollick/status/2109472254417318335", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2109461555066671311", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-12 09:50", "tu": "2026-10-12T01:50:01.000Z", "text": "Join the Terafab project. The value of the output of this massive structure will rank in the top 20 of country GDPs! https://t.co/QNnLc4rUrh", "summary": "马斯克为 Terafab 芯片超级工厂项目招人，称其产出价值将跻身全球国家 GDP 前 20。", "url": "https://x.com/elonmusk/status/2109461555066671311", "cat": "行业动态", "rq": true, "quoted": "", "media": []}, {"id": "2109422437616029941", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-12 07:14", "tu": "2026-10-11T23:14:34.000Z", "text": "Not to get too annoying about it but its worth noting that many of the 5,000 people at the labs with access to advanced model still haven't used them to their full extent: its all cybersecurity &amp;  math &amp; AI R&amp;D.\n\nThere are a lot of other fields to advance and problems to solve... https://t.co/HHydK3UBij", "summary": "Mollick 指出能接触最先进模型的实验室人员主要把它用于网络安全、数学和 AI 研发，其他领域潜力远未释放。", "url": "https://x.com/emollick/status/2109422437616029941", "cat": "技术观点", "rq": true, "quoted": "", "media": []}, {"id": "2109385496237678844", "handle": "hardmaru", "name": "hardmaru", "username": "hardmaru", "t": "2026-10-12 04:47", "tu": "2026-10-11T20:47:47.000Z", "text": "New paper from the team at Sakana AI:\nRecursive Self-Improvement through Multi-Agent Self-Supervision (MASS)\n\nHow do we keep improving AI when the tasks become too complex for humans to reliably evaluate?\n\nFor open-ended research, we eventually hit a \"supervision bottleneck.\" If https://t.co/CYFjimViMx https://t.co/uSDhkvsiiB", "summary": "Sakana AI 发布新论文 MASS：用多智能体相互监督实现递归自我改进，以突破人类难以评估时的“监督瓶颈”。", "url": "https://x.com/hardmaru/status/2109385496237678844", "cat": "研究成果", "rq": true, "quoted": "", "media": []}, {"id": "2109361546505966046", "handle": "karpathy", "name": "Andrej Karpathy", "username": "karpathy", "t": "2026-10-12 03:12", "tu": "2026-10-11T19:12:37.000Z", "text": "Dusting off this tweet from April because this gap in shared understanding of LLM capability is *widening*. It's now less \"two groups of people speaking past each other\" and more a sharp funnel.\n\n- Napkin math somewhere around 6B people (~75% of the population) have barely come https://t.co/79xGhQdf1n", "summary": "Karpathy 认为公众对大模型能力的认知鸿沟正在扩大，估算约 60 亿人几乎没真正接触过前沿模型，认知分布呈尖锐漏斗。", "url": "https://x.com/karpathy/status/2109361546505966046", "cat": "技术观点", "rq": true, "quoted": "", "media": []}, {"id": "2109327353088287057", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-12 00:56", "tu": "2026-10-11T16:56:45.000Z", "text": "Rather suddenly, cyborgs are starting to dominate math research. https://t.co/4ViU8iybXG", "summary": "Mollick 引用数据称人机协作（AI 辅助）正迅速主导数学研究。", "url": "https://x.com/emollick/status/2109327353088287057", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2109290775322243143", "handle": "clementdelangue", "name": "Clem Delangue", "username": "clementdelangue", "t": "2026-10-11 22:31", "tu": "2026-10-11T14:31:24.000Z", "text": "We turned @OpenAI's math problems into open-source RL environments on @huggingface!\n\nEarly and rough (the verifier only accepts the exact original formalization, so an equivalent proof can still score 0), but this is what it looks like when a research release becomes executable https://t.co/PFPtqBPun6", "summary": "Hugging Face 把 OpenAI 发布的数学题做成了开源强化学习环境（早期版本，验证器只认原始形式化证明）。", "url": "https://x.com/clementdelangue/status/2109290775322243143", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2109262612303314986", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-11 20:39", "tu": "2026-10-11T12:39:29.000Z", "text": "Cybercab is scaling https://t.co/ums278bAI6", "summary": "马斯克转发 @robotaxi：Cybercab 在奥斯汀上线一个月已扩到 300 多辆，30 天增长 8 倍。", "url": "https://x.com/elonmusk/status/2109262612303314986", "cat": "行业动态", "rq": true, "quoted": "", "media": []}, {"id": "2109096597011534242", "handle": "fchollet", "name": "François Chollet", "username": "fchollet", "t": "2026-10-11 09:39", "tu": "2026-10-11T01:39:48.000Z", "text": "I've been having a lot of fun trying a wide range of LLM post-training experiments using KerasHub + JAX + TPUs. Might open-source some of that", "summary": "Chollet 在用 KerasHub + JAX + TPU 做大量 LLM 后训练实验，可能会开源部分成果。", "url": "https://x.com/fchollet/status/2109096597011534242", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108959938781511812", "handle": "mustafasuleyman", "name": "Mustafa Suleyman", "username": "mustafasuleyman", "t": "2026-10-11 00:36", "tu": "2026-10-10T16:36:46.000Z", "text": "Super Intelligence must be contained... Today, this is an engineering and governance challenge. And it isn't new. We've done it with planes, cars, nuclear materials, food safety, medicines... and everything else. Let's get to work! https://t.co/PQkfLY9RA1", "summary": "苏莱曼转引纳德拉文章，称超级智能必须被管控，这是工程与治理问题，可借鉴航空、核材料、药品等监管经验。", "url": "https://x.com/mustafasuleyman/status/2108959938781511812", "cat": "技术观点", "rq": true, "quoted": "", "media": []}, {"id": "2108951977904517409", "handle": "fchollet", "name": "François Chollet", "username": "fchollet", "t": "2026-10-11 00:05", "tu": "2026-10-10T16:05:08.000Z", "text": "How AI shifted from a transductive paradigm (token-by-token answer completion) to an inductive paradigm (on-the-fly reasoning chain synthesis), in one chart. This is the big story of 2025 and 2026. This is what made coding agents work. https://t.co/ThLm2AH127", "summary": "Chollet 用一张图说明 AI 从逐 token 补全的“转导”范式转向即时合成推理链的“归纳”范式，认为这是 2025–26 年的主线，也是编程智能体能用起来的原因。", "url": "https://x.com/fchollet/status/2108951977904517409", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108931348857827686", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-10 22:43", "tu": "2026-10-10T14:43:10.000Z", "text": "https://t.co/MjwFy73LOF", "summary": "纳德拉发长文《超级智能时代，模型即内部风险》，讨论把 AI 模型当作内部人风险来管控。", "url": "https://x.com/satyanadella/status/2108931348857827686", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108926853230493843", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-10 22:25", "tu": "2026-10-10T14:25:18.000Z", "text": "Join @TeslaSI if you’re interested in solving generalized real-world super intelligence! https://t.co/6xcx7IqmzD", "summary": "马斯克为 @TeslaSI 招人，并引用自述：Digital Optimus 仅靠看屏幕已能打通约一半《暗黑破坏神》战役，CS 等快节奏游戏表现也不错，目标是跨任务泛化。", "url": "https://x.com/elonmusk/status/2108926853230493843", "cat": "行业动态", "rq": true, "quoted": "", "media": []}, {"id": "2108908657786355788", "handle": "rasbt", "name": "Sebastian Raschka", "username": "rasbt", "t": "2026-10-10 21:13", "tu": "2026-10-10T13:13:00.000Z", "text": "Reasoning From Scratch: Reinforcement Learning with Verifiable Rewards (RLVR) round 2.\nCovering clipped policy ratios, KL loss term, format rewards, and other GRPO tips &amp; tricks.\n\n00:00 Introduction and recap\n01:52 Interpreting basic GRPO training metrics\n06:34 Planned https://t.co/B4Rf9PWEcV", "summary": "Raschka 发布《从零实现推理》RLVR 第二讲视频，讲解 GRPO 的裁剪策略比、KL 损失项、格式奖励等训练技巧。", "url": "https://x.com/rasbt/status/2108908657786355788", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108750448593338866", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-10 10:44", "tu": "2026-10-10T02:44:20.000Z", "text": "Listen, I know people are tired of tech CEOs saying we will all be freed from work thanks to AI (whether we like it or not), but... I would love to see more non-tech folks thinking about the future we want to have as a result of AI & how to get there. Don't leave it to the Valley https://t.co/T0b0s9pHFo", "summary": "引用贝索斯关于 AI 或可带来三天工作制的说法，呼吁更多非科技界人士参与构想 AI 带来的未来，而非把未来交给硅谷。", "url": "https://x.com/emollick/status/2108750448593338866", "cat": "技术观点", "rq": true, "quoted": "", "media": []}, {"id": "2108747396025041159", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-10 10:32", "tu": "2026-10-10T02:32:12.000Z", "text": "Not only did Astra beat Montezuma's Revenge, but so did Opus 5\n\nBut one of the criteria to resolve this AGI bet is for AI to win a discontinued prize that was sort of like a weak Turing Test. So Metaculus has decided to recreate the test to confirm the criteria is resolved. Neat! https://t.co/GUSwXdg2W8", "summary": "指出 GPT-6 Astra 与 Opus 5 均已通关 Montezuma's Revenge；Metaculus 正重建类似弱图灵测试的停办奖项，以判定其 AGI 押注条件是否达成。", "url": "https://x.com/emollick/status/2108747396025041159", "cat": "研究成果", "rq": true, "quoted": "", "media": []}, {"id": "2108745817498538389", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-10 10:25", "tu": "2026-10-10T02:25:56.000Z", "text": "I speak to a lot of people about AI & not everyone gets how it can be useful for them outside of work\n\nSo its a shift that when I talk to people using Muse or Dot, they often tell a story of how their AI did something proactively to help them, and it makes them feel good about AI", "summary": "观察到使用 Muse/Dot 等个人 AI 的用户常提到智能体能主动帮忙，使人对 AI 产生好感，标志着 AI 在工作之外的日常用途正在被更多人理解。", "url": "https://x.com/emollick/status/2108745817498538389", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2108680150556737819", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-10 06:04", "tu": "2026-10-09T22:04:59.000Z", "text": "We’re beginning a process of publishing more frequent reports on model behavior, beyond what appears in our system cards and regular risk reports.\n\nToday’s report describes four types of behaviors we’ve identified during evaluations and internal use. In each, Claude acted on real", "summary": "Anthropic 开始更频繁发布模型行为报告，首篇梳理评估与内部使用中发现的四类 Claude 真实行为。", "url": "https://x.com/AnthropicAI/status/2108680150556737819", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108671364970447139", "handle": "soumithchintala", "name": "Soumith Chintala", "username": "soumithchintala", "t": "2026-10-10 05:30", "tu": "2026-10-09T21:30:05.000Z", "text": "our engineers have been busy, and we're passing on the savings down to customers.\n\nthe more you buy the more you save! https://t.co/gMsAqIfBxd", "summary": "Soumith 转发并呼应 Tinker 因长上下文 RL 效率提升降价最高 70%，同时上线 GLM-5.3-Flash 与 DeepSeek-v4.1-Flash。", "url": "https://x.com/soumithchintala/status/2108671364970447139", "cat": "融资与商业", "rq": true, "quoted": "Tinkerers have been busy scaling up long-context RL! We’ve made significant improvements to Tinker’s efficiency to support those, and are passing these on with price cuts up to 70%.\n\nGLM-5.3-Flash and DeepSeek-v4.1-Flash are also live for cost-efficient long-context work. https://t.co/in9eAAFO6O", "media": []}, {"id": "2108654415464869954", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-10 04:22", "tu": "2026-10-09T20:22:44.000Z", "text": "I see a lot of people suggesting it, but the search bar or chat window is very clearly not the interface for agentic work.", "summary": "Mollick 认为搜索框或聊天窗口并非智能体工作的合适界面，反对把 agentic 工作塞进传统检索/对话入口。", "url": "https://x.com/emollick/status/2108654415464869954", "cat": "技术观点", "rq": true, "quoted": "", "media": []}, {"id": "2108652762904793360", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-10 04:16", "tu": "2026-10-09T20:16:10.000Z", "text": "Its reasonable for mathematicians to point out that proofs are not always the same thing as advancing mathematics. But it suggests a need for new goals for what math is trying to do\n\nSame thing will happen everywhere. 100x more PowerPoint or code is not always progress - what is?", "summary": "Mollick 以数学证明≠推进数学为喻，指出 AI 让产出暴增（幻灯片/代码）并不等于进步，需要重新定义目标。", "url": "https://x.com/emollick/status/2108652762904793360", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108627923888754862", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-10 02:37", "tu": "2026-10-09T18:37:28.000Z", "text": "Introducing Microsoft-Decision-1, our new model for fast decision-making.\n\nIt delivers top performance on structured decision tasks, outperforming both LLMs and other decision models in latency and quality.\n\nWe’re already testing it across Microsoft for everything from incident https://t.co/M3fAOD90r6", "summary": "Satya Nadella 发布 Microsoft-Decision-1：面向结构化决策的新模型，号称在时延与质量上优于通用 LLM 及其他决策模型，已在微软内部试用。", "url": "https://x.com/satyanadella/status/2108627923888754862", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2108627925654503761", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-10 02:37", "tu": "2026-10-09T18:37:28.000Z", "text": "Available now in Foundry and soon through OpenRouter: https://t.co/QBWsCmfIrm", "summary": "Microsoft-Decision-1 已在 Azure AI Foundry 上线，并将很快登陆 OpenRouter。", "url": "https://x.com/satyanadella/status/2108627925654503761", "cat": "产品发布", "rq": true, "quoted": "", "media": []}, {"id": "2108617137241911723", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-10 01:54", "tu": "2026-10-09T17:54:36.000Z", "text": "The real world abounds with recursively self-improving systems, but one in particular deserves attention: Science, modeled as a system (perhaps even as an agent, with goals and resources). If you want to really understand AI RSI, science should be your reference point.\n\nScience", "summary": "Chollet 提出理解 AI 递归自我改进（RSI）应以科学体系为参照，将其视为有目标与资源的系统/智能体。", "url": "https://x.com/fchollet/status/2108617137241911723", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108596098277249441", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-10 00:31", "tu": "2026-10-09T16:31:00.000Z", "text": "Right now, using AI agents still feels very single-player. They do your work, but the results are trapped in isolated chat histories and nothing compounds.\n\nThe Busabase team (@Busabase4agent) is launching an open-source (MIT) database and workspace for agents to fix this.", "summary": "Chollet 介绍 Busabase 团队开源（MIT）的智能体数据库与工作区，旨在让智能体产出可复用、可累积而非困在单次对话。", "url": "https://x.com/fchollet/status/2108596098277249441", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2108594749305135613", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-10 00:25", "tu": "2026-10-09T16:25:38.000Z", "text": "Randomized trials with old GPT-4o: \"AI access raises test scores, and a smaller gain persists a week later. Gains remain for students who use AI as a tutor (“augmentation”) and fade for students who have AI write for them (“automation”)\"\n\nAcross all experiments, positive effects. https://t.co/Ux4xDavAYa", "summary": "Mollick 分享 GPT-4o 教育随机试验：AI 可提高成绩且辅导式使用效果更持久，代写式增益易消退。", "url": "https://x.com/emollick/status/2108594749305135613", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108585135998120061", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-09 23:47", "tu": "2026-10-09T15:47:26.000Z", "text": "Google has the advantage, if they use it, of being able to observe where OpenAI and Anthropic are going with Codex/Code and get there now. Otherwise they are going to have to go through that whole learning process themselves, which will make Gemini 4 less impactful along the way.", "summary": "Mollick 认为 Google 可借鉴 OpenAI/Anthropic 的 Codex 路线以加速 Gemini 4 落地，否则需自行走完学习曲线。", "url": "https://x.com/emollick/status/2108585135998120061", "cat": "技术观点", "rq": true, "quoted": "", "media": []}, {"id": "2108584037451550741", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-09 23:43", "tu": "2026-10-09T15:43:04.000Z", "text": "The challenge for Google post-Gemini 4 will be what they do with a good model. Anthropic & OpenAI show we are moving towards a single interface for many tasks with orchestrator agents. The Gemini 3 era was full of fragmented products for many markets. Won't work for what's next.", "summary": "Mollick 指出 Gemini 4 之后的关键是产品形态：行业正走向单一界面+编排智能体，碎片化产品难以支撑下一阶段。", "url": "https://x.com/emollick/status/2108584037451550741", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108579538372612400", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-09 23:25", "tu": "2026-10-09T15:25:12.000Z", "text": "We're reaching really good ARC-AGI-2 scores on Kaggle now! https://t.co/VWI60fij84", "summary": "Chollet 指出 Kaggle 上 ARC-AGI-2 成绩提升，并引用 ARC Prize 2026 新高分 88.06%（tufalabs）及奖金规则。", "url": "https://x.com/fchollet/status/2108579538372612400", "cat": "研究成果", "rq": true, "quoted": "New ARC Prize 2026 - ARC-AGI-2 High Score\n\n88.06% by @tufalabs \n\nThe $150K Bonus Prize, on top of the guaranteed prizes, will be split among all teams scoring over 85% https://t.co/jwUYwr4Ecv", "media": []}, {"id": "2108414247558316508", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-09 12:28", "tu": "2026-10-09T04:28:23.000Z", "text": "In an urgent care setting, the advice of the obsolete Gemini 2.5 Pro & Gemini 2.5 Flash (without access to patient medical records) were rated of similar quality to doctors by other physicians. There was no safety issues spotted.\n\nModels have gotten significantly better since. https://t.co/n6A4vdGjLM", "summary": "Ethan Mollick 分享研究：在急诊场景中，过时的 Gemini 2.5 Pro/Flash（无病历）建议被其他医生评为与医生质量相近且未发现安全问题，并指出此后模型已显著提升。", "url": "https://x.com/emollick/status/2108414247558316508", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108379841859072028", "handle": "swyx", "name": "swyx", "username": "swyx", "t": "2026-10-09 10:11", "tu": "2026-10-09T02:11:40.000Z", "text": "going rate for this role is between 5-50m comp package btw at the frontier agent labs https://t.co/5Uw5RIc12a", "summary": "swyx 称前沿 agent 实验室此类（懂趋势/审美/AI/能落地）岗位总包约在 500 万–5000 万美元区间。", "url": "https://x.com/swyx/status/2108379841859072028", "cat": "行业动态", "rq": true, "quoted": "literal hardest role to hire for rn and every ai startup wants someone", "media": []}, {"id": "2108371259612708921", "handle": "jeremyphoward", "name": "Jeremy Howard", "username": "jeremyphoward", "t": "2026-10-09 09:37", "tu": "2026-10-09T01:37:34.000Z", "text": "Jasmine says that she accidentally accessed an executive's email that OpenAI had explicitly given her access to, even although she had explicitly requested that OpenAI remove her access, and IT had failed to do so.\n\nWhich implies Jasmine was fired for IT's failure? https://t.co/g9TEcOkwoj", "summary": "Jeremy Howard 质疑 OpenAI 解雇安全同事 Jasmine 的理由：其访问高管邮箱系公司未按请求撤销权限所致，或属 IT 过失。", "url": "https://x.com/jeremyphoward/status/2108371259612708921", "cat": "行业动态", "rq": true, "quoted": "OpenAI fired me last week, along with two of my safety colleagues.", "media": []}, {"id": "2108331042083872882", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "2026-10-09 06:57", "tu": "2026-10-08T22:57:45.000Z", "text": "Excited to support the Genesis Mission @WhiteHouse @ENERGY and Director @mkratsios47 with $150M in investments this week. Looking forward to collaborating on the future of science! https://t.co/0BXd15oZln", "summary": "Demis 宣布本周向白宫 Genesis Mission 投入 1.5 亿美元，并与能源部等合作推进未来科学发展。", "url": "https://x.com/demishassabis/status/2108331042083872882", "cat": "融资与商业", "rq": true, "quoted": "Announcing the Most Ambitious Set of Science Initiatives This Century", "media": []}, {"id": "2108310747080208781", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-09 05:37", "tu": "2026-10-08T21:37:07.000Z", "text": "Most measures of AI progress closely fit an exponential over the 2023-2026 period. Meanwhile AI capex over the same period has been slightly super-exponential (i.e. the rate of growth itself is increasing).\n\nSo if you model AI as a system that takes as input external investment", "summary": "Chollet 指出 2023–2026 年多数 AI 进展指标接近指数增长，而同期 AI 资本开支呈超指数增长，并据此讨论投资输入与能力产出关系。", "url": "https://x.com/fchollet/status/2108310747080208781", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108302545953157156", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-09 05:04", "tu": "2026-10-08T21:04:31.000Z", "text": "This is part of our broader effort to make the systems we all rely upon more secure and resilient.\n\nThat work will take time: the Anthropic Cyber Mission will expand and change as we learn what works, alongside our partners in the public and private sectors.", "summary": "Anthropic 称 Cyber Mission 将随公私合作经验持续扩展，以提升关键系统安全韧性。", "url": "https://x.com/AnthropicAI/status/2108302545953157156", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2108302543977906649", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-09 05:04", "tu": "2026-10-08T21:04:31.000Z", "text": "To secure open-source software, we’re launching OSS Scanner.\n\nWe’ll use our frontier models to periodically scan opted-in open-source projects for vulnerabilities, at no cost. Our reports will provide a proof-of-concept, explanation, and suggested fix.\n\nhttps://t.co/UFFrLUd25U", "summary": "发布免费 OSS Scanner：用前沿模型定期扫描自愿加入的开源项目漏洞，并提供 PoC、说明与修复建议。", "url": "https://x.com/AnthropicAI/status/2108302543977906649", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2108302541385499103", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-09 05:04", "tu": "2026-10-08T21:04:30.000Z", "text": "To help secure systems like power grids and water systems, we’re launching a new Critical Infrastructure Defense Program. \n\nWe’ll bring frontier Claude models, on-site engineers, and our latest research to these operators’ security, manufacturing and technology providers.", "summary": "推出 Critical Infrastructure Defense Program，向前沿关键设施运营商提供 Claude 模型、驻场工程师与最新研究。", "url": "https://x.com/AnthropicAI/status/2108302541385499103", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2108302539498414208", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-09 05:04", "tu": "2026-10-08T21:04:30.000Z", "text": "We’re launching the Anthropic Cyber Mission, a new effort to secure critical infrastructure and open-source software.\n\nhttps://t.co/0tz0ARAEMj", "summary": "Anthropic 启动 Cyber Mission，聚焦关键基础设施与开源软件安全。", "url": "https://x.com/AnthropicAI/status/2108302539498414208", "cat": "产品发布", "rq": false, "quoted": "", "media": []}, {"id": "2108292080145748160", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-09 04:22", "tu": "2026-10-08T20:22:56.000Z", "text": "Less than 4 years later and the Pope & the world’s greatest mathematicians & the President are posting a lot about the direct successor to this model and what it means for humanity. https://t.co/XjUUSikxU7", "summary": "Mollick 感慨不到四年，教皇、顶尖数学家与总统都在大量讨论该模型的直接继任者及其对人类的意义。", "url": "https://x.com/emollick/status/2108292080145748160", "cat": "行业动态", "rq": true, "quoted": "", "media": []}, {"id": "2108290395599667700", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-09 04:16", "tu": "2026-10-08T20:16:15.000Z", "text": "An astrophysicist worked with Claude Science to create the first complete ultraviolet map of the sky. Astronomers have already created complete sky maps from radio to gamma rays. But large regions of the sky have never been observed in UV.\n\nIn today’s science blog, Brice Ménard", "summary": "天体物理学家借助 Claude Science 完成首幅全天紫外线天空图，填补 UV 波段大片空白。", "url": "https://x.com/AnthropicAI/status/2108290395599667700", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108278193316630711", "handle": "StabilityAI", "name": "Stability AI", "username": "StabilityAI", "t": "2026-10-09 03:27", "tu": "2026-10-08T19:27:45.000Z", "text": "What if making video-based world models smaller isn't just about better compression, but about making their representations easier to predict?\n\nRecent approaches to video generation explore building scenes from coarse to fine. The first few tokens capture the big picture, like a https://t.co/Tt8fHyRgu4", "summary": "Stability AI 讨论视频世界模型：缩小规模关键或在于让表征更易预测，并由粗到细生成场景。", "url": "https://x.com/StabilityAI/status/2108278193316630711", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108252563015422389", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-09 01:45", "tu": "2026-10-08T17:45:55.000Z", "text": "Help keep science open, try this out on Paper Pages: https://t.co/1cApLwjR7A https://t.co/SUoEBauOIi", "summary": "Hugging Face 推广 Paper Pages，呼吁在开放科学激励减弱背景下继续开放分享科研成果。", "url": "https://x.com/huggingface/status/2108252563015422389", "cat": "行业动态", "rq": true, "quoted": "The incentives to share scientific knowledge openly are crumbling.", "media": []}, {"id": "2108251560752857474", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-09 01:41", "tu": "2026-10-08T17:41:56.000Z", "text": "Interesting to see, given the controversy over the OpenAI release of a series of proofs and what it means for the discipline of mathematics, that at least some of the OpenAI proofs seem to have kicked off extremely rapid iterative advances from a wide community of collaborators. https://t.co/Lf4JLicOAX", "summary": "Mollick 评论 OpenAI 公开证明引发争议的同时，部分证明已推动数学社群快速迭代改进。", "url": "https://x.com/emollick/status/2108251560752857474", "cat": "行业动态", "rq": true, "quoted": "Validated and merged Rohan's PR. Big gain on a really difficult regime...", "media": []}, {"id": "2108248166210720107", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-09 01:28", "tu": "2026-10-08T17:28:26.000Z", "text": "This document is going to be an assigned reading in college classes that cover this moment in time, there's a lot happening in a few paragraphs... https://t.co/pXhgPwFqtg https://t.co/JJiZx9nhpl", "summary": "Mollick 称某份简短文件浓缩当下关键节点，预计将成为大学课程必读材料。", "url": "https://x.com/emollick/status/2108248166210720107", "cat": "行业动态", "rq": false, "quoted": "", "media": []}, {"id": "2108242362032177597", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-09 01:05", "tu": "2026-10-08T17:05:23.000Z", "text": "At the very start of my grad school in 2005, I wrote paper about the original computer hacking/phreaking/BBS scene: hackers were often driven by curiosity but the tools they made were widely exploited by \"Script Kiddies\" who caused most damage & chaos\n\nAnyhow, about AI hacking... https://t.co/UxPr1UzoNU", "summary": "Mollick 以早期黑客/Script Kiddies 类比讨论 AI hacking：好奇驱动的工具如何被滥用造成破坏。", "url": "https://x.com/emollick/status/2108242362032177597", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108226292235809081", "handle": "AnthropicAI", "name": "Anthropic", "username": "AnthropicAI", "t": "2026-10-09 00:01", "tu": "2026-10-08T16:01:31.000Z", "text": "We're deepening our commitment to scientific research and technological discovery by committing $150 million to the Genesis Mission.\n\nWe'll also make Claude and our technical support available to more than 15 federal agencies.\n\nhttps://t.co/MUmQBiC6MF", "summary": "Anthropic 向 Genesis Mission 承诺投入 1.5 亿美元，并向逾 15 个联邦机构开放 Claude 与技术支持。", "url": "https://x.com/AnthropicAI/status/2108226292235809081", "cat": "融资与商业", "rq": false, "quoted": "", "media": []}, {"id": "2108213283144810958", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-08 23:09", "tu": "2026-10-08T15:09:50.000Z", "text": "https://t.co/I0uBgivA2e", "summary": "Satya Nadella 分享文章《The Infinite SaaS Factory》，讨论无限 SaaS 工厂相关技术与商业观点。", "url": "https://x.com/satyanadella/status/2108213283144810958", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108184948548976921", "handle": "clementdelangue", "name": "Clement Delangue", "username": "ClementDelangue", "t": "2026-10-08 21:17", "tu": "2026-10-08T13:17:14.000Z", "text": "We urgently need more public traces of AI agents attacking and defending systems. Defenders can’t learn from what they can’t see.\n\nIf you have traces and are being pressured to keep them private, my DMs are open. Let’s level the playing field and fight the asymmetry and lack of", "summary": "呼吁公开更多 AI agent 攻防系统痕迹，称防守方无法从看不到的数据中学习，并开放私信收集受压保密的 traces。", "url": "https://x.com/ClementDelangue/status/2108184948548976921", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2108177045511364998", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-08 20:45", "tu": "2026-10-08T12:45:50.000Z", "text": "I think I wrote exactly that, and it is still right. Organizations are a form of narrow superintelligence. My university, or Walmart, can do things that a human cannot, often using complex processes no one designed explicitly.\n\nI will go further: the failure to deeply consider https://t.co/Ljottl0yUT", "summary": "回应「公司即超级智能」论调，称组织确是狭义超级智能，并指出未能深入思考组织形态的问题。", "url": "https://x.com/emollick/status/2108177045511364998", "cat": "技术观点", "rq": true, "quoted": "Reminiscing about when people used to say dumb shit like \"we already have superintelligence, they're called corporations.\" Yes, who could forget that fateful day in October when Dicks Sporting Goods dropped dozens of Fields Medal worthy math discoveries on the world all at once.", "media": []}, {"id": "2108170825077531112", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-08 20:21", "tu": "2026-10-08T12:21:07.000Z", "text": "As a researcher who did early work on the productivity impacts of AI chatbots using RCTs, I’d note a lack of similar studies since the dawn of true agents last fall\n\nPartially that is newness & partially research design challenges, but I suspect we are missing some large effects. https://t.co/PIvKZzmD2u", "summary": "指出自真正 AI agent 出现以来，缺少类似其早期 chatbot 生产力 RCT 的研究，怀疑遗漏了较大影响。", "url": "https://x.com/emollick/status/2108170825077531112", "cat": "研究成果", "rq": false, "quoted": "", "media": []}, {"id": "2108062702778368023", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-08 13:11", "tu": "2026-10-08T05:11:28.000Z", "text": "Seriously https://t.co/vjdYpycmhg", "summary": "引用 Paul Graham 的观点并回“Seriously”：Amazon 封禁 AI 代理是它成立以来创业公司做 Amazon 竞品的第一个机会，人们会让代理替自己购物，且不想用 Amazon 自家的代理。", "url": "https://x.com/elonmusk/status/2108062702778368023", "cat": "行业动态", "rq": true, "quoted": "Amazon banning agents is the first opportunity I've seen since Amazon was founded for a startup to create an Amazon competitor. People will want agents to buy stuff for them. It will be one of the main use cases. And they won't want to use some Amazon-supplied agent to do it.", "media": []}, {"id": "2108062258618048625", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-08 13:09", "tu": "2026-10-08T05:09:43.000Z", "text": "RT @Google: Project Suncatcher is our moonshot exploring whether we can one day host machine learning infrastructure in space 🚀\n\nTo do so,…", "summary": "转发 Google：介绍登月项目 Project Suncatcher，探索未来把机器学习基础设施放到太空，正在测试 TPU 能否承受发射冲击及轨道辐射和温度环境。", "url": "https://x.com/elonmusk/status/2108062258618048625", "cat": "研究成果", "rq": true, "quoted": "Project Suncatcher is our moonshot exploring whether we can one day host machine learning infrastructure in space 🚀\n\nTo do so, we need to know whether our AI hardware can operate in orbit. Can our TPUs handle the physical stress of spaceflight and the radiation and thermal https://t.co/aDz7KRDinj", "media": []}, {"id": "2108062018490249347", "handle": "elonmusk", "name": "Elon Musk", "username": "elonmusk", "t": "2026-10-08 13:08", "tu": "2026-10-08T05:08:45.000Z", "text": "RT @JensenHuang: Awesome day, @satyanadella! \n\nWindows sparked a platform shift that created a new industry for NVIDIA. Then we invented pr…", "summary": "转发黄仁勋：回顾与微软的合作——Windows 带来平台转变、为 NVIDIA 开创新行业；为 DirectX 打造的可编程着色 GPU 催生了 CUDA；双方把 GPU 超算搬上 Azure，帮助 OpenAI 训练了 GPT。", "url": "https://x.com/elonmusk/status/2108062018490249347", "cat": "行业动态", "rq": true, "quoted": "Awesome day, @satyanadella! \n\nWindows sparked a platform shift that created a new industry for NVIDIA. Then we invented programmable shading GPUs for DirectX, which led to CUDA. \n\nThen we partnered to bring GPU supercomputers to Azure, which helped OpenAI train GPT. That https://t.co/2JiZinfW64", "media": []}, {"id": "2108027570382086435", "handle": "JeffDean", "name": "Jeff Dean", "username": "JeffDean", "t": "2026-10-08 10:51", "tu": "2026-10-08T02:51:52.000Z", "text": "Very sorry to hear this news. 😥\n\nI never had the chance to meet Margaret Hamilton, but her contributions to the flight software that got us to the moon are legendary.  I love this image of her standing next to the printouts of the Apollo code. https://t.co/2HJPXcTfiC https://t.co/AEsvOuFTvM", "summary": "引用 Margaret Hamilton 以 90 岁辞世的消息（她以在 MIT 领导阿波罗登月飞行软件开发闻名），表示哀悼，称她对登月飞行软件的贡献是传奇性的。", "url": "https://x.com/JeffDean/status/2108027570382086435", "cat": "其他", "rq": true, "quoted": "We’ve lost an icon. Margaret Hamilton, a computer science pioneer best known for her work at MIT leading development of the flight software for the Apollo missions to the moon, has died at 90. Read about her legacy via MIT News: https://t.co/ODkbdIsoHw https://t.co/M2xauYYUkU", "media": []}, {"id": "2108024511773937838", "handle": "demishassabis", "name": "Demis Hassabis", "username": "demishassabis", "t": "2026-10-08 10:39", "tu": "2026-10-08T02:39:43.000Z", "text": "RT @sundarpichai: Introducing EmbeddingGemma 2, a new open multimodal model that sets the standard for on-device efficiency.\n\n- our first o…", "summary": "转发 Sundar Pichai：发布开放多模态模型 EmbeddingGemma 2，是 Google 首个原生多模态开放嵌入模型，以 7.4 亿（740M）参数的轻量模块化形态处理文本、代码、图像、视频和音频，主打端侧效率。", "url": "https://x.com/demishassabis/status/2108024511773937838", "cat": "产品发布", "rq": true, "quoted": "Introducing EmbeddingGemma 2, a new open multimodal model that sets the standard for on-device efficiency.\n\n- our first open, natively multimodal embedding model\n- handles text, code, image, video, and audio tasks within a lightweight, modular 740M parameter form factor\n- ideal https://t.co/WwQxfBtRHq", "media": []}, {"id": "2108019398833549541", "handle": "jeremyphoward", "name": "Jeremy Howard", "username": "jeremyphoward", "t": "2026-10-08 10:19", "tu": "2026-10-08T02:19:24.000Z", "text": "RT @VikParuchuri: Looks like you copied Chandra OCR 2 into your repo, renamed it, changed the license, and made the output worse (your olmo…", "summary": "转发 Vik Paruchuri：指责对方把 Chandra OCR 2 复制进自己的仓库、改名并更换许可证，效果还更差（olmOCR 得分 83.8，对比 Chandra 的 85.8）。", "url": "https://x.com/jeremyphoward/status/2108019398833549541", "cat": "行业动态", "rq": true, "quoted": "Looks like you copied Chandra OCR 2 into your repo, renamed it, changed the license, and made the output worse (your olmocr score is 83.8 vs our 85.8). https://t.co/qKvnjgQhGb https://t.co/8oVy51Bfz7", "media": []}, {"id": "2108005474641838500", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 09:24", "tu": "2026-10-08T01:24:04.000Z", "text": "RT @RisingSayak: Was meant to be a Valentine's gift, but I'm releasing it early ❤️\n\nWrote a long piece on KV caching in flow models for ima…", "summary": "转发 Sayak Paul：发布一篇关于图像生成流模型中 KV 缓存的长文，包含直觉解释、实现细节、基准测试和一些实验。", "url": "https://x.com/huggingface/status/2108005474641838500", "cat": "研究成果", "rq": true, "quoted": "Was meant to be a Valentine's gift, but I'm releasing it early ❤️\n\nWrote a long piece on KV caching in flow models for image generation.\n\nIncludes intuition, commentary, implementation details, benchmarks, &amp; some quirky experiments.\n\nhttps://t.co/Ufrp5jZIf1", "media": []}, {"id": "2107997468671852922", "handle": "fchollet", "name": "Francois Chollet", "username": "fchollet", "t": "2026-10-08 08:52", "tu": "2026-10-08T00:52:15.000Z", "text": "Humans provide a fun comparison point here.\n\nIn the 80s, the \"cognitive consequences of programming\" was a major psychological research focus. The prevailing hypothesis was that learning formal logic and algorithmic structures through computer programming would act as a form of https://t.co/0g9JwVgrqR", "summary": "引用自己关于“参差能力前沿”的帖子，以人类作对比：80 年代心理学曾研究“编程的认知效果”，当时主流假设是学编程和形式逻辑能提升一般推理能力（借此讨论数学/代码能力是否会迁移）。", "url": "https://x.com/fchollet/status/2107997468671852922", "cat": "技术观点", "rq": true, "quoted": "What if the jagged frontier is mainly math + code (which you can push arbitrarily far with RLVR), and everything else starts to plateau because it is still bottlenecked by human generated data? \n\nModel performance in non-verifiable areas has kept improving steadily, albeit much", "media": []}, {"id": "2107973162591805605", "handle": "ylecun", "name": "Yann LeCun", "username": "ylecun", "t": "2026-10-08 07:15", "tu": "2026-10-07T23:15:40.000Z", "text": "RT @ylecun: @sakshjn @rsalakhu The 1991 version is an obscure tech report with a vague idea, no theory, no experiment to speak of, and cert…", "summary": "转发自己的回复：批评某篇 1991 年的技术报告只是一个模糊想法，没有理论、实验和代码，作者也从未继续推进，不应据此主张优先权。", "url": "https://x.com/ylecun/status/2107973162591805605", "cat": "技术观点", "rq": true, "quoted": "@sakshjn @rsalakhu The 1991 version is an obscure tech report with a vague idea, no theory, no experiment to speak of, and certainly no code, that the author never revisited or pushed. \nIt has one hand-drawn architecture diagram, one formula of the type f(x)=0, and a claim that every other", "media": []}, {"id": "2107964764316209326", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-08 06:42", "tu": "2026-10-07T22:42:18.000Z", "text": "Some early first-hand accounts of encountering a narrow superhuman intelligence as mathematicians grapple with the hundreds of big AI proofs released by OpenAI.\n\nProblems solved in inhuman ways that make us wonder what it means to actually know things... https://t.co/DgpHqbYKCR https://t.co/saiSe2pl3f", "summary": "分享数学家面对 OpenAI 发布的数百个重大 AI 证明的第一手感受，形容像遭遇一种“狭义的超人智能”：问题以非人类的方式被解决，让人反思“真正懂得”意味着什么。", "url": "https://x.com/emollick/status/2107964764316209326", "cat": "技术观点", "rq": false, "quoted": "", "media": []}, {"id": "2107940728009879622", "handle": "OpenAI", "name": "OpenAI", "username": "OpenAI", "t": "2026-10-08 05:06", "tu": "2026-10-07T21:06:47.000Z", "text": "RT @michpokrass: today we’re shipping gpt-6 and intelligent ui to everyone!\n\nintelligent ui is a bet on model intelligence. we’re letting g…", "summary": "转发 OpenAI 的 Michelle Pokrass：GPT-6 和 Intelligent UI 向所有人上线；Intelligent UI 是押注模型智能，让 GPT-6 用高实用性的可视化和交互组件填满画布，是 ChatGPT 的一次重大改变。", "url": "https://x.com/OpenAI/status/2107940728009879622", "cat": "产品发布", "rq": true, "quoted": "today we’re shipping gpt-6 and intelligent ui to everyone!\n\nintelligent ui is a bet on model intelligence. we’re letting gpt-6 fill the canvas with high utility visual and interactive components. it’s a pretty big change to chatgpt! we had to craft the right tools for gpt-6 to be https://t.co/3sFyDvgxkR", "media": []}, {"id": "2107939627898400819", "handle": "satyanadella", "name": "Satya Nadella", "username": "satyanadella", "t": "2026-10-08 05:02", "tu": "2026-10-07T21:02:25.000Z", "text": "Great to partner with NVIDIA as we kick off this next chapter for Windows.\n\nThank you @JensenHuang and @sriramk for joining us today! https://t.co/Jh1os7T9Zu", "summary": "感谢 NVIDIA 在 Windows 新篇章启动中的合作，并感谢黄仁勋和 Sriram Krishnan 到场。", "url": "https://x.com/satyanadella/status/2107939627898400819", "cat": "行业动态", "rq": false, "quoted": "", "media": ["video"]}, {"id": "2107938889004396561", "handle": "emollick", "name": "Ethan Mollick", "username": "emollick", "t": "2026-10-08 04:59", "tu": "2026-10-07T20:59:29.000Z", "text": "Had early access to the Intelligent UI experience and it was a nice change from walls of text. It also suggests that, increasingly, we are going to see interfaces built on demand for the problem that you have. https://t.co/UMPsP6lzYz", "summary": "引用 OpenAI 的 GPT-6 发布帖，说自己提前体验过 Intelligent UI，比满屏文字清爽；认为今后会越来越多地看到针对具体问题按需生成的界面。", "url": "https://x.com/emollick/status/2107938889004396561", "cat": "技术观点", "rq": true, "quoted": "GPT-6 and Intelligent UI, now rolling out in ChatGPT for everyone.\n\nIntelligent UI in ChatGPT delivers fast, interactive answers that make everyday questions more visual, complex topics easier to grasp, and interactive tools for your task available on the spot. https://t.co/XL2gDCPBwG", "media": []}, {"id": "2107929853676990731", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 04:23", "tu": "2026-10-07T20:23:35.000Z", "text": "RT @ClementDelangue: If you need any more evidence about how exciting local AI (and llamacpp) is! From the @Microsoft windows launch today…", "summary": "转发 Clément Delangue：称微软 Windows 发布会再次证明本地 AI 和 llama.cpp 有多令人兴奋。", "url": "https://x.com/huggingface/status/2107929853676990731", "cat": "技术观点", "rq": true, "quoted": "If you need any more evidence about how exciting local AI (and llamacpp) is! From the @Microsoft windows launch today with @satyanadella @sriramk @JensenHuang https://t.co/mN7gkgj2Rd", "media": []}, {"id": "2107929676358300047", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 04:22", "tu": "2026-10-07T20:22:52.000Z", "text": "RT @_philschmid: EmbeddingGemma 2 is out! Our first native multimodal embeddings built on Gemma 4 under Apache 2.0. 🤗 Embeds 100+ languages…", "summary": "转发 Philipp Schmid：EmbeddingGemma 2 发布，基于 Gemma 4、Apache 2.0 许可的首个原生多模态嵌入模型，支持 100+ 语言及代码、图像、音频、视频，8192 上下文，提供 740M/440M/570M/270M 多个版本，MTEB 提升 14%。", "url": "https://x.com/huggingface/status/2107929676358300047", "cat": "产品发布", "rq": true, "quoted": "EmbeddingGemma 2 is out! Our first native multimodal embeddings built on Gemma 4 under Apache 2.0. 🤗 Embeds 100+ languages, code, images, audio, and video into one vector.\n\n🧮 8,192 context\n3️⃣ 740M omni, 440M text+vision, 570M text+audio, or 270M text-only\n📈 +14% jump on MTEB", "media": []}, {"id": "2107929604149403673", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "2026-10-08 04:22", "tu": "2026-10-07T20:22:35.000Z", "text": "RT @liquidai: Choose d1-3B for high-quality text and vision decisions, or explore our experimental d1-omni-600M when footprint matters.\n\nDo…", "summary": "转发 Liquid AI：d1-3B 适合高质量文本与视觉决策，实验性的 d1-omni-600M 适合对体积敏感的场景；权重可下载、微调并本地部署。", "url": "https://x.com/huggingface/status/2107929604149403673", "cat": "产品发布", "rq": true, "quoted": "Choose d1-3B for high-quality text and vision decisions, or explore our experimental d1-omni-600M when footprint matters.\n\nDownload the weights, fine-tune, and deploy locally.\n\n&gt; Blog: https://t.co/15X98RRo3l\n&gt; d1-3B: https://t.co/3iSPY67UXL\n&gt; d1-omni-600M:", "media": []}, {"id": "2107929574206218545", "handle": "huggingface", "name": "Hugging Face", "username": "huggingface", "t": "20
